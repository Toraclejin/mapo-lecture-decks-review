 sub:'<b>최저시급</b>으로 계산한 겁니다 — 여러분 시간값이 그것보다 쌀 리는 없습니다',
 land:'<b>이 두 시간이 그냥 지나가면</b> — 그 돈은 <em>그냥 없어진 겁니다</em>',
 say:['“지금 <b>몇 분 계시죠?</b>” — <b>실제로 세면서</b> 곱한다. 준비된 대사로 들리면 죽는다','“최저시급으로만 쳐도 <b>이 방에서 지금 이만큼</b>이 쓰이고 있어요”','“한 분 기준으로는 <b>2만원 좀 넘고요</b>. 세 번 다 나오시면 <b>6만원</b>”','“<b>그냥 지나가면 그 돈은 없어지는 거예요</b>”','⛔<b>죄책감을 주지 말 것</b> — 다음 장에서 «그래서 확실히 드린다»로 바로 받는다'],
 note:'★<b>총액을 화면에 안 박은 이유</b> — <b>인원이 미정</b>이고(담당자 회신 대기), 미리 박힌 숫자는 <b>준비된 대사</b>로 들린다. <b>현장에서 세는 것</b>이 훨씬 세고, 세는 동안 <b>참여</b>가 된다.<br>⚠️<b>10,320원 = 2026년 최저시급</b>(고용노동부 고시 2025-47호, 2026-01-01 시행). <b>연 1회 바뀐다</b> — 해가 넘어가면 <b>반드시 교체</b>. 2만 640원 = 10,320 × 2.<br>⛔<b>죄책감 유발 금지</b> — 이 장은 <b>다음 장으로 가는 다리</b>다. 여기서 멈추면 «시간 아깝게 만든 사람» 프레임이 강사에게 붙는다.<br>⏱ 40초.<br>★<b>2026-08-18 문장 손질</b> — sub 끝이 <i>“쌀 리가 없고요”</i>로 <b>화면에서 말이 끊긴 채 매달려</b> 있었다(구어 「~고요」·표현규율 규칙 5) → <b>“쌀 리는 없습니다”</b>. 바로 아래 착지(<i>“그 돈은 그냥 없어진 겁니다”</i>)와 어미가 맞아 두 줄이 한 호흡으로 읽힌다. say의 <i>“2만원 좀 넘고요”</i>는 강사 발화라 그대로 뒀다.'},

{sec:'강의의 목적',kick:'그런데 방금 그 계산 — <b>바닥값</b>',t:'big',

 note:'★★<b>2026-08-15 신설(강사 지시).</b> <i>“최저임금은 기준일 뿐, 미래가치·부가가치를 더하면 단순 계산으로 못 내놓는 금액이다.”</i><br>★★★<b>⛔「여러분은 엄청난 가치를 창출할 인재」로 가지 말 것.</b> 지금 실제로 떨어지고 있는 방이다 — <b>띄워주면 거리감</b>이 생기고, 이 강의 톤(옆자리 형·저부담)과 정면충돌한다.<br>★<b>대신 「모른다」로 간다.</b> <i>“나중에 뭘 만들지는 아무도 못 센다”</i> — 이건 <b>과장이 아니라 사실</b>이고, 사실이라서 힘이 있다.<br>★<b>근거를 강사 1인칭으로만 댄다</b> — 「2년 400군데 → 그 뒤 10년」. 4~5분 소개의 숫자를 여기서 <b>한 번 더 쓴다</b>(반복이 아니라 회수).<br>⛔<b>“그러니 열심히 들으세요”로 닫지 말 것</b> — 다음 장이 「그래서 두 개는 확실히」로 받는다.<br>⏱ 40초.<br>★<b>2026-08-18 글자 축약</b> — kick 끝 "입니다" 삭제.'},

 sub:'<b>부담되는 건 오늘 하나도 없습니다</b> — 할 일은 <em>듣는 것</em>뿐<br><small><b>쉬는 시간 40분쯤 10분</b> — 편하실 때 다녀오셔도 됩니다</small>',
 say:['①②는 빠르게 · <b>③을 제일 길게</b>','“<b>발표 없고 조별 없고 제출 없어요</b>”','<b>휴식 시각을 못 박을 것</b> — 「40분쯤에 10분」. ⚠️2026-08-12 휴식을 62→72분으로 미뤘다. 미리 고지가 조건이다(강사 결정)'],
 note:'이게 없으면 120분 내내 “지금 뭐 하는 거지?”가 된다. 1분 30초.<br>저동기 청중은 <b>‘안 해도 된다’에 안심</b>한다 — 그래서 ③에 시간을 더 쓴다.<br>★<b>2026-08-10 계열화(강사 지적).</b> 구버전은 2·3·5개로 칸마다 개수가 달라 <b>눈이 갈 곳을 못 정했다.</b> 「알게 되는 것/가져가는 것」도 구분이 흐릿했다.<br>→ <b>동사로 계열화(알게 됩니다 · 남습니다 · 안 합니다) + 각 칸 3개로 통일.</b> 「진로가 안 정해지는 이유」를 ①에 넣어 <b>오프닝부터 양축</b>이 선다.<br>★★<b>2026-08-11 시인성 3건(강사 지적).</b> ⓐ<b>제목이 세 칸 이름을 그대로 되풀이</b>했다 — 화면에서 제일 큰 글씨가 <b>정보를 하나도 안 더한다</b> → <b>「뭘 가져가고, 뭘 안 하나」</b>로 대비만 세우고 <b>세부는 칸이 맡는다.</b> ⓑ<b>③칸만 부연이 하나뿐</b>이라 세로가 어긋나고 오른쪽이 휑했다 → 세 항목 모두 한 줄씩. ⓒ<b>③은 성격이 반대편인데 1px 구분선뿐</b>이라 ①②와 동급으로 읽혔다 → <b>옅은 바탕</b>(CSS `.cols>div.no`). ⛔붉은 바탕은 쓰지 않았다 — 이 칸은 경고가 아니라 <b>안심</b>을 주는 칸이다.<br>★<b>착지 교체</b> — <i>“세 칸이 머리 · 손 · 부담 순입니다”</i>는 <b>설계자의 배열 설명</b>이지 청중에게 주는 말이 아니었다(「부담 순」이 무슨 뜻인지 청중은 모른다) → <b>“부담되는 건 오늘 하나도 없습니다”</b>. note가 말한 이 장의 목적(<i>“저동기 청중은 ‘안 해도 된다’에 안심한다”</i>)을 <b>착지가 직접</b> 수행한다.<br>★<b>2026-08-18</b> — sub 필러("여러분이"·"그 전에도") 삭제, 뜻 그대로.'},

{sec:'오늘의 지도',t:'dict',h:'제목의 <em>‘잠입’</em> 뜻',
 word:'잠입', hanja:'潛入',
 defs:[[1,'남몰래 숨어듦',0],
       [2,'물속에 잠겨 들어감',0]],
 src:'표준국어대사전',
 sub:'<b>1번과 2번 — 공통점은?</b><br><br><small style="opacity:.5">…</small>',
 say:['사전 두 뜻을 <b>먼저</b> 읽어준다','★<b>상품을 먼저 건다</b> — “맞히시는 분 <b>커피 쿠폰</b> 드릴게요” <i>(화면엔 없다 · 말로만)</i>','“<b>이 1번하고 2번</b> — 공통점이 뭐죠?”','받고 — “<b>둘 다 들어가요</b>”','★<b>쿠폰은 그 자리에서</b> 보낸다 — ⛔연락처 받지 말 것','“<b>왜</b> 들어갈까요? — <b>들어가야만 보인다고 믿으니까</b>”'],
 note:'★★<b>놀라움 ① — 1/2장.</b> 여기선 <b>사전 뜻 두 개만</b> 띄운다.<br>⛔⛔<b>③번을 이 장에 넣지 말 것.</b> 답이 화면에 미리 보이면 <b>놀라움①이 죽는다</b> — 청중은 질문을 받기 전에 답을 읽는다. <i>(2026-08-07 강사 지적 — 구버전은 세 뜻을 한 장에 다 띄우고 sub에 답까지 적어놨다)</i><br>★<b>“두 뜻의 공통점”이라고 말하지 말 것.</b> 어느 둘인지 모호하다 → <b>“이 ①번하고 ②번”</b>으로 손으로 짚으며 지시한다.<br>⚠️<b>2번 뜻(물속)을 진단부 “물이 차오른다”와 엮지 말 것.</b> 비유가 이미 많고(모래시계·물·요리·CCTV·자·지도) <b>방향도 반대</b>다(물=당하는 것 / 잠입=내가 하는 것). <b>“둘 다 들어간다”만</b> 짚는다.<br>★★<b>2026-08-10 상품 걸기(강사).</b> <b>맞히는 분께 커피 쿠폰</b> — ⛔<b>화면에는 절대 넣지 않는다</b>(강사 지시). 화면에 쓰면 <b>경품 이벤트처럼 보이고</b>, 말로 걸어야 <b>즉흥적인 판</b>이 된다.<br>★<b>여기가 첫 발화 유도 지점</b>이다 — 0~7분은 강사만 말했다. <b>공짜로 답이 나오는 질문</b>(둘 다 들어간다)에 상품을 걸면 <b>손드는 비용이 0</b>이 된다.<br>⛔<b>연락처를 받지 말 것</b> — 그 자리에서 보내거나 실물로 준다. 공공기관 강의라 <b>개인정보 수집은 피한다.</b> 강사 사비 · 담당자와 정산하지 않는다.<br>★<b>화면은 「1」「2」로 뜬다</b>(dict 렌더러) — 발화·부제도 <b>①②가 아니라 1·2</b>로 맞춘다.<br>⏱ 20초.'},

{sec:'오늘의 지도',t:'big',big:'1번도 2번도 —<br><em>“들어간다”</em>입니다',
 sub:'<div class="axpair"><div><span class="axl">1</span><span class="axt">남몰래 숨어<b>듦</b></span></div><div><span class="axl">2</span><span class="axt">물속에 잠겨 <b>들어감</b></span></div></div><br>그럼 <b>왜</b> 들어갈까요? &nbsp;<small style="opacity:.45">…</small> &nbsp;<b>안에 있어야 알 수 있다고 생각하니까요</b><br><em>대부분 취업도 진로도 그렇게 생각합니다</em> — “일단 들어가고 나서 보자”',
 land:'그래서 다들 — <b>들어가는 법</b>부터 찾습니다',
 say:['두 뜻을 <b>다시 짚으며</b> — “둘 다 <b>들어간다</b>죠”','“<b>그럼 왜 들어갈까요?</b>” — 받지 말고 바로','“<b>안에 있어야 알 수 있다고 생각하니까요</b>”','“<b>대부분 취업도 진로도</b> 그렇게 생각하죠 — 일단 들어가고 나서 보자”'],
 note:'★★<b>2026-08-10 신설(강사 지적).</b> 대본은 <b>세 박자</b>(①공통점 → ②왜 들어가나=믿음 → ③안 들어간다)인데 <b>화면은 두 장뿐</b>이었다. 가운데 <b>「믿음」이 화면에서 비어 있었다.</b><br>★<b>이 장이 다음 장 반전의 근거다.</b> 대본 주석이 <i>“뒤집는 대상은 뜻이 아니라 믿음 — 이 전제를 소리 내어 짚어야 세 번째 뜻이 반전으로 선다”</i>고 했는데, <b>짚을 화면이 없었다.</b><br>⛔<b>여기에 ③번(오늘의 뜻)을 넣지 말 것.</b> 반전은 다음 장 자산이다 — 이 장은 <b>「들어간다」는 전제를 세우는 것</b>까지.<br>⏱ <b>시간은 늘지 않는다</b> — 이 발화는 이미 「제목 해소 40초」 안에 있었다. <b>화면만 붙인 것.</b><br>★<b>2026-08-10 문장 교정(강사 지적 · 표현규율 제9조).</b> 초판은 <i>“둘 다 — 들어갑니다”</i>만 띄워 <b>「둘」이 뭔지 화면에 없었다</b>(앞 장을 기억해야 이해됨 = <b>혼자 못 서는 장</b>). → <b>두 뜻을 다시 띄우고</b> 공통 글자를 굵게.<br>★ <i>“들어가야만 보인다고 믿으니까요”</i> → <b>“안에 있어야 알 수 있다고 생각하니까요”</b>. 「믿음」은 강사 분석 용어다 — 청중에게는 <b>평범한 말</b>로.<br>★★<b>2026-08-10 순서 교정(강사 지적).</b> <i>“취업도 진로도 그렇게 생각합니다”</i>는 <b>「왜 들어가나」의 예시</b>지 이 장의 결론이 아니다 — 착지 칸에 있으면 <b>딴 얘기로 튀어 보인다.</b> → <b>「안에 있어야 알 수 있다」 바로 밑</b>으로 내렸다.<br>★<b>새 착지는 다음 장을 부른다</b> — “다들 들어가는 법부터 찾는다” → 다음 장 <b>“그런데 오늘 하는 잠입은 안 들어갑니다”</b>가 정면으로 받는다.<br>★<b>「진로」를 같이 부른다</b> — 취업만 말하면 진로 축이 끊긴다(반복 지적).<br>★<b>화면 숫자는 「1」「2」</b> — 앞 장 dict 렌더러가 그렇게 뜬다. ①②로 쓰면 화면과 어긋난다.'},

{sec:'오늘의 지도',t:'dict',h:'이번 강의에서 하는 잠입은 — <em>안 들어갑니다</em>',
 word:'잠입', hanja:'潛入',
 defs:[[1,'남몰래 숨어듦',0],
       [2,'물속에 잠겨 들어감',0],
       [3,'<b>들어가지 않고, 밖에서 안을 읽어내는 것</b>',1]],
 src:'①② 표준국어대사전',
 sub:'뒤집는 것은 <em>뜻</em>이 아니라 <b>생각</b> — “들어가야만 보인다”<br><br><b>카페에 편하게 앉아서</b> · 정장 없이 · 커피 마시면서<br><em>그 회사 전략기획실에서 오갔을 이야기를 — <b>3회에 걸쳐</b> 밖에서 읽습니다</em>',
 say:['“근데 <b>우리는 안 들어갑니다</b>”','③번 점등','“<b>그것도 카페에 편하게 앉아서요</b>”'],
 note:'★★<b>놀라움 ① — 2/2장.</b> 질문을 받고 *“왜 들어갈까요 → 들어가야만 보인다고 믿으니까”*를 짚은 <b>뒤에</b> 넘긴다.<br>★<b>뒤집는 대상은 “뜻”이 아니라 “믿음”이다.</b> 이 전제가 곧 <b>강의 전체의 표적</b>(취업=들어가야 아는 것 → 밖에서 읽어낼 수 있는 것). 말장난이 아니라 <b>정의를 통한 반전</b>이라 더 세다.<br>★<b>“밖에서 읽어낸다”만으로는 그림이 안 선다.</b> <b>“카페에 편하게 앉아서”</b> 한 줄이 제목을 실물로 만든다 — <b>잠입인데 잠입하지 않는</b> 그림. <i>(2026-08-07 신설)</i><br>⛔<b>‘VVIP’ 같은 표현 금지.</b> 특권·과장 뉘앙스가 붙어 이 강의의 톤(“위로가 아니라 방법” · 저부담)과 어긋난다. <b>“편하게 앉아서”까지만.</b><br>⏱ 20초.'},

{sec:'오늘의 지도',img:'../이미지/포폴/포폴_01.png',imgcap:'논픽션 성수 현장관찰 리포트',imgq:'<b>논픽션 포트폴리오 실물</b> — <b>표지 또는 첫 장 1장만</b> <i>(⛔브랜드명이 보이면 가릴 것 · 종장과 동일본)</i>',
 t:'big',big:'이건 제가 만든 <em>서류</em>입니다',
 sub:'어느 매장에 들어갔다가 <b>뭔가 이상해서</b> — 그걸 뜯어보고 만든 것입니다<br><small>어디인지는 <b>이따 나옵니다</b></small>',
 land:'오늘부터 3주 — <b>이걸 「여러분 것」으로 만드는 법</b>을 나눠 드립니다',
 say:['<b>말없이 3초</b> 띄운다','“이거 제가 만든 거예요”','⛔ <b>어디인지 말하지 말 것</b> — 82분에 공개'],
 note:'★★<b>2026-08-10 신설(강사 지적).</b> <i>“청중이 마지막 날에 자신들도 저 정도는 할 수 있게 되면 좋겠다는 시각으로 시작”</i>. <b>목적지를 처음에 보여준다</b> — 68번(3주 뒤 한 문장 먼저)·69번(검색어 문제 앞배치)과 같은 패턴이고 둘 다 효과를 봤다.<br>★<b>이걸로 CT 메모 13분을 견딜 이유가 생긴다.</b> <i>“그래서 이거 왜 배워요”</i>가 도구 구간에서 나오지 않게 하는 장치.<br>⛔<b>여기서 열지 말 것 — 셋 다.</b> ①<b>브랜드명·장소</b>(82분 통합 블록 자산) ②<b>7단 목차</b>(2회차 클라이맥스 자산) ③<b>만든 과정</b>(다음 장에서 3단계로만).<br>⚠️<b>과약속선 주의.</b> <i>“여러분도 3주 뒤 완성한다”</i> ✗ → <b>“만드는 법을 나눠 드린다”</b> ✓. 바로 뒤 약속선 장이 이 톤을 이어받는다.<br>★<b>종장이 이 장의 회수가 된다</b> — 구버전은 종장이 <b>첫 공개</b>였다(3분). 이제 <i>“아침에 보여드린 그 서류”</i>로 받아 <b>출발점만</b> 짚는다. <b>놀라움이 「이게 뭐지」에서 「저게 짜증 한 줄에서 나왔다」로 이동</b>한다.'},

 note:'★★<b>2026-08-10 신설(강사 설계) · 같은 날 전면 재작성(강사 지적).</b><br>⚠️<b>초판이 강사 시점 메타 언어였다.</b> <i>“나가는 길에 장비를 다 챙깁니다”</i>·<i>“돌아오는 길이 2회차와 3회차”</i> — <b>「나가는 길/돌아오는 길」이라는 틀을 청중은 아직 모르는데</b> 그걸 전제로 쓴 문장이었다. 강사만 이해되는 글.<br>→ <b>청중 언어로 전면 교체.</b> 노드 밑에 <b>「무엇을 하는지」</b>를 평범한 말로 달고(내가 뭘 할 때 살아나는지 / 밖에서 걸린 것 / 가서 더 본 것 / 그 회사를 뜯어본다 / 내 방향으로 정리한다), 본문도 <b>강사 1인칭 서술</b>로 바꿨다.<br>⚠️<b>회색 상자를 뺐다.</b> 무슨 뜻인지 화면만 봐선 알 수 없었다 → <b>얇은 괄호선 + “오늘 배우는 것”</b> 라벨로. 회차 구분은 이미 <b>색(검정 실선 / 파랑 점선)</b>이 하고 있어 상자는 중복이었다.<br>★<b>진로 축 보완(강사 지적).</b> 초판은 노드가 전부 도구·회차 이름이라 <b>회사 얘기로만</b> 읽혔다 → 출발 나에 <b>“내가 뭘 할 때 살아나는지”</b>, 도착 나에 <b>“내 방향으로 정리한다”</b>, 착지에 <b>“어디로 갈지가 좁혀져 있습니다”</b>. <b>왕복 자체가 진로다</b> — 출발도 나, 도착도 나.<br>⛔<b>각 지점의 「내용」은 비워둔다.</b> 82분 통합 블록(1회차 정점)이 3칸을 실물로 채우는 자리다.<br>★<b>2026-08-10 낱말 교체(강사 제안).</b> <b>회사 → 바깥</b>, <b>시장 → 세상</b>. 「회사」는 <b>취업 전용어</b>라 진로가 안 걸렸다 — 「바깥」이면 <b>회사·직무·분야</b>를 다 품는다. 「시장」은 경영 용어이고, 도구③ 구간 이름이 이미 <b>「세상 구조는 어디서 보나」</b>라 <b>세상</b>이 더 일관된다.<br>⚠️<b>벤다이어그램은 아직 「시장」이다</b>(1·2·3회차 앵커). 통일할지는 별도 결정 — 바꾸면 관통도·2회차·3회차를 함께 고쳐야 한다.<br>★<b>2026-08-18</b> — sub 필러("~했습니다."·"그걸 다시") 정리, 서사 순서·뜻은 그대로.'},

 land:'진단만 하면 <b>무력해지고</b>, 도구만 주면 <b>왜 하는지를 모릅니다</b>',
 say:['위 세 칸 <b>먼저</b> — 왼쪽에서 오른쪽으로','아래 세 칸 — “<b>각각 짝이 있어요</b>”','“그래서 <b>짝을 지었습니다</b>”'],
 note:'★★<b>2026-08-06 · 진단부의 첫 장.</b> 구버전은 앞에 시총·영화 2장이 있었는데 <b>둘 다 ②산업의 근거</b>라 뒤로 내렸다. 이제 <b>구조 설명 → ①세계 점등 → 근거</b> 순서가 깨끗하다.<br>★<b>2026-08-10 도식화(강사 지적).</b> 구버전은 <b>좌우 2열 표</b>라 짝이 「같은 줄」로만 표시돼 눈에 안 들어왔다 → <b>위=문제 / 아래=대응</b> 두 줄로 세우고 <b>세로 화살표</b>로 짝을 그렸다. <b>왼쪽에서 오른쪽으로 읽으면 바로 구분된다.</b><br>⚠️<b>번호가 교차하는 게 보인다</b> — 위는 ③②① 순, 아래는 ①②③ 순. <b>진단은 먼 것부터, 도구는 가까운 것부터</b> 가기 때문이다. 구버전은 이걸 글로 설명했는데, 이제 <b>화면이 스스로 보여준다</b> — 굳이 말로 풀지 않아도 된다.<br>⏱ 40초. <b>칸을 읽어주지 말 것</b> — 짝이 있다는 것만 짚고 넘어간다.<br>★★<b>2026-08-10 위치 이동(강사 지적 — “이건 강의 설명 구조잖아?”).</b> 이 장은 <b>강의 전체 설계</b>인데 <b>세션 1 대문 뒤</b>에 있어 <b>「진단의 일부」로 읽혔다</b> → <b>도입부(약속선 뒤)</b>로.<br>★<b>모래시계와 같은 그림을 두 번 그리고 있었다</b>(위=문제 / 아래=도구). 떼어놓으니 <b>이 장은 예고, 모래시계는 실행</b>이 된다 — 붙이면 중복이 도드라진다(강사가 물은 “18번 뒤” 안을 그래서 안 골랐다).<br>★<b>제목 「오늘의 구조」 → 「이 강의의 구조」</b> — 3회 전체 설계다.<br>★<b>바로 뒤 「덜 필요하신 분」보다 먼저여야 한다</b> — 그 장이 <i>“①은 가볍게, 뒤 두 개로”</i>라고 하는데 <b>도구가 3개라는 걸 여기서 알아야</b> 이해된다.'},

 note:'★★<b>2026-08-10 신설(강사 제안 — “이 강의가 도움되지 않는 분들”).</b> 강사가 스스로 <i>“말이 너무 쎈가?”</i>라고 물었다 — <b>맞다. 각도를 틀었다.</b><br>⚠️<b>공공기관 강의다.</b> 참가자는 <b>이미 신청하고 앉아 있고 나갈 수도 없다.</b> <i>“당신은 도움 안 됩니다”</i>는 그 사람에게 <b>2시간을 버리라는 말</b>이 되고 담당자에게도 곤란하다 → <b>배제가 아니라 「사용법」으로.</b><br>★<b>사실 셋 다 도움이 된다</b> — 교사·의사도 <b>어느 학교·어느 병원</b>을 고른다. 진로가 정해졌으면 <b>① CT(나)는 덜 필요하고 ②③(회사·시장)은 그대로 필요</b>하다. 그래서 이 장이 <b>도구 3개의 구조를 한 번 더 설명하는 자리</b>가 된다.<br>★<b>약속선(두 장 앞)의 짝이다</b> — 거기가 <b>“안 해드리는 것”</b>, 여기가 <b>“덜 필요하신 분”</b>. 둘 다 <b>먼저 빼서 신뢰를 만드는</b> 장치다.<br>★<b>③은 자기 반박</b> — 「메모 알레르기」를 강사가 먼저 말하고 <b>“그래서 15초로 만들었다”</b>로 받는다. 73번(손 들기 3단)에서 다시 확인된다.<br>⛔<b>“도움 안 됩니다” 금지</b> · ⛔특정 학과를 낮잡는 톤 금지.<br>⏱ 30초.<br>★<b>2026-08-18</b> — items 두 칸 small 필러("~개의 일입니다"·"정리도 안 하고, 검사도") 키워드로 압축.'},

 note:'★<b>2026-08-10 4차(강사 지적 2건).</b> ①<b>kick을 다음 장으로 옮겼다</b> — 맨 위 <i>“회사의 언어는 엑셀”</i>과 본문 <i>“사라진 자리”</i>가 <b>서로 다른 얘기</b>였다. 논리 순서는 <b>1층이 사라졌다 → 사람은 2층으로 → 그 2층의 언어가 엑셀</b>이라 엑셀은 <b>다음 장</b> 자리다.<br>②<b>대체물을 되살렸다</b> — 3차에서 다 뺐더니 <b>강사가 아홉 개를 매번 말해야</b> 했다. 직업명은 크게·취소선, 대체물은 <b>작고 파랗게 아래</b>에 — <b>읽지 않아도 되는 보조 정보</b>로 위계를 잡았다. 강사는 <b>줄 그어진 것만 짚으면</b> 된다.<br>★<b>2026-08-10 시인성 3차 재작업(강사 지적 3회).</b> 1차는 sub 분리, 2차는 3×3 묶음 — <b>둘 다 실패</b>했다. 원인을 잘못 잡았기 때문이다.<br>⚠️<b>진짜 원인: 이 장은 「읽는 장」이 아니라 「양을 보는 장」인데 읽을 것을 계속 늘렸다.</b> 대체물(무인정산기·하이패스…)은 <b>청중이 이미 아는 것</b>이라 화면에 있을 이유가 없었다. 범주 이름(계산·수납…)도 <b>내가 만든 분류</b>라 부담만 늘렸다.<br>→ <b>분야 박스 3개 × 3개.</b> 박스마다 <b>대체 방식</b>을 한 줄로(기계가 받는다 / 화면·앱이 받는다 / 로봇이 한다) — 강사가 <b>박스 이름만 짚어도</b> 설명이 된다. 직업명은 옅은 취소선, 대체물은 <b>직업명의 80% 크기</b>로 키워 읽히게.<br>★<b>2026-08-10 5차 — 22번과 같은 구조로(강사 지적).</b> 세로 3열은 <b>눈이 좌→우로 가는 방향과 어긋났다</b>. → <b>왼쪽 분야 박스 + 오른쪽 가로 3칸</b>으로. <b>22번(층 박스 + 내용)과 같은 문법</b>이라 진단부 전체가 한 언어로 읽힌다.<br>⚠️ 가로 배치 덕에 <b>글자를 키웠다</b>(직업 40 · 대체물 32 = 80%). 빈 칸을 폭으로 쓰면 크기를 벌 수 있다. 제목이 「사라진 자리」인데 <b>그림이 그대로 그 뜻</b>이다. 설명 문장은 <b>착지 한 줄</b>로. 대체물과 주차 관리인 예시는 <b>말로</b>(진행 큐에).<br>⚠️<b>취소선은 「옅게」.</b> 1차 시안은 진한 파랑 4px이라 <b>난도질처럼 보였다</b>(강사 지적) — <b>지금 실제로 떨어지고 있는 방</b>에서 그 그림은 공격적이다. 회색 2px로 낮췄다. <b>사라졌다는 사실은 남기되, 때리지 않는다.</b><br>★<b>2026-08-08 재프레임</b>: 층 틀이 앞 장에서 먼저 서고, 이 장은 <b>「1층 침수」의 사례 보고</b>다.'},

" font-size="33" font-weight="800" fill="var(--ac)">그 처방대로 올라간 자리부터</text><text x="952" y="346" text-anchor="middle" font-size="40" font-weight="800" fill="var(--ac)">잠기기 시작</text><text x="952" y="376" text-anchor="middle" font-size="24" font-weight="700" fill="var(--body)"></text></svg>',

 land:'준비 부족이 아니라 — <b>처방대로 올라간 곳에 물이 먼저 찬 것</b>입니다',
 say:['윗줄 <b>현상</b> — “직업 단위로만 봤어요 / 근데 지금은 <b>같은 직업 안에서 신입만</b>”','아랫줄 <b>처방</b> — “여러분은 <b>그 처방대로 올라온 사람들</b>이에요”','“<b>준비를 안 한 게 아니에요</b>”'],
 note:'★<b>이 장이 진단부에서 가장 중요한 논리 전환</b>이다. 전 직종에 해당하므로 <b>어떤 직무 지망이든 자기 얘기로 듣는다.</b><br>★<b>이유1의 착지</b> — <b>여기서 청중이 “내 탓이 아니구나”를 처음 느낀다.</b><br>★<b>2026-08-10 두 장 합침(강사 지적).</b> 구 24(잣대)·25(처방)는 <b>같은 구조의 좌우 대비</b>였다 — 따로 두면 같은 형식이 두 번 반복돼 둘 다 약해진다. <b>2×2</b>로 놓으니 <b>「당시 ↔ 실제」가 한 축, 「잣대 ↔ 처방」이 다른 축</b>으로 서고, <b>오른쪽 열(실제)</b>을 강조 박스로 묶어 무게가 잡혔다. <b>-1장</b>.<br>⚠️특정 직업을 위험/안전으로 단정하지 말 것 — <b>예시로만.</b><br>★<b>2026-08-18 문장 손질</b> — h가 <i>“예측이 <b>빗나간 게 아닙니다</b>”</i>인데 sub 첫 줄이 <i>“<b>예상과는 전혀 다른 일이 벌어졌습니다</b>”</i>여서 <b>같은 화면에서 서로를 부정</b>했다(빗나가지 않았다 ↔ 예상과 전혀 달랐다) → 대본 원문(<i>“예측이 빗나간 게 아니라, 다른 일로 <b>재고</b> 있었던 거예요”</i>)과 도식 왼쪽 열(<b>직업 단위</b>)에 맞춰 <b>“재는 단위가 달랐던 겁니다”</b>로. h→sub→land(<i>“처방대로 올라간 곳에 물이 먼저 찬 것”</i>)가 한 방향으로 선다. 도식·say는 그대로.'},

 say:['“제 얘기가 아니라 <b>여러분 연대기</b>예요”','<b>윗줄 먼저</b> 왼쪽에서 오른쪽으로 — “취업은 이렇게 됐고요”','<b>아랫줄</b>만 다시 — “<b>진로는 이렇게 흔들렸어요</b>”','아랫줄만 다시 짚으며 — “<b>가리킨 방향이 계속 바뀌었죠</b>”','짚으면서 — “<b>2016년</b>에 뭐 하고 계셨죠?”','⛔<b>나이를 단정하지 말 것</b> — 청중은 10대 후반~30대다'],
 note:'★<b>2026-08-10 진로 축 구체화(강사 지적).</b> 구버전 진로 칸은 <b>전부 비유</b>였다(“해볼 기회가 사라짐”·“그 신호가 뒤집힘”) — 청중 나이대가 10대 후반~30대로 넓어 <b>자기 경험에 못 붙였다.</b> → <b>겪었을 장면</b>으로 바꿨다(먼 얘기로 봄 → 코딩 → 멈춤 → 개발자 → 그 자리가 줄음 → 이번엔 AI) — ★첫 칸을 <b>“AI 배워야 하나”가 아니라 “먼 미래 얘기로 생각했다”</b>로 둔 이유(2026-08-10 강사 제안): 앞엣것은 <b>이미 반응한 사람</b>의 말이라 뒤의 「속도」 논지가 약해진다. <b>“그땐 남 얘기 같았는데 이렇게 빨리 왔다”</b>가 이 장이 하려는 말이다. 아랫줄만 훑으면 <b>“남이 가리킨 방향은 계속 바뀐다”</b>가 저절로 읽힌다 — 이 강의의 본론과 바로 맞물린다.<br>★코로나는 <b>한 해가 아니라 구간</b>이라 2020~2021을 브래킷으로 묶었다. 생성형 AI는 <b>2022 부제(ChatGPT 공개)</b>로 넣었다.<br>⛔<b>2018년(주 52시간제·최저임금)은 넣지 않는다.</b> ①이 장의 논지는 <b>“취업과 진로가 같은 속도로 흔들렸다”</b>이지 연표 완성이 아니다 ②열이 7개가 되면 박스가 168→140px로 줄어 글자가 <b>19px 아래</b>로 내려간다(뒷자리 판독 한계) ③2018년 건은 <b>근로시간·임금</b> 얘기라 이 장의 두 축(무인화 ↔ 진로 방향)과 결이 다르다.<br>★★<b>놀라움 ③ — 여러분의 연대기.</b> 청중 본인의 얘기라 <b>반박이 안 나온다.</b> 하강 구간을 지탱하는 두 기둥 중 하나.<br>⚠️<b>연표를 읽어주지 말 것.</b> 짚으면서 <b>“그때 뭐 하고 계셨죠”</b>만 반복한다.<br>★<b>2026-08-10 두 축 분리(강사 지시).</b> 한 칸에 2줄로 넣었더니 <b>취업인지 진로인지 구분이 안 됐다</b> → <b>위 트랙 = 취업 / 아래 트랙 = 진로</b>, 왼쪽에 <b>축 이름표</b>. 같은 10년을 <b>두 번</b> 훑으면 진로가 별도 논지로 선다.<br>⚠️ 「10년 전/5년 전」은 뺐다 — <b>연도 축이 이미 시간을 말한다.</b> 나이 단정 없이 <i>“2016년에 뭐 하고 계셨죠”</i>로 각자 답을 부른다.<br>⚠️⚠️<b>이 장은 한 번 삭제됐다가 복원됐다</b>(범위 치환 사고) — <b>범위를 자를 땐 두 앵커 사이에 몇 장이 있는지 먼저 센다.</b>'},

 land:'그리고 회사 입장에서 — <b>신입은 아직 검증 안 된 자산</b>입니다',
 say:['학생이 안 물어도 <b>먼저 묻는다</b>','“<b>맞아요, 상당 부분</b>”으로 받고','“근데 <b>전부 호황기</b>에 내린 결정이에요”','“그래서 배운 게 <b>검증 안 된 것에 안 건다</b>”','착지 — “<b>신입은 미검증 자산</b>이에요” <i>(미안한 말이지만)</i>'],
 note:'똑똑한 학생이 반드시 떠올리는 반박. <b>먼저 짚으면 신뢰가 크게 오른다.</b><br>★<b>“신입인데 경력 있으세요?”의 진짜 뿌리.</b> 이유2 → 이유3의 다리다.<br>★<b>2026-08-10 두 장 합침(강사 지적).</b> 구 34(반론 인정)·35(호황기→검증)는 <b>끊기면 안 되는 하나의 사슬</b>이었다 — 따로 두면 <i>“그래서 더 무섭다”</i>에서 한 번 끊기고, 다음 장에서 다시 시동을 건다.<br>→ <b>맞습니다 → 그런데 → 그래서</b> 3단 흐름으로. <b>화살표가 논리를 말하고</b>, 마지막 칸만 강조색이라 <b>결론이 어디인지</b>가 즉시 보인다. <b>-1장</b>.<br>⛔“판단”·“결정” <b>중립어로만</b> — 특정 경영자·기업 비난 금지.'},

{sec:'진단 · 이유 2', t:'fig',h:'회사가 무서워하는 <em>공포의 급</em>이 달라졌습니다',
 svg:'<svg viewBox="0 0 1240 466" preserveAspectRatio="xMidYMid meet"><line x1="270" y1="236" x2="400" y2="236" stroke="var(--ln)" stroke-width="3"/><line x1="840" y1="236" x2="970" y2="236" stroke="var(--ln)" stroke-width="3"/><rect x="400" y="64" width="440" height="343" rx="16" fill="var(--ac)"/><svg x="500" y="126" width="240" height="45" viewBox="316.2 33.8 630.2 118.2" fill="#fff"><path d="M578.2 34v118h33.3V34h-33.3zm-262-.2v118.1h33.6V60.2l26.2.1c8.6 0 14.6 2.1 18.7 6.5 5.3 5.6 7.4 14.7 7.4 31.2v53.9h32.6V86.7c0-46.6-29.7-52.9-58.7-52.9h-59.8zm315.7.2v118h54c28.8 0 38.2-4.8 48.3-15.5 7.2-7.5 11.8-24.1 11.8-42.2 0-16.6-3.9-31.4-10.8-40.6C723 37.2 705.2 34 678.6 34h-46.7zm33 25.6h14.3c20.8 0 34.2 9.3 34.2 33.5s-13.4 33.6-34.2 33.6h-14.3V59.6zM530.2 34l-27.8 93.5L475.8 34h-36l38 118h48l38.4-118h-34zm231.4 118h33.3V34h-33.3v118zM855 34l-46.5 117.9h32.8l7.4-20.9h55l7 20.8h35.7L899.5 34H855zm21.6 21.5l20.2 55.2h-41l20.8-55.2z"/></svg><text x="620" y="266" text-anchor="middle" font-size="50" font-weight="800" fill="#fff">약 7,000조 원</text><text x="620" y="316" text-anchor="middle" font-size="20" font-weight="700" fill="#fff" opacity=".75">시가총액 · 2026년 8월 기준</text><rect x="35" y="144" width="235" height="184" rx="13" fill="#fff" stroke="var(--ink)" stroke-width="3"/><text x="152" y="196" text-anchor="middle" font-family="Helvetica Neue,Arial,sans-serif" font-size="31" font-weight="800" letter-spacing="2" fill="var(--ink)">SAMSUNG</text><text x="152" y="238" text-anchor="middle" font-size="27" font-weight="800" fill="var(--ink)">약 1,400조 원</text><rect x="82" y="266" width="142" height="34" rx="17" fill="var(--ac)"/><text x="152" y="290" text-anchor="middle" font-size="20" font-weight="800" fill="#fff">세계 10위권</text><text x="152" y="322" text-anchor="middle" font-size="17" font-weight="700" fill="var(--mut)">시가총액 · 2026년 8월 기준</text><text x="1039" y="136" text-anchor="middle" font-size="27" font-weight="800" fill="var(--ink)">한국 정부</text><text x="1039" y="168" text-anchor="middle" font-size="27" font-weight="800" fill="var(--ink)">1년 예산</text><rect x="970" y="182" width="138" height="109" rx="11" fill="#fff" stroke="var(--ink)" stroke-width="3"/><text x="1039" y="244" text-anchor="middle" font-size="24" font-weight="800" fill="var(--ink)">약 700조 원</text><text x="1039" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="var(--mut)">2026년 본예산</text><rect x="280" y="208" width="110" height="56" rx="28" fill="#fff" stroke="var(--ac)" stroke-width="3.5"/><text x="335" y="248" text-anchor="middle" font-size="34" font-weight="800" fill="var(--ac)">×5</text><rect x="850" y="208" width="110" height="56" rx="28" fill="#fff" stroke="var(--ac)" stroke-width="3.5"/><text x="905" y="248" text-anchor="middle" font-size="34" font-weight="800" fill="var(--ac)">×10</text></svg>',
 sub:'<b>삼성전자 다섯</b> · <b>한국 정부 1년 예산 열</b> — <em>둘 다 엔비디아 하나</em>입니다<br><small style="opacity:.6">회사 값은 시가총액 · 예산은 1년 살림 — 종류가 다른 돈이라 크기만 견주십시오</small>',
 land:'이 급의 회사가 움직이면 — <b>업계 하나가 통째로 흔들립니다</b>',
 say:['가운데 파란 덩어리 — “<b>이게 엔비디아 한 회사</b>예요”','왼쪽 — “<b>이게 삼성전자.</b> 다섯을 합쳐야 저기예요”','오른쪽 — “<b>이게 나라 1년 살림.</b> 열 개를 합쳐야 저기예요”','“그런데 그 삼성이 <b>세계 10위권</b>이에요”'],
 note:'⚠️⚠️<b>강의 당일 아침 시총 재확인 필수.</b> 변동이 극심하다.<br>★<b>절대 숫자를 못 박지 말고</b> “~조 원대”·“세계 10위권”으로. 안 깨지는 표현은 <b>배율</b>이다.<br>★★<b>2026-08-06 위치 교정.</b> 착지가 <b>“그래서 회사가 생존 모드”</b> — ②산업의 근거다.<br>★<b>2026-08-10 확대(강사 지시 3회).</b> 박스를 620→<b>760</b>으로 키우고 로고·금액을 함께 키웠다. <b>왼쪽 빈 공간을 캡션이 쓰도록</b> 「정부 1년 예산의 약 10배」를 그쪽으로 옮겼다 — 오른쪽에 있을 때는 도형과 경쟁했다.<br>★<b>2026-08-10 면적 비교 + 사분면 정렬(강사 지적 2회).</b> 1차 시안은 텍스트 세 덩어리가 <b>제각기 떠 있어 허접했다</b> → <b>대각선 사분면</b>(우상=엔비디아 / 좌하=삼성)으로 두 이름이 <b>서로 안 겹치면서 균형</b>이 잡히고, 오른쪽 캡션은 <b>가운데 축에 정렬</b>했다.<br>⚠️⚠️<b>강의 당일 아침 시총 재확인 — 배수까지 다시 계산할 것.</b> 2026-08-10 실측으로 <b>6월 값에 8월 딱지가 붙어 있던 것</b>을 교정했다: 삼성전자는 <b>6월 초 2,000조 돌파 → 8월 초 반도체 급락으로 약 1,400조</b>(주가 235,250원·8/7 보통주 기준), 엔비디아는 <b>약 $5.2~5.4조 ≈ 7,200~7,500조 원</b>. <b>배수가 두 달 만에 3.6 → 5로 움직였다.</b><br>★그래서 <b>“다섯”이라는 숫자에 기대지 말 것</b> — 당일에 넷일 수도 여섯일 수도 있다. 안 깨지는 발화는 <b>“이걸 몇 개 합쳐야 저기 하나예요”</b>다.<br>⛔<b>삼성 2,500조설은 사실이 아니다</b>(2026-08-10 확인) — 8월 초 <b>삼성그룹 «전체»가 1,900조</b>였다.<br>★<b>2026-08-10 로고 인라인 완료.</b> NVIDIA는 <b>SVG 워드마크</b>(Wikimedia Commons), 삼성은 <b>공식 워드마크 PNG</b>(«Samsung Orig Wordmark BLACK RGB», Commons)를 <b>base64로 파일 안에</b> 넣었다 — <b>인터넷 없이 뜬다</b>(오프라인 규율 유지). 파일명 검색으로는 안 나와서 <b>Commons API 검색</b>으로 찾았다.<br>⛔ 로고는 <b>비교·사실 제시 목적</b>으로만 쓴다 — 후원·제휴 인상을 주지 말 것.<br>★<b>2026-08-18 문장 손질</b> — 단서 줄의 <i>“<b>크기 감</b>만 보십시오”</i>가 비문이었다(‘크기 감’은 낱말이 아니다) → <b>“크기만 견주십시오”</b>. <b>44번 도식의 각주</b>가 이미 <i>“크기만 견줍니다”</i>라 두 장의 단서 문구가 같은 낱말로 통일된다. 숫자·배율·출처는 손대지 않았다.'},

{sec:'진단 · 이유 2',t:'title',html:`
  <h2 class="h">영화가 상상한 <em>초거대 기업들</em></h2>
  <div class="src">Forbes 「The 25 Largest Fictional Companies」 (2007) <b>매출 추산</b> · 엔비디아 2025 회계연도 <b>매출</b></div>
  <div class="movwrap">
    <div class="movcol">
      <div class="movco wayne"><div class="mtag"><span class="mb">영화 속</span> 배트맨 · <b>주인공의 회사</b></div>
        <div class="wm">WAYNE<br>ENTERPRISES</div><div class="mv">45<span>조 원</span></div></div>
      <div class="movco stark"><div class="mtag"><span class="mb">영화 속</span> 아이언맨 · <b>주인공의 회사</b></div>
        <div class="wm">STARK<span>INDUSTRIES</span></div><div class="mv">29<span>조 원</span></div></div>
      <div class="movco cyber"><div class="mtag"><span class="mb">영화 속</span> 터미네이터 · <b>스카이넷 만드는 회사</b></div>
        <div class="wm">CYBERDYNE<span>SYSTEMS</span></div><div class="mv">8<span>조 원</span></div></div>
    </div>
    <div class="revwrap">
      <div class="revrow">
        <div class="revlbl">엔비디아가 <b>1년에 버는 돈</b><small>2025 회계연도 매출</small></div>
        <div class="revtrack"><div class="revnv">약 181조 원</div></div>
      </div>
      <div class="revrow">
        <div class="revlbl">영화 속 <b>세 회사를 다 합치면</b></div>
        <div class="revtrack">
          <div class="revsum" style="width:45.3%">
            <div class="revseg s1" style="flex:45"></div>
            <div class="revseg s2" style="flex:29"></div>
            <div class="revseg s3" style="flex:8"></div>
          </div>
          <div class="revrest">82조 원 — <b>절반이 안 됩니다</b></div>
        </div>
        <div class="revleg"><span><i class="s1"></i>웨인 45조 원</span><span><i class="s2"></i>스타크 29조 원</span><span><i class="s3"></i>사이버다인 8조 원</span></div>
      </div>
      <div class="gpunch"><span class="gpa">사이버다인 <b>8조 원</b></span><span class="gpx">×23</span><span class="gpe">=</span><span class="gpb">엔비디아 <b>181조 원</b></span></div>
      <div class="gnote">※ 영화 기업은 2007년 매출 추산 · 엔비디아는 2025 회계연도 매출 — <b>둘 다 「1년에 번 돈」입니다</b></div>
  </div>`,
 say:['톤 바꿔서 — “잠깐 딴 얘기 하나만”','“포브스가 재미로 추산 — 제목이 <b>가장 큰 가상 기업 25</b>”','웨인 45 → 스타크 29 — “이 둘은 <b>주인공 회사</b>들이고요”','“<b>스카이넷 만드는</b> 사이버다인 — <b>8조요</b>” <i>(웃음 자리)</i>','“<b>사이버다인이 8조</b> — 엔비디아는 <b>1년에 181조</b>를 벌어요. <b>23배</b>”','막대 짚으며 — “<b>셋을 다 합쳐도</b> <b>절반이 안 돼요</b>”'],
 note:'⚠️⚠️<b>2026-08-10 단위 교정(강사 지적).</b> 구버전은 <b>영화 기업 「매출」 vs 엔비디아 「시가총액」</b>을 비교했다 — <b>단위가 달라 「×900」이 성립하지 않는다.</b> 매출은 1년치 흐름, 시가총액은 회사 전체의 값이다. <b>양쪽 다 「1년 매출」로 통일</b>했고 배수는 <b>900 → 23</b>이 됐다.<br>⛔<b>「25개를 전부 합쳐도」는 삭제.</b> 매출로 맞추면 25개 합계(초암 포함 약 4,900조)가 <b>엔비디아 매출을 한참 넘어</b> 주장이 뒤집힌다.<br>★★놀라움 ② (16분). 진단 구간의 두 번째 숨구멍.<br>⚠️<b>2026-08-08 사실 교정(강사 지적)</b> — 구버전 제목 “최대 악당 기업”은 <b>사실과 다르다.</b> 포브스 기사 제목은 <b>「가장 큰 가상 기업 25」</b>이고, <b>웨인·스타크는 영화에서 주인공의 회사</b>다(악당 아님). 악당 프레임은 사이버다인(스카이넷)에만 성립 — 그래서 <b>웃음 펀치는 사이버다인 한 곳</b>에만 건다.<br>⚠️⚠️<b>강의 당일 아침 시총 재확인.</b> 숫자를 못 박지 말고 “~조 원대”·배율로.<br>★가상/실재 배지(영화 속) 필수 — 없으면 배수 비교가 성립 안 한다.<br>⚠️<b>2026-08-18</b> — 대본 발화가 「900배」로 남아 있어 화면(23배)과 어긋났다. <b>대본·감정선 표·감정곡선도 전부 「×23」으로 내렸다.</b> ⛔되살리지 말 것<br>★순서 = 발화와 동일: 웨인 → 스타크 → <b>사이버다인(마지막 펀치)</b>.<br>⛔<b>“25개 합쳐도 엔비디아의 몇 분의 일”이라고 말하지 말 것 — 틀린다.</b> 실측은 <b>25개 합계 ≈ $3.57조 vs 엔비디아 ≈ $5.05조</b>(1위 초암 $1.7조 포함) = <b>약 7할.</b> 정확한 표현은 <b>“전부 합쳐도 이 네모를 못 채운다 · 3분의 2 남짓”</b>이다. 과장하면 이 강의가 가르치는 「사실✓/추론→」 규율이 무너진다.'},

{sec:'진단 · 이유 2',t:'fig',h:'회사 하나가 — <em>나라 하나보다 큽니다</em>',
 svg:'<svg viewBox="0 0 1240 420" preserveAspectRatio="xMidYMid meet"><text x="300" y="59" text-anchor="end" font-size="30" font-weight="800" fill="var(--ink)">엔비디아 · 시가총액</text><rect x="320" y="18" width="880" height="62" rx="7" fill="var(--ac)"/><text x="1178" y="63" text-anchor="end" font-size="40" font-weight="800" fill="#fff">약 5조 달러</text><text x="300" y="145" text-anchor="end" font-size="30" font-weight="700" fill="var(--mut)">영국 GDP · 6위</text><rect x="320" y="104" width="686" height="62" rx="7" fill="#C7D0DE"/><text x="1024" y="147" font-size="30" font-weight="800" fill="var(--ink)">3.9조 달러</text><text x="300" y="231" text-anchor="end" font-size="30" font-weight="700" fill="var(--mut)">프랑스 GDP · 7위</text><rect x="320" y="190" width="581" height="62" rx="7" fill="#C7D0DE"/><text x="919" y="233" font-size="30" font-weight="800" fill="var(--ink)">3.3조 달러</text><text x="300" y="317" text-anchor="end" font-size="30" font-weight="700" fill="var(--mut)">한국 GDP · 12위</text><rect x="320" y="276" width="334" height="62" rx="7" fill="#C7D0DE"/><text x="672" y="319" font-size="30" font-weight="800" fill="var(--ink)">1.9조 달러</text><text x="320" y="392" font-size="20" font-weight="600" fill="var(--faint)">※ 시가총액은 회사를 통째로 사는 값 · GDP는 1년 동안 만든 값 — 서로 다른 잣대입니다. 크기만 견줍니다</text></svg>',
 sub:'<b>한국이 1년 동안 만들어낸 것을 다 더한 값</b>(GDP) — 그 <em>약 2.6배</em>입니다',
 land:'<b>기준이 바뀐 겁니다</b> — 10년 전의 「큰 회사」와 지금의 「큰 회사」는 <em>자릿수가 다릅니다</em>',
 say:['“작년 6월에 <b>뉴스가 하나</b> 났어요”','“<b>엔비디아가 영국을 넘었다</b>”','“영국이 <b>세계 6위</b>예요. 나라 순위로”','한국 막대 짚으며 — “<b>우리는 여기</b>”','“<b>한국이 1년 동안 만들어낸 걸 다 더해도</b> — 이 회사 하나의 <b>절반이 안 돼요</b>”'],
 note:'★<b>2026-08-10 신설(강사 지시).</b> 36번에서 「×900」이 무너지면서 <b>놀라움 ②의 세기가 23배로 줄었다</b> — 그 자리를 이 장이 받는다. 영화 기업은 <b>웃음</b>, 이 장은 <b>실감</b>이다.<br>⚠️⚠️<b>단위가 다르다 — 화면에 반드시 남겨둘 것.</b> 시가총액은 <b>회사 전체의 값</b>, GDP는 <b>1년 생산액</b>이다. 36번에서 잡은 것과 <b>같은 종류의 함정</b>이라 여기서는 <b>등식으로 말하지 않는다</b> — “넘었다·더 크다”까지만. ⛔<b>“엔비디아가 영국보다 부자다” 같은 말은 금지.</b><br>⛔<b>“OECD 38개국 중 미국을 뺀 37개국 전부” 쓰지 말 것</b>(2026-08-10 강사 지적으로 철회). 일본(약 4.4조 달러)·독일(약 4.9조 달러)이 엔비디아(약 5조 달러)보다 작은 건 맞지만 <b>독일과는 3% 차</b>라 <b>시총이 조금만 흔들리면 그날 거짓말이 된다.</b> 중국·인도는 <b>OECD 회원국이 아니라</b> 그 문장에 애초에 안 들어간다 — 이 헷갈림 자체가 문장이 나쁘다는 신호였다.<br>★흔들려도 안 깨지는 건 <b>한국 기준 배수</b>다(한국 약 1.9조 달러 → 2.6배). 출처 줄은 <b>화면에서 뺐다</b> — 「강의 당일 재확인」은 강사 메모지 청중이 볼 것이 아니다.<br>★<b>한국 막대를 꼭 짚을 것.</b> 남의 나라 얘기로 끝나면 진단이 안 된다.<br>⏱ 50초.'},
{sec:'진단 · 이유 2',t:'big',
 big:'이런 회사가 <u>“우리도 해볼까”</u> 한마디를 하면<br>업계 하나가 흔들린다',
 sub:'대기업 임원조차 자사의 신규 투자를 <em>발표 전까지 모르는</em> 경우가 있습니다<br><br><b>안에 있어도 — 회사의 내일은 모릅니다</b>',
 land:'그래서 회사는 <em>생존 모드</em>가 됩니다 — 그리고 <b>생존 모드는 사람을 키우지 않습니다</b>',
 say:['“제가 들은 얘긴데”로 <b>완충</b> — ⛔단정 금지','<b>“안에 있어도 모른다”</b>에서 한 박자 세운다','“그러니까 <b>밖에서 읽는 게 손해가 아니에요</b>” <i>(제목 해소와 연결)</i>','“<b>당장 쓸 사람</b>을 찾는다” → “신입인데, 경력 있으세요?”'],note:'★<b>2026-08-10 강조 신설(강사 지적).</b> <i>“안에 있어도 내일은 모른다”</i>는 <b>이 강의 방법론의 정당화</b>다 — 내부자도 모른다면 <b>밖에서 읽는 것이 열등한 방법이 아니다</b>. 오프닝 「잠입 = 들어가지 않고 밖에서 읽는 것」과 <b>직접 이어진다.</b><br>→ 구버전은 이 문장이 <b>생존 모드 설명에 묻혀</b> 있었다 → <b>sub의 결론</b>으로 세우고 생존 모드는 <b>착지</b>로 내렸다.<br>⛔<b>단정 금지 · 제3자 정보 주의</b> — “경우가 있습니다”까지만. 특정 기업·임원을 특정하지 말 것.<br>★<b>2026-08-06 신설.</b> 시총·영화 블록에서 <b>②산업의 착지로 넘어가는 다리</b>가 없어 숫자만 던지고 끝나는 구조였다. 임원 일화는 <b>전언</b> — “제가 들은 얘긴데”로 완충. 이 장이 <b>“신입인데 경력 있으세요?”의 뿌리</b>를 완성한다.<br>⚠️⛔<b>note를 두 벌 쓰지 말 것</b> — JS는 뒤엣것만 남긴다. 실제로 이 장의 note가 <b>한 벌 통째로 죽어 있었다</b>(2026-08-10 발견).'},

 note:'★★<b>2026-08-11 세 칸의 구조를 통일(강사 지적).</b> ①②는 <i>[답 / 숫자 / 맥락]</i>인데 ③만 <i>[기간 / 숫자 / 다른 통계]</i>라 <b>칸마다 읽는 순서가 달랐다.</b><br>→ 셋 다 <b>「무엇을 잰 숫자인가」(위) → 숫자 → 「그 답」(아래)</b>. 엔진에 <b>n[3]=숫자 위 라벨</b>을 신설했다(없으면 안 그리므로 다른 nums 장은 그대로).<br>★<b>「· 경총」 제거</b> — 청중은 <b>경영자총협회의 줄임말인 걸 모른다.</b> 출처는 이미 하단 src에 다 있다.<br>★<b>“절반 가까이 1년 초과”가 무엇이 1년 초과인지 없었다</b> → <b>“절반 가까이는 1년을 넘깁니다”</b>. 위 라벨(「졸업 후 첫 취업까지」)이 주어를 잡아준다.<br>★이 강의가 있는 이유. <b>허리로 가는 다리</b>라 생략 금지.<br>⚠️<b>2026-08-08 중복 제거</b> — “경력을 요구하는 문이 통로를 막는다 / 스펙을 더 쌓으라는 말은 하지 않는다 / 경력의 언어” 착지 문장이 <b>②층 정리 장과 두 벌</b>이었다. ②층 정리 note의 설계(“근거를 다 쌓은 뒤 한 번만 닫는다”)와 대본 순서(착지는 ②정리에서)에 맞춰 이 장에서 걷어냈다.'},

 note:'★<b>2026-08-10 재구성 2차(강사 지적 — “전달이 바로 안 된다”).</b> 1차 시안은 두 박스가 <b>서로 다른 논리</b>였다(왼쪽=질문→빈 칸 / 오른쪽=조언의 성격→빈 칸) — 모양만 대칭이고 <b>읽는 순서가 안 맞았다.</b> → <b>맨 위에 질문 하나</b>를 세우고 <b>양쪽 다 그 질문의 답</b>으로 만들었다. “한 질문 · 두 곳 다 빈 칸”이라 <b>한눈에 끝난다.</b><br>⛔<b>제목에 밑줄(&lt;u&gt;) 쓰지 말 것</b> — 한글에서 받침을 파고들어 지저분하다. 강조는 &lt;em&gt;.<br>⛔<b>“기성세대” 쓰지 말 것</b> — 세대 대립 뉘앙스가 아래 비난 톤 금지와 부딪힌다. <b>“먼저 겪은 사람들”</b>로 통일.<br>★★<b>비어 있던 칸을 채운다.</b> 11분 장은 <b>취업 버전</b>, 이 장이 <b>진로 버전</b>이다 — 같은 증거를 7분 뒤 다른 축으로 회수한다.<br>⛔<b>어른·학교·정부 비난 톤 절대 금지</b> — “안 가르쳐줬다” ✗ / <b>“누구 탓이 아니라 속도”</b> ✓.<br>⛔<b>전칭 단정 금지</b> — “아무도 없다” ✗ / <b>“아직 적다”</b> ✓.<br>★이 장이 <b>20분 통제권</b>(“아무도 안 알려준 걸 몰랐을 뿐”)의 <b>원인</b>이 된다.'},
{sec:'진단 · 이유 3',t:'big',big:'여러분이 <u>부족해서</u>가 아닙니다',

 say:['윗줄 짚으며 — “<b>신입 뽑는다면서 경력을 봐요.</b> 그런데 경력을 만들 데가 없어요”','아랫줄로 옮기며 — “<b>진로도 똑같아요.</b> 방향을 정하라는데, 그 방향을 겪어본 사람이 아직 적어요”','“<b>둘 다 여러분 탓이 아니에요</b>”','“다음은 — <b>여러분 마음</b> 얘기”'],
 note:'★<b>2026-08-11 두 줄 30% 확대(강사 지시).</b> 이 장은 <b>층 정리 3연타의 마지막</b>이라 두 줄이 <b>화면의 주인공</b>이다 — 기본 크기로는 제목에 눌렸다. <b>확대판 `.axpair.lg`</b>로 준다.<br>⛔<b>전역으로 키우지 말 것</b> — 10·92번은 같은 두 줄이 <b>부연</b>이라 커지면 위계가 뒤집힌다.<br>★★<b>2026-08-10 층 라벨 삭제(강사 지적).</b> sub 끝의 <i>“② 산업 — 회사가 생존 모드다”</i>는 <b>헤더 칩과 완전히 겹친다</b>(헤더가 이미 「세션 1 · 진단 │ ② 산업 · 어긋난 문」을 띄운다). 작은 회색 글씨라 눈에 안 띄면서 자리만 먹었다 — <b>30·44·50 세 곳 모두 제거.</b><br>★<b>2026-08-06 신설 — 층별 정리 2/3. 진단부에서 제일 중요한 장.</b> ①세계는 “판이 바뀌었다”로 끝나도 되지만, ②산업은 <b>“그래서 내가 뭘 하냐”의 답으로 직결</b>돼야 한다. <b>여기가 허리(주어 전환)로 가는 다리다.</b><br>★<b>2026-08-10 문구 교정(강사).</b> ①<b>“스펙이 부족해서” → “여러분이 부족해서”</b> — 스펙만 짚으면 진로가 또 빠진다. ②<b>「경력의 언어」 폐기</b> — <b>경력이라는 말이 진로를 못 담는다.</b> → <b>「꺼내 쓸 수 있는 말」</b>. 0~4분 신조(<i>“해결책은 이미 머릿속에 있다 — 못 꺼낼 뿐”</i>)를 <b>그대로 회수</b>하고 취업·진로 둘 다 담는다. 관통도에 없는 표현이라 회차 간 복선은 안 끊긴다(2026-08-10 확인) — 다만 <b>대본 1회차도 같이 고쳤다.</b><br>★<b>2026-08-10 진로 축 병기(강사 지적).</b> 착지가 <b>경력·스펙(취업)만</b>이라 이 장에서 다시 <b>진로가 취업의 부속</b>이 됐다 — CLAUDE.md가 「반복된 실수」로 못 박은 바로 그 지점. → <b>취업/진로 두 줄 대구</b>로 세웠다. 아랫줄은 43번(「먼저 겪은 사람들도 못 따라간다」)을 <b>그대로 회수</b>한다.<br>⚠️구버전은 이 착지가 미스매치 블록 안에 있었고 <b>그 뒤에 눈높이 반박이 또 와서 블록이 두 번 닫혔다.</b> → 근거를 다 쌓은 뒤 여기서 한 번만 닫는다.<br>★<b>2026-08-18</b> — sub 꼬리 두 문장("그래서 오늘 ~ 하지 않습니다" + "대신 —")을 한 문장으로 합침, 뜻은 그대로.'},

{sec:'진단 · 심리',tone:'flat lg',t:'vs',h:'무엇이 <em>사라지고</em> — 무엇이 <em>늘었나</em>',left:{t:'사라진 것',v:'<span class="vl">다 같이 준비하던 <b>공채 시즌</b></span><span class="vl">“<b>이것만 하면 된다</b>”는 목록</span><span class="vl"><b>선배가 간 길</b>을 따라가기</span>'},

 note:'★<b>2026-08-11 항목 30% 확대(강사 지시).</b> 이 장은 <b>심리 층의 도입</b>이라 좌우 세 줄이 <b>화면의 주인공</b>이다 → 확대판 <b>`.vs.lg`</b>. ⛔전역 금지 — vs를 쓰는 다른 장은 이 항목이 <b>근거</b>라 커지면 위계가 뒤집힌다.<br>★<b>착지 문안</b> — <i>“선택지가 늘어난 게 문제가 아니라”</i>는 <b>부정으로 열어</b> 한 박자 늦게 이해된다 → <b>“선택지는 늘어났지만 — 고르는 기준은 사라졌습니다”</b>. 좌우 두 칸(사라진 것 / 늘어난 것)을 <b>그 순서 그대로</b> 되받는다.<br>★★<b>심리 구간의 실은 「기준」이다</b> — 이 장 착지(고르는 <b>기준</b>이 없어졌다) → 48(내 <b>기준</b>을 모르겠다) → 49(그 <b>기준</b>은 이미 있다). ⛔착지 문구에서 <b>「기준」을 빼지 말 것</b> — 빼는 순간 세 장이 따로 논다(2026-08-10 강사 지적).<br>★<b>2026-08-10 항목화 2차(강사 지적).</b> 착지로 넣었던 <i>“머릿속에 이런 말들이 생깁니다”</i>는 <b>다음 장을 가리키는 말</b>이라 화면만 보면 뭘 말하는지 알 수 없었다 — <b>제9조(혼자 서는가) 위반.</b> → 착지를 <b>“고를 게 많아진 게 아니라 고르는 기준이 없어진 것”</b>으로 바꿔 <b>그 자리에서 완결</b>시켰다(그래도 48로 이어진다). 양 칸도 한 덩어리 문장 → <b>항목 3개씩</b>으로 세워 «무엇이» 사라지고 늘었는지 보이게 했다.<br>★<b>2026-08-10 제목 신설 + 다리(강사 지적).</b> 제목이 없어 <b>좌우 두 칸이 무슨 대비인지</b> 화면만 봐선 안 보였다. 그리고 착지가 없어 <b>48번과 따로 놀았다</b> — 착지를 <b>“머릿속에 이런 말들이 생깁니다”</b>로 두어 48의 3증상을 <b>불러온다.</b><br>⛔<b>「청중이 느끼는 것」을 이 장에 넣지 말 것</b>(2026-08-10 강사 문의) — 그건 <b>48번의 일</b>이다. 여기서 미리 말하면 48이 <b>없어도 되는 장</b>이 되고 이 장은 과밀해진다. <b>이 장은 바깥, 48은 머릿속.</b><br>★<b>2026-08-10 48번과 합치지 않는다(강사 문의).</b> 둘은 다른 일을 한다 — <b>이 장은 바깥 구조</b>(길이 없어지고 많아졌다), <b>48은 내 머릿속 증상 + 자책 해제 착지</b>다. 합치면 48의 <b>“모르는 게 당연합니다”</b>가 구조 설명에 묻힌다(48 note: ★착지가 그 장의 전부).<br>⚠️<b>두 장이 겹쳐 보인 진짜 이유는 중복이었다</b> — 이 장 sub의 “답하는 방법은 교육 과정에 없음”이 <b>48번 첫 칸과 같은 말</b>이었다. 걷어냈다. 이 장은 <b>구조까지</b>, 48은 <b>증상과 착지</b>.<br>⚠️<b>2026-08-08 발화 큐 교정</b> — 구버전 say(“성격 문제가 아니라 구조” · “오래 끌수록”)는 <b>③층 정리 장의 정리 문장</b>이었다. 여기서 미리 말하면 세 장 안에 같은 말이 두 번 나와 층-정리 형식 설계가 죽는다. 이 장은 <b>지도 소멸 × 새 길 과잉</b>까지만.'},

 note:'★<b>2026-08-10 좌우 묶기(강사 지적 — 한눈에 안 들어온다).</b> 3칸이 <b>전부 같은 무게</b>라 눈이 갈 곳을 못 정했다 — 인용구와 설명이 같은 크기로 나란히 섰다. → <b>왼쪽 = 내가 하는 말 · 오른쪽 = 실제로는</b> 좌우 표로 묶었다. 세 행이 <b>같은 형식</b>이라 한 행만 읽으면 나머지는 눈으로 훑힌다.<br>★<b>2026-08-10 무게 이관(강사 지적 — “48이 과하다”).</b> 이 장이 <b>증상 제시 + 자책 해제</b> 두 가지를 하고 있었다. 자책 해제는 <b>층 정리 3장이 형식으로</b> 한다 — 30번 · 44번 · 50번. 48이 먼저 해버리면 <b>50이 도착했을 때 이미 들은 말</b>이 된다. → 착지를 <b>증상 묶기</b>까지만. 그러면 47(바깥) → 48(증상) → 49(원인) → 50(판정)이 <b>각각 한 가지 일</b>만 한다.<br>★★<b>2026-08-10 심리 구간 흐름(강사 지적 — “뚝뚝 끊긴다”).</b> 세 장을 꿰는 실은 <b>「기준」</b>이다 — <b>47</b> 고르는 <b>기준</b>이 없어졌다 → <b>48</b> 그래서 “내 <b>기준</b>을 모르겠다” → <b>49</b> 그 <b>기준</b>은 이미 지나간 하루들 안에 있다. 구버전은 제목이 <b>제각기 다른 화법</b>(질문 / 진술 / 부정)이라 실이 안 보였고, 이 장 제목의 <i>“같은 자리”</i>는 <b>앞 장을 기억해야</b> 알 수 있었다. → <b>“그래서 — 이런 생각이 듭니다”</b>로 바꿔 <b>47의 착지를 직접 받는다.</b> ⛔이 세 제목을 따로 고치지 말 것.<br>★<b>2026-08-10 라벨 교정(강사 지적).</b> <i>“내가 하는 말”</i>은 <b>「내가」가 강사인지 청중인지</b> 모호했고, <i>“실제로는”</i>은 <b>무엇이 실제인지</b> 안 보였다 → <b>“이런 생각이 듭니다” / “그런데 진짜 이유는”</b>.<br>★왼쪽 세 줄은 <b>읽어만 준다</b> — 하나하나 설명하는 순간 청중은 강사 말을 안 듣는다.<br>⛔<b>위로 톤 금지</b> — “괜찮아요” ✗. 판정이지 위로가 아니다.<br>★“진로는 계속되는 갱신”은 <b>10분 약속선</b>의 것 — 여기서 반복하지 않는다.'},

 land:'취업 준비 중이든, 진로를 못 정했든 — <b>오늘 캐는 재료는 같습니다</b>',
 say:['왼쪽 짚으며 — “<b>이거 여러분 탓이 아니에요</b>”','오른쪽 <b>윗줄</b>은 빠르게 — “뭐가 필요하냐. 고를 기준하고, 내 답”','★<b>아랫줄에서 멈춘다</b> — “근데 그게 <b>이미 여러분 하루 안에 있어요</b>”','★빨간 줄 짚으며 — “<b>다만 남아 있지가 않죠.</b> 그래서 오늘 그걸 남기는 법을 합니다”','★<b>질문을 던지고 받지 말 것</b> — “지난주에 시간 가는 줄 몰랐던 게 뭐였는지, 지금 말할 수 있으세요?”','“<b>없어서가 아니라 안 남아 있어서</b>예요”','“처음에 뭐라고 했죠? <b>해결책은 이미 머릿속에 있다</b>고요” <i>(신조 회수)</i>','“<b>다만</b> — 오래 끌수록 빠져나오기가 어려워져요. 그래서 <b>오늘 시작하는 거예요</b>” <i>(⛔다그치지 말 것)</i>','“재료 얘기 하기 전에 — <b>하나만 더 보고 갈게요</b>” <i>(다음 장 간판 · 2026-08-17 교체)</i>'],
 note:'★★<b>심리 구간의 실은 「기준」이다</b> — 47(기준이 없어졌다) → 48(내 기준을 모르겠다) → <b>이 장이 그 실을 회수한다</b>(기준은 이미 지나간 하루들 안에). 그래서 오른쪽 칸의 첫 줄이 <b>「고를 기준」</b>이어야 한다 — 바꾸면 세 장이 끊긴다.<br>★<b>2026-08-10 49+50 통합(강사 지시).</b> 두 장이 <b>같은 자리에서 앞뒤로</b> 있었다 — 50은 <b>“탓이 아니다”</b>, 49는 <b>“그럼 뭐가 있냐”</b>. 한 장에 <b>좌(문제가 아닌 것) → 우(안 남아 있는 것)</b>로 놓으면 <b>부정과 대안이 한 화면에서 맞물린다.</b><br>★<b>층 정리 3/3 형식은 제목이 지킨다</b> — 30번 “못 한 게 아닙니다” · 44번 “부족해서가 아닙니다” · 이 장 <b>“성격 문제가 아닙니다”</b>. 세 번 반복이 <b>형식 자체로 증명</b>이라 제목에서 빼면 안 된다.<br>★★<b>질문은 던지고 답을 받지 않는다.</b> 청중이 속으로 뒤지다 실패하는 <b>그 3초</b>가 진단의 증명이다. 손 들라고 하면 안 든다.<br>★★<b>각도(2026-08-08 · 강사 지시).</b> <b>회사로 진로를 설명하지 않는다</b> — 그러면 “진로=회사 고르기”가 되어 직무조차 못 정한 사람을 배제한다. 축은 <b>시간·기록</b>이다.<br>★<b>0~4분 신조가 그대로 진로 버전이 된다</b> — “해결책은 이미 머릿속에 있다. 못 꺼낼 뿐.”<br>⚠️<b>다그치지 말 것.</b> “빨리 하세요” ✗ → “그래서 오늘 시작하는 거예요” ✓.<br>⛔<b>도구 이름·방법 금지.</b> 여기는 <b>“안 남아 있다”</b>까지만 — 어떻게 남기는지는 25분.<br>⛔<b>“나부터”를 말하지 말 것</b>(25분 ⓪의 것) · ⛔<b>CT 메모의 정의</b>를 미리 쓰지 말 것.<br>★<b>다음 장이 곧 허리</b> — “지도가 사라졌다 → 그럼 지도를 내가 그려야죠”로 이어진다.'},

 items:[['71%<small>취준생 중</small>','“올 하반기 취업시장이<br>더 어려울 것”','작년 같은 조사는 <b>49%</b>였습니다'],
        ['-2.4%p','청년 <b>고용률</b><br><small>43.8%</small>','1년 전보다 내려왔습니다'],
        ['-2.3%p','청년 <b>경제활동참가율</b><br><small>47.2%</small>','구직 자체를 접는 쪽입니다']],
 sub:'그리고 <b>진로</b> 쪽은 — <em>앞서 겪어본 사람이 아직 안 늘었습니다.</em> 물어볼 데가 계속 없는 겁니다',
 land:'<b>예측이 아닙니다</b> — 셋 다 <em>지금도 같은 쪽으로 움직이는 중</em>이라는 뜻입니다',
 src:'“올 하반기 취업시장 전망” — 진학사 캐치 <b>2026 하반기 전망</b>(2026.6 · 1,025명) · 전년 동일 조사 49% / 청년 고용률·경제활동참가율 — 국가데이터처 <b>「2026년 5월 청년층 부가조사」</b>(2026-07-23)',
 say:['⏱<b>40초</b> — 여기서 길어지면 다음 대문이 안 산다','“<b>작년엔 절반</b>이 더 어려울 것 같다고 했어요. <b>올해는 열에 일곱</b>이고요”','작은 숫자 둘은 <b>손으로 훑기만</b> — ⛔읽지 말 것. “<b>부호가 다 같아요</b>”','★<b>선을 긋는다</b> — “제가 <b>몇 년 뒤엔 어떻게 된다</b>고 말씀드리는 게 아니에요. <b>그건 저도 몰라요</b>”','“<b>지금도 같은 쪽으로 가고 있다</b>는 것까지만요”','진로 줄 — “진로도 똑같아요. 이 판을 겪어본 사람이 아직 안 늘었어요. <b>물어볼 데가 계속 없는 거예요</b>”','⛔“그러니까 빨리 시작하세요” <b>금지</b> — 압박이 되고 톤이 깨진다. <b>다음 대문이 받는다</b>','“근데 이런 생각 드시죠 — <b>구조가 그런데 내가 뭘 해</b>” <i>(다음 구간 간판)</i>'],
 note:'★<b>2026-08-17 신설(강사 지시).</b> 요청은 <i>“취업·진로가 앞으로 얼마나 더 어려워질지도 짧게, 근거 간결히, 상황만 말하고 넘어가기.”</i><br>★★<b>「예측」이 아니라 「방향」으로 말한다.</b> <i>“몇 년 뒤엔 이렇게 됩니다”</i>는 <b>근거가 없어서 못 쓴다.</b> 대신 지금 있는 숫자들의 <b>부호가 전부 같다</b>는 것만 보인다 — 예측 없이 같은 말이 되고, <b>검증 부담이 없다.</b><br>★<b>71%가 주인공인 이유</b> — 사실 예측이 아니라 <b>같은 처지 사람들의 전망</b>이라 ⓐ검증 부담이 없고 ⓑ청중과 거리가 0이고 ⓒ<b>“작년엔 절반이었는데”</b>라는 변화량이 붙는다.<br>⛔<b>71%를 “취업시장이 71% 나빠진다”로 말하지 말 것</b> — <b>“열에 일곱이 그렇게 본다”</b>까지만.<br>⛔<b>화면에 「앞으로」라는 낱말을 쓰지 않는다</b> — 쓰는 순간 예측이 된다.<br>★★<b>자리가 전부다.</b> 진단 세 층이 끝나고 <b>「그래서 어쩌라는 겁니까」 대문 직전</b>이라 <b>대문의 압력이 정확히 올라간다.</b> 그리고 <b>바로 다음 6장(58~63)이 해독제</b>라 무력감이 30초 안에 처리된다.<br>⛔<b>파트 4(58~63) 안으로 옮기지 말 것</b> — 거긴 이미 <b>턴</b>이라 하강을 다시 꽂으면 턴이 무너진다. ⛔<b>허리(64~70) 뒤도 안 된다</b> — 주어가 이미 「나」로 바뀐 뒤라 세상 얘기가 되돌아온다.<br>★<b>진로 한 줄은 새 주장이 아니다</b> — 43번(「먼저 겪은 사람들도 못 따라간다」)의 <b>미래형</b>이다. 수치가 아니라 논리라서 출처 부담도 없다.<br>★<b>회수는 70번 kick</b>이 한다 — <i>“아까 셋 다 같은 쪽이라고 했습니다 — 그건 우리가 못 멈춥니다.”</i> 심는 곳과 받는 곳이 짝이다.<br>⚠️<b>2026 실제 구도 주의</b> — 미충원율은 <b>하락 중</b>(8.4%→6.5%)이라 <i>“기업은 사람이 없다는데”</i>를 현재형 단정으로 쓰면 최신 통계와 어긋난다. 필요하면 <b>“기업 빈자리는 줄었는데 청년 일자리는 더 줄었다”</b>로.<br>★<b>2026-08-18</b> — kick을 「재료 얘기로 넘어가기 전에 — 하나만 더」에서 「진단 마지막입니다」로 바꿨다. 실제 재료(72번)까지 14장·8.6분이 더 걸려 「하나만 더」라는 어음을 여덟 장 동안 못 갚고 있었다 — 「재료」라는 말을 미리 꺼내지 않고 h(「멈춘 숫자가 아니다」)로 바로 이어지게 했다.<br>★<b>2026-08-18 글자 축약</b> — kick 어미("입니다"·"부터 보고 가겠습니다") 정리.<br>★<b>2026-08-18 문장 손질</b> — kick <i>“진단 마지막 — 멈춘 숫자인지 <b>보겠습니다</b>”</i>가 바로 아래 h <i>“이건 <b>멈춘</b> 숫자가 아닙니다”</i>와 <b>같은 화면에서 「멈춘 숫자」를 두 번</b> 불렀다(표현규율 제0조 실패 유형 ③ — 이미 있는 것을 또 부른다) → 위 08-18 기록이 적어둔 본래 문안 <b>“진단 마지막입니다”</b>로 되돌렸다. 56번 착지(<i>“오늘 캐는 재료는 같습니다”</i>)→kick→h(<i>“그리고 —”</i>) 이어 읽으면 「그리고」가 진단 항목을 잇는 말로 제자리에 선다.'},

 note:'★<b>2026-08-11 두 줄 위아래 교체(강사 지시).</b> <i>「몰라서 못 한 겁니다 → 게을러서가 아닙니다」</i>는 <b>이유를 먼저 대고 부정을 나중</b>에 해서, 청중이 <b>자책을 안은 채로</b> 첫 줄을 읽는다. → <b>「게을러서가 아닙니다」를 먼저</b> 놓아 <b>자책을 먼저 걷어내고</b> 그다음에 이유를 준다. 강조색도 <b>아래(이유)로</b> 옮겼다.<br>★<b>착지 교정</b> — <i>“여기서 나가는 건 여러분이 합니다”</i>는 「나가다」가 <b>강의장을 나간다</b>로도 읽힌다 → <b>“앞으로의 선택은 여러분의 몫입니다”</b>.<br>★<b>2026-08-10 도식화(강사 지적 — 시인성 최악).</b> ①제목 <i>“학습 기회의 부재”</i>는 <b>한자어</b>라 중2 기준을 어겼다 → <b>“안 배운 것이지 못 하는 것이 아닙니다”</b> ②sub 셋째 줄(<i>“정부·기관·강사의 역할은 경로 제시까지”</i>)은 <b>강사용 방어 문장</b>이라 화면에서 뺐다 — 청중이 읽을 문장이 아니다 ③좌(안 배운 것) → 우(그래서)로 갈랐다.<br>⚠️<b>책임은 면제, 통제권은 부여.</b> “너희도 잘못 있다” 절대 금지 — 개인 책임 쓴소리는 <b>3회차</b>로.<br>★착지가 <b>이 구간의 이름(“나가는 건 내가 한다”)</b>을 그대로 말한다 — 헤더와 화면이 같은 말이라 흔들리지 않는다.'},

 note:'★<b>2026-08-10 재구성(강사 지시).</b> ①제목을 <b>“진단 정리 — 세 덩어리”</b>로 ②<b>층 이름 + 명제</b>만 남기고 부연은 발화로 내렸다 ③세 박스를 <b>「}」로 묶어</b> 「따로 셋」이 아니라 <b>한 덩어리</b>로 읽히게 했다.<br>★<b>착지를 빼고 묶음 오른쪽 한 줄로</b> 옮겼다 — 강사는 <b>세 칸을 위→아래로 짚고 오른쪽에서 닫으면</b> 된다.<br>⛔<b>“여러분의 잘못이 아닙니다”로 쓰지 말 것</b>(2026-08-10 강사 지적) — <b>유치하게 읽히고</b>, 자책 해제는 이미 <b>층 정리 3장</b>이 했다. <b>“세상이 한 일”</b>이라는 표현을 지킬 것 — 이게 <b>다음 장 「세상」 라벨 점등과 같은 말</b>이라 복선이 이어진다.<br>⛔<b>여기서 새 이유를 추가하지 말 것.</b> 금리·인구·공급망은 <b>한 줄로 닫고</b> 넘어간다.<br>⛔<b>“14분”을 화면에 쓰지 말 것</b> — 화면만 보는 청중에겐 뜻이 없다(2026-08-08). <b>발화에만</b> 남긴다.<br>★<b>2026-08-18</b> — 순서 교정(교차이슈 반영): 이 장을 66번(바깥 얘기 마무리) 앞으로 옮겼다 — 근거(세 덩어리)가 결론(바깥 얘기 마무리) 앞에 오도록.'},

 land:'정보는 <b>크다고 중요한 게 아니라 — 나에게 가까워야</b> 중요합니다',
 say:['“하나만 여쭤볼게요” — <b>대답은 받지 말 것</b>','질문부터 — “<b>엔비디아 181조가 중요할까요, 지금 베인 손가락이 중요할까요?</b>”','“당연히 손가락이죠”','왼쪽 짚으며 — “<b>지금까지 한 게 이런 얘기</b>였어요” <i>(⛔“= 코스피다”로 단정하지 말 것 — 실제로는 일자리·산업 얘기였다)</i>','“그건 <b>지금 어디 서 있는지</b> 알려고 한 거예요 — <b>딱 거기까지</b>”'],
 note:'★★<b>2026-08-10 제목 교정(강사 지적 — “뜬금없다 · 앞을 100% 못 받는다”).</b> 원인은 물음표가 아니라 <b>비유가 제목 자리에 있었다</b>는 것이다. 제목이 <b>비유</b>(코스피 vs 손가락)면 앞 내용과 이어지는 고리가 없다. → <b>제목은 논리</b>(“여기까지가 바깥 얘기였습니다”), <b>비유는 도식으로</b> 내렸다. 질문은 <b>강사가 말로</b> 던진다.<br>⚠️<b>착지 발화도 고쳤다.</b> <i>“지금부터는 가까운 쪽을 봅니다”</i>로 닫으면 <b>바로 다음 장(바깥 얘기 정리)과 역행</b>한다 — → <b>“그 바깥 얘기가 뭐였는지 세 덩어리로”</b>로 <b>다음 장을 부른다.</b> 「가까운 쪽으로 간다」는 선언은 <b>허리(주어 전환)</b>의 것.<br>★<b>2026-08-10 도식화(강사 지적 — 시인성).</b> 제목이 <b>둘을 대비</b>하는데 화면엔 <b>설명 세 줄</b>뿐이라 대비가 안 보였다. → <b>좌(코스피) vs 우(손가락)</b> 두 칸에 <b>같은 두 잣대(크기 · 나와의 거리)</b>를 나란히 놓았다. 「크다 ≠ 중요하다」가 <b>표 안에서 저절로</b> 읽힌다.<br>★★<b>진단 14분을 여기서 회수하며 허리(주어 전환)를 정당화한다.</b> 이 장이 없으면 “세상 얘기 실컷 하고 갑자기 메모?”가 된다.<br>⛔<b>“코스피는 필요 없다”로 말하지 말 것</b> — 진단 14분과 <b>2회차 회사 분석 전체를 부정</b>하게 된다. <b>배제가 아니라 순서</b>다.<br>⚠️<b>2026-08-08 교정.</b> <i>“모르면 엉뚱한 데 지원합니다”</i>는 <b>근거를 댄 적 없는 새 주장</b>이라 뺐다 → <b>“어디 서 있는지를 안다. 딱 거기까지”</b>. 변호는 하되 <b>한계를 같은 문장 안에서</b> 긋는다.<br>★<b>“어디 서 있는지”가 25분 「지도와 내 위치」의 선행 심기</b>가 된다.<br>★<b>질문은 던지고 답을 받지 않는다.</b><br>⚠️허리 블록의 “새 비유 금지”는 <b>①②③ 점등 구간</b>에 대한 것 — 이 도입 앵커는 예외로 명문화(2026-08-08).<br>★<b>2026-08-18</b> — 순서 교정(교차이슈 반영): 진단 정리(67번)를 앞으로, 바깥 얘기 마무리(이 장)를 뒤로 옮겼다 — 근거가 결론보다 뒤에 오던 역전을 바로잡고, 닫고(66)→다시 열고(67)→닫는(68) 구조를 한 방향으로 정리. 다음 장을 부르던 say 끝줄은 삭제하고 같은 뜻을 kick으로 옮겨 이음매를 유지.'},

 say:['왼쪽 세 줄 — “지금까지는 <b>남들 하는 대로</b> 쌓았죠”','오른쪽 세 줄 — “이제는 <b>읽는 법</b>이에요”','“<b>구조는 못 바꿔도 읽는 법은 배울 수 있어요</b>”','“그 셋이 뭐냐 — <b>바로 다음 장</b>입니다”'],
 note:'★★<b>2026-08-10 전면 교체 2차(강사 지시).</b> 왼쪽을 <b>세 줄</b>로 늘려 오른쪽과 <b>1:1 대칭</b>으로 맞췄다. 그러면 <b>취업(스펙)과 진로(적성검사·상담)가 왼쪽에 함께</b> 들어가 — 이 강의가 <b>둘 다 다른 방식으로 한다</b>는 게 한 화면에서 보인다.<br>★왼쪽 부제 <b>「남들 하는 대로」</b>는 25번 연대기(코딩 배우라니 배우고 · 다들 개발자 하라니 하고 · 이번엔 AI)와 43번(먼저 겪은 사람도 못 따라간다)을 <b>한 마디로 회수</b>한다.<br>⛔<b>왼쪽을 「진로 탐색」이라고만 쓰지 말 것</b> — 이 강의도 진로를 다루므로 자기부정이 된다. 부정하는 건 <b>방식</b>(적성검사·상담처럼 «남이 답을 주는» 방식)이지 진로 자체가 아니다.<br>①<b>「눈」은 언어가 아니다</b> — 구버전 「회사를 읽는 눈」은 범주가 어긋나 좌우 대비가 성립하지 않았다.<br>②<b>다음 장(나·회사·시장)과 1:1</b> — 여기서 둘을 말해놓고 다음 장에서 셋이 나오던 것을 맞췄다.<br>⛔<b>「언어」라는 말을 되살리지 말 것.</b> 좌 <b>쌓는 것</b> / 우 <b>읽는 법</b>.<br>★AI는 <b>도구</b>로만 둔다 — 여기서 AI를 배울 것으로 세우면 «AI 강의»가 된다.<br>바로 오픈채팅으로 넘어간다.'},
{sec:'허리',t:'venn',dim:['c'],h:'오늘 캘 것은 <em>세 가지</em>입니다',core:'?',
 cap:'셋이 겹치는 자리 = <b>지원할 회사 · 자소서에 쓸 내용 · 포트폴리오 · 진로</b><br><small><em>순서</em>도 있습니다 — <b>①나 → ②내 앞의 것 → ③시장</b><br>다만 <em>오늘 캐는 건 앞의 둘</em> — <b>③ 시장은 다음 시간에 다룹니다</b></small>',
 side:'<span class="vq">왜 「나」부터인가</span><span class="va">잴 <b>자</b>가 없으면 —<br><b>취업</b> “그 회사 좋아 보이네”<br><b>진로</b> “그것도 괜찮아 보이네”<br>로 끝납니다</span>',
 say:['“캘 건 <b>세 개</b>예요 — 나 · 회사 · 시장”','“근데 <b>오늘은 앞의 둘</b>까지입니다. 세 번째는 다음 시간”','“겹치는 자리가 <b>진로</b>고 — 거기서 <b>포트폴리오</b>가 나와요”','“회사부터 파면 안 되냐고요? — <b>잴 자가 없으면 못 잽니다</b>”','“<b>진로도 똑같아요.</b> 자가 없으면 «그것도 괜찮아 보이네»로 끝나요”'],
 note:'★★<b>2026-08-07 신설 — 없으면 25~82분 한 시간이 “왜 이걸 하는지 모르는 시간”이 된다.</b><br>바로 앞 진단이 “<b>회사가 뭘로 먹고사는지 아는 사람이 뽑힌다</b>”로 끝나는데 곧바로 <b>나</b>를 파기 시작하면 청중은 “회사 알라며? 왜 내 얘기?”가 된다. 게다가 <b>진로 상담으로 온 사람에겐 ‘회사 수익’이 딴 강의로 들린다.</b><br>⛔<b>겹치는 자리에서 답을 내지 말 것.</b> “교집합 = 지원동기”의 <b>완성은 82분(3도구 착지)</b>이다. 여기선 <b>이름만 걸고</b> 넘어간다 — 열면 그 블록이 죽는다.<br>★“<b>진로</b>”라는 단어를 반드시 발화할 것. 제목이 「역설계로 찾는 나만의 진로」인데 처방이 취업 언어로만 흐르면 <b>진로 목적으로 온 절반이 남 얘기로 듣는다</b>.<br>★<b>2026-08-10 재배치(강사 지적).</b> <i>“왜 나부터인가”</i>가 <b>cap 셋째 줄</b>에 있어 눈이 그림에서 멈추면 못 읽었다 → <b>벤 오른쪽</b>으로.<br>★<b>2026-08-10 진로 축 보강 2차(강사 지적).</b> 오른쪽 문장이 <i>“그 회사 좋아 보이네”</i> <b>취업 한 줄뿐</b>이라 진로로 온 사람에겐 남 얘기였다 → <b>취업 / 진로 두 줄 대구</b>로. 진로 버전은 <b>“그것도 괜찮아 보이네”</b>.<br>★<b>2026-08-10 진로 축 보강(강사 지적).</b> ①「회사」 원 범례를 <b>“그 일이 어떤 문제를 푸는지”</b>로 넓혔다 — 「회사가 추진하는 것」은 <b>취업 전용</b>이라 진로로 온 사람에겐 남 얘기였다. ②겹치는 자리에 <b>포트폴리오</b>를 넣었다(3회차와 이어진다).<br>★‘<b>자</b>’를 여기서 심는다 → 34분 검색어에서 회수.<br>⏱ 1분.<br>★<b>2026-08-18 문장 손질</b> — 오른쪽 곁말이 <i>“왜 「나」부터<b>냐면</b> … 로 <b>끝나거든요</b>”</i>로 화면에서 구어였다(규칙 5 ⛔「~거든요」) → 물음을 <b>“왜 「나」부터인가”</b>로 세우고 답을 <b>“…로 끝납니다”</b>로 닫았다. <b>취업/진로 두 줄 대구와 「자」는 그대로</b>(08-10 강사 지적분). say의 <i>“잴 자가 없으면 못 잽니다”</i>는 강사 것이라 유지.'},

 note:'★★★<b>2026-08-14 신설(강사 지시).</b> <i>“1화에서 AI가 표면적으로 안 드러나고 도구가 더 드러난다.”</i> 실측이 그랬다 — <b>1회차 AI 언급 8% · 2회차 2% · 「비서」 0건</b>인데 강의 제목은 <b>「AI로 …」</b>다.<br>★★<b>이 장이 3회 관통 앵커다.</b> 회수 지점 = <b>2회차 recap</b>(“이번엔 비서한테 회사를 시킵니다”) · <b>3회차 클로징</b>(“3주 동안 비서를 만든 겁니다”). ⛔셋 중 하나만 고치지 말 것.<br>★<b>메모의 이유가 바뀐다</b> — 전에는 <i>“쌓으면 좋다”</i>였다(약한 동기). 이제는 <b>“안 적으면 AI가 못 쓴다”</b>다. 저동기 청중에게 훨씬 세다.<br>★<b>실패 시연이 이 장의 증명이다</b> — 96~101분 [1단] <b>흔한 문장</b>이 <i>“재료 없이 비서 시킨 결과”</i>가 된다. 그래서 say에 <b>예고 한 줄</b>을 넣었다.<br>⛔<b>제품 이름을 대지 말 것</b>(영업 톤 금지) · ⛔<b>부자를 비난하지 말 것</b> — <b>“그 방법을 우리도 쓴다”</b>까지만. 사실 나열 + 1인칭.<br>⏱ 50초.<br>★<b>2026-08-18 글자 축약</b> — kick 끝 "부터" 삭제.'},

 note:'★★<b>2026-08-10 진행 부담 해소(강사 지적).</b> ①<b>“청중이 채팅에 넣는 걸 기다릴 시간이 없다”</b> ②<b>“내 채팅방을 화면에 여는 게 부담스럽다”</b> — 둘 다 맞다.<br>→ ①<b>기다리지 않는다.</b> 「지금 아니어도 됩니다 · 쉬는 시간 전까지 아무 때나」로 <b>시간 압박을 없앤다</b>. ②⛔<b>채팅방 화면을 절대 띄우지 않는다.</b> 온 것은 <b>강사가 폰으로 보고 읽어준다</b> — 다른 대화·개인정보 노출 위험이 사라진다.<br>★<b>라이브 시연은 준비 예시로 굴러가게 이미 설계돼 있다</b>(“아마 이렇게 적으셨을 겁니다” · “이런 경우도 흔합니다”). 채팅이 오면 <b>강사가 읽어주고 그 자리에서 번역</b>만 하면 된다 — <b>화면은 준비 예시 그대로</b>.<br>⛔<b>약속선 주의.</b> 발표·호명으로 들리면 즉시 실패한다. <b>익명</b>과 <b>“지금 아니어도 된다”</b>가 그 방어다.<br>⚠️폐기 표현: <s>“기분이 확 움직였던 순간”</s> — 학생이 무슨 말인지 모른다.<br>⬜<b>오픈채팅 QR 필요.</b>'},
{sec:'휴식',t:'big',kick:'여기까지 — <b>세상이 여러분에게 한 일</b>',big:'휴식 <em>10분</em>',
 sub:'돌아오면 — <em>주어가 바뀝니다</em>. <b>여러분이 하는 일</b>부터 시작합니다<br>첫 번째 도구는 <b>CT 메모</b>입니다<br><small>⚠️채팅 아직 안 쓰셨어도 됩니다 — <b>쉬는 동안 편하실 때</b></small>',
 say:['화면에 예고 한 줄을 띄워둔다','“<b>여기까지가 진단</b>이었어요”','“돌아오면 <b>도구</b>부터 합니다”','⛔<b>결론을 미리 말하지 말 것</b>','강사는 이 시간에 <b>채팅 확인 + 준비 예시 세팅</b>'],
 note:'★★★<b>2026-08-14 위치 이동(강사 지시).</b> <i>“진단 → 휴식 → 도구로 가면 흐름이 안 끊긴다.”</i><br>구버전은 <b>도구②·시연②까지 다 하고</b> 쉬었다(75분) — <b>도구 블록 한가운데를 지나</b> 쉬는 셈이라 흐름이 끊겼다.<br>★<b>채팅 수집과 맞물린다</b> — 바로 앞이 오픈채팅 안내이고, 안내가 <i>“쉬는 시간 전까지 아무 때나”</i>다. <b>쉬면서 쓰게 하고, 돌아와서 시연①에서 그걸 쓴다.</b><br>⚠️<b>2026-08-12 결정(휴식을 62→72분으로 미룸)을 뒤집는다.</b> 그때 조건은 <b>「미리 고지」</b>였고 그건 그대로 지킨다 — 고지 문구를 <b>「40분쯤에 10분」</b>으로 갱신했다.<br>⚠️앞 43분 / 뒤 57분으로 <b>앞이 짧다.</b> 대신 <b>무거운 진단을 끝내고 쉬는</b> 구조라 복귀 후 집중이 산다.<br>⏱ 45~55분.<br>★<b>2026-08-18 글자 축약</b> — kick 어미("가"·"이었습니다") 정리.<br>★<b>2026-08-18 문장 손질</b> — sub 두 줄이 <i>“…하는 일<b>부터</b> 시작합니다 / 첫 번째 도구 CT 메모<b>부터요</b>”</i>로 <b>「부터」가 연달아</b> 나오고 뒤 줄은 서술어 없이 끊겼다 → <b>“첫 번째 도구는 CT 메모입니다”</b>. 예고 한 줄이라는 성격은 그대로고 77번 대문(<i>“CT 메모 — 나를 찍는다”</i>)이 그 이름을 바로 받는다.'},

{sec:'도구 ① CT',t:'gate',gnum:'세션 3 · 파트 1',gt:'<em>CT 메모</em> — 나를 찍는다',gs:'이름부터 풀고 시작합니다<br><small>짝: ③ 심리 — 지도가 사라졌다 · 도구 셋 중 첫 번째</small>',

{sec:'도구 ① CT',kick:'도구가 <b>셋</b>이라고 하니 — 벌써 많아 보이시죠',t:'big',

 land:'오늘 하는 건 <b>하나</b>입니다 — <em>나부터</em>',

 note:'★★<b>2026-08-21 신설(강사 지적 — 밤 수술).</b> 청중 반응 예상 — <i>“CT 메모는 뭐고 불편 메모는 뭔데. 간단하다더니 해야 할 게 왜 이렇게 많냐.”</i> 도구 «수»의 부담을 여기서 선제 차단한다 — <b>셋 = 같은 동작(찍기)의 세 방향 · 오늘은 하나만</b>.<br>★<b>«한 묶음으로 굴러간다»의 본편은 3화 선형 블록</b>(순서·되돌이·봉화)이다 — 여기는 <b>예고만</b>. 3화가 회수한다(“첫 시간에 한 묶음이라 했죠”는 3화 몫).<br>⛔<b>CCTV·카메라 비유 금지</b> — 바로 다음 장(이름 풀이)의 답을 선공개하는 사고(2026-08-18에 대문에서 같은 사고를 걷어냈다). «찍는다» 동사는 대문 gt가 이미 쓰므로 선공개가 아니다.<br>⛔새 비유 금지 — 이 구간 비유는 7개 상한(대본 규율).<br>⏱ 25초.'},

{sec:'도구 ① CT',kick:'이름 풀이 — <b>30초</b>',t:'vs',h:'왜 이름이 <em>CT 메모</em>인가',

 right:{t:'<b>CT</b> — 병원의 <b>단층</b>촬영',v:'<span class="vl"><b>안</b>을 잘라서 찍습니다</span><span class="vl">겉은 멀쩡한데 안에서 뭐가 일어나는지</span><span class="vl"><b>눈에 안 보이는 걸 봅니다</b></span>'},
 sub:'밖에서 <b>무슨 일이 있었고</b> — 그때 <b>내 몸이 뭘 했는지</b>. <em>둘을 같이</em> 찍습니다',
 land:'그래서 <b>CT 메모</b>입니다 — <em>CCTV처럼 판단 없이 · CT처럼 안까지</em>',
 say:['“이름이 좀 이상하죠. 풀어드릴게요”','왼쪽 — “<b>CCTV</b>, 다들 아시죠. 밖을 찍어요. <b>판단은 안 하고</b>요”','오른쪽 — “<b>CT</b>는 병원에서 찍는 거요. <b>몸 안을 잘라서</b> 봐요”','<i>(한 박자)</i> “<b>겉으론 멀쩡한데</b> 안에서 뭐가 있는지 보려고 찍는 거예요”','“이 메모가 <b>둘 다</b> 하는 겁니다”'],
 note:'★★★<b>2026-08-14 신설(강사 지시 — “CT 메모가 뭔지, 왜 쓰는지 설명이 필요하다”).</b><br>구버전은 이름 풀이가 <b>대문 부제 한 줄</b>뿐이었고, <b>CCTV 그림은 14장 뒤</b>에야 나왔다 — 이름을 던져놓고 회수가 너무 멀었다(verify §8이 경고하던 항목).<br>★<b>CT를 「컴퓨터 단층촬영」이라고 한자·영문으로 풀지 않는다</b> — <b>“병원에서 찍는 그거”</b>가 20대에게 훨씬 빠르다. ⛔약어 원문(Computed Tomography) 금지 — 화면이 무거워지고 아무도 안 읽는다.<br>★<b>CCTV 쪽의 값은 「밖」이 아니라 「판단하지 않는다」</b>다 — 그게 <b>감정어 금지</b>의 근거가 되고, 뒤의 기록 기준 장으로 이어진다.<br>⏱ 30초.<br>★<b>2026-08-18 글자 축약</b> — kick을 문장에서 라벨로("이름부터 풀고 가겠습니다" → "이름 풀이").'},

{sec:'도구 ① CT',kick:'그런데 <b>「안」</b>이라고 하면 — 보통 이걸 떠올리십니다',t:'big',

 land:'왜 그렇게까지 찍냐면 — <b>결론을 적으면 겹치는 게 안 보이고</b>, <em>이렇게 적어야 나중에 잴 수 있기</em> 때문입니다',
 say:['“<b>안을 찍는다</b>니까 기분 적으라는 줄 아세요”','<i>(정색)</i> “<b>아니에요.</b> 기분은 이미 <b>내린 결론</b>이에요”','“<b>몸이 한 일</b>을 적는 겁니다 — 커서만 봤다, 손 들었다, 심장이 빨라졌다”','“왜냐면요 — <b>결론을 적으면 나중에 겹치는 게 안 보여요</b>”','★<b>병원 검진</b> — “병원 가면 <b>«아파요»라고 안 적잖아요.</b> <b>체온 38.2, 혈압 140</b>으로 적죠”','<i>(한 박자)</i> “왜 그러겠어요? <b>그래야 다음에 비교가 되니까요.</b> 낫고 있는지 나빠지는지”','“증상도 <b>«좀 안 좋아요»가 아니라 «며칠째, 어디가, 어떻게»</b>로 적고요. 그게 <b>관리</b>거든요”','★<b>착지</b> — “<b>CT 메모가 그거예요.</b> 나한테 그 검진을 하는 거고, 재료는 <b>몸이 한 일</b>이에요”','⛔<b>진단·치료 얘기로 새지 말 것</b> — 「수치로 적어야 잴 수 있다」까지만','“그 얘기는 <b>조금 뒤에</b> 자세히”'],
 note:'★★★<b>2026-08-14 신설 — 이 장이 없으면 논리가 깨진다.</b><br>⚠️<b>실제 충돌:</b> 대문은 <i>“CT처럼 <b>안</b>을 찍습니다”</i>인데, 15장 뒤 기록 기준 장은 <i>“CCTV는 <b>머릿속</b>을 찍지 못한다 · 고민했다·긴장했다는 기록 대상 아님”</i>이다. → 학생 머릿속에 <b>“안을 찍는다며 왜 감정은 쓰지 말래?”</b>가 남는다.<br>★<b>여기서 「안 = 몸이 한 일」로 못 박아</b> 그 충돌을 없앤다. 뒤 장은 <b>같은 기준의 반복</b>이 된다.<br>★<b>예시 두 줄은 라이브 시연 ①의 것과 같은 문장</b>이다 — 여기서 심고 거기서 회수한다. ⛔다른 예시로 바꾸지 말 것.<br>★<b>land가 「왜 쓰는지」의 씨앗</b>이다 — 회수는 <b>선 → 묶음 → 검색어</b>(★놀라움 ④). ⛔여기서 답을 열지 말 것.<br>⏱ 40초.'},

 say:['⏱<b>15초.</b> 세 줄을 읽어만 준다 — ⛔설명하지 말 것','“<b>기준</b>이 없어진 거예요” 한 번만 강조','바로 다음 장으로'],
 note:'★★<b>2026-08-10 신설(강사 지적).</b> 다음 장이 <b>“지도를 그리려면”</b>으로 시작하는데 청중 머릿속엔 <i>“지도가 뭐지?”</i>였다. <b>「지도가 사라졌다」는 45~49번 · 20장 전</b>이고, 앞 장(모래시계)의 캡션 한 줄로는 <b>왜</b> 사라졌는지가 안 돌아온다.<br>★<b>쓰기 직전에 되짚는다</b> — 심은 곳(심리)과 쓰는 곳(도구①)이 멀면 <b>쓰기 직전 15초</b>가 가장 싸다.<br>★이 세 줄은 <b>47번의 것</b>(사라진 것/늘어난 것 → 기준이 없어졌다)이다. 47을 고치면 여기도 같이 고친다.<br>★<b>wrap 형식의 첫 등장</b> — 뒤에 파트 마무리 3장이 같은 그림으로 온다. 여기서 <b>“이 그림 = 정리”</b>를 학습시킨다.<br>⏱ 15초.<br>★<b>2026-08-18</b> — wn에서 「되짚기 — 」를 빼고 「세션 3 · 파트 1」만 남겼다(직전 대문과 번호를 맞추는 §8 검사 통과). 다른 wrap 셋(103·121·133)은 파트 끝인데 이 장만 파트 시작 3장째라, 「되짚기」 이름이 청중에게 「파트가 끝났다」로 오독될 여지가 있었다.'},

 sub:'지하철 노선도에 <b>「현재 위치」 표시가 없으면</b> — 노선을 다 알아도 <em>어디로 갈지 못 정합니다</em><br><b>CT 메모 = 그 「현재 위치」 표시</b> — <em>여러 번 적어야</em> 나옵니다',
 say:['“<b>지도가 사라졌다</b>”를 되짚는다','“지도 그리려면 <b>제일 먼저 뭐가 있어야 돼요?</b>”','받고 — “<b>내가 지금 어디 있는지</b>”','왼쪽부터 화살표를 따라 한 칸씩 — “<b>남이 안 그려주니까</b> · <b>내가 그리는데</b> · <b>먼저 내 위치</b>”'],
 note:'★<b>2026-08-10 문장 교정 2차(강사 지적 — “박스 안 문장이 어색하고 불명확”).</b> 구버전은 <i>“그리려면 먼저 / 내가 지금 / 어디 있는지”</i>처럼 <b>한 문장을 세 조각으로 잘라</b> 놓아 칸마다 뜻이 서지 않았다 → <b>칸마다 완결된 문장</b>으로. 세 칸을 이어 읽으면 <b>“남이 안 그려준다 → 그럼 내가 그린다 → 먼저 내 위치부터”</b>가 된다.<br>★<b>2026-08-10 흐름도화(강사 지적).</b> 세 칸이 원래 <b>순서가 있는 흐름</b>인데 나란히 놓여 있어 «세 개의 사실»로 읽혔다 → <b>화살표로 이었다.</b><br>⬜<b>지하철 노선도 이미지 자리는 뺐다</b>(강사 판단) — <b>글로 충분하고</b>, 그림을 넣으면 그림이 주인공이 된다.<br>★★<b>2026-08-06 신설 — 이 블록의 심장.</b> 구버전은 “왜 하는가”가 <b>강사 노트 한 줄</b>이었고 발화문이 없었다.<br>★<b>지도는 새 비유가 아니라 이 강의의 척추다</b> — 진단 ③심리 정리(“지도가 사라진 자리에 서 있을 뿐”)와 이 블록 앵커 <b>사이에 빠져 있던 한 칸</b>을 채운다.<br>⚠️<b>청중에게 추론을 시키지 말 것.</b> <b>끝까지 말로 이어준다.</b><br>★<b>2026-08-18</b> — kick을 「③ 심리 — 지도가 사라졌다」에서 바꿨다. 휴식 직후 2.7분 안에 「지도가 사라졌다」가 네 장 연속(77 gs·80 cap·81 wrap·이 장)이라 되짚기가 네 겹이었다 — 짝 점등(80)만 남기고 이 장은 「그래서 다음 할 일」로 넘긴다.<br>★<b>2026-08-18</b> — sub 뒷문장 "한 번으로는 안 잡힙니다 —"(앞과 동의 반복) 삭제, 핵심만 남김.'},

 sub:'“그럼 <em>바로 보이는 취업 준비부터</em> 하는 게 효율 아닌가?” — <b>맞는 말입니다.</b><br><b>취업 준비를 멈추라는 얘기가 아닙니다.</b> 방향 잡는 데 드는 비용은 — <em>하루 15초</em>입니다',
 out:{tag:'★진로가 애매하게 들리신다면 — 이렇게 잡겠습니다',v:'<b>내 전공을 살리거나 · 새 관심 분야를 찾아서</b> → <b>취업 · 창업 · 연구</b>를 하는 것<br><small>셋 중 뭐든 됩니다. <em>취업은 그중 하나</em>입니다</small>'},
 land:'방향은 조준을 <b>대신하는 게 아니라</b> — <b>조준할 재료</b>를 줍니다',
 say:['“<b>진로는 방향이고, 취업은 조준이에요</b>”','★<b>진로 정의를 여기서 못 박는다</b> — “<b>진로가 좀 애매하죠?</b> 이렇게 잡을게요”','“<b>내 전공을 살리거나, 새로 관심 생긴 분야를 찾아서</b> — <b>취업이든 창업이든 연구든</b> 하는 거요. 그걸 진로라고 하겠습니다”','“<b>취업은 그중 하나</b>예요”','두 화살을 훑으며 — “<b>둘 다 맞혔어요.</b> 다른 건 <b>과녁</b>이죠”','“근데 <b>진로는 틀려도 바로 안 보여요</b> — 그래서 다들 미뤄요. <b>당연한 거고요</b>”','★반론을 <b>강사가 먼저</b> — “그럼 <b>급한 취업부터가 효율 아니냐</b>”','“<b>맞아요.</b> <b>취업 준비를 멈추라는 게 아니에요</b>”','“방향은 조준을 대신하는 게 아니라 — <b>조준할 재료</b>를 주는 거예요”','“그 비용이 <b>하루 15초</b>고요”'],
 note:'★★<b>2026-08-08 그림으로 교체(강사 지적 2건).</b> ①“내용이 너무 방대하다”(2칸×3줄+부제 2줄+착지 = 9줄) ②“<b>「붙었는데 1년 안에 그만두는 것」이 뜬금없다</b>”.<br>★<b>②의 원인 — 「엉뚱한 과녁」이 무엇인지 말한 적이 없었다.</b> 과녁 = <b>회사·직무</b>라는 연결이 빠져서, 은유에서 실물로 건너뛰는 계단이 없었다. → <b>그림이 두 과녁에 이름을 붙여</b>(“나한테 맞는 자리” / “나랑 안 맞는 자리”) 그 계단을 만든다.<br>★★<b>이 그림의 핵심은 「둘 다 명중」이다.</b> 조준 실력을 탓하는 게 아니라 <b>과녁이 다르다</b>는 것 — 그래서 조준 연습(취업 기술)을 폄하하지 않으면서 순서만 말할 수 있다.<br>★<b>화살 두 개를 손으로 훑으며</b> 말할 것. 글자를 읽지 말고 <b>선을 따라가게</b> 한다.<br>★★이 장이 답하는 질문은 <b>「왜 취업이 아니라 진로부터냐」</b>다. <b>「왜 회사가 아니라 나부터냐」는 바로 앞 장이 이미 답했다</b> — 두 질문을 섞지 말 것.<br>⛔<b>총·방아쇠 표현 금지</b> — “조준 / 과녁”까지만.<br>⛔<b>여기서 44.4%를 쓰지 말 것</b> — 숫자는 37분 ⑮의 것.<br>★★★<b>2026-08-08 프레임 교정(강사 지적) — “그럼 바로 보이는 취업 준비를 하는 게 에너지·시간 절약 아닌가?”</b><br><b>그 반론이 옳다.</b> 구버전은 「방향이냐 조준이냐」로 놓아 <b>양자택일</b>로 읽혔고, 근거가 <b>미래 비용</b>(1년 뒤 퇴사)뿐이었다. <b>지친 사람에게 미래 비용은 지금의 급함을 못 이긴다.</b> 게다가 구 sub(“진로는 틀려도 안 보인다 / 취업은 바로 보인다”)는 <b>오히려 「그럼 취업만 하자」의 근거</b>였다.<br>→ ①<b>반론을 강사가 먼저 꺼내 인정</b> ②<b>배타 관계가 아님</b>을 못 박음(“취업 준비를 멈추라는 게 아니다”) ③근거를 <b>미래 비용 → 지금 이득</b>으로(<b>조준할 재료</b>를 준다) ④<b>비용 명시</b>(<b>하루 15초</b>).<br>★<b>“조준할 재료”가 이 강의의 뿌리 문장과 같은 축</b> — 45분 <i>“자소서가 안 써지는 건 글을 못 써서가 아니라 쓸 재료가 없어서”</i>. <b>바로 다음 장(결과 먼저)이 그 재료의 실물</b>이다.<br>⛔<b>“자소서”를 여기서 말하지 말 것</b>(3회차 자산) — <b>“조준할 재료”</b>로만.<br>★<b>피드백 속도 대비는 화면에서 뺐다</b> — 반론의 근거가 되기 때문. <b>발화로만</b>, 그것도 <b>공감</b>으로(“그래서 다들 미뤄요. 당연한 거고요”).<br>★<b>2026-08-18 문장 손질</b> — 화면 두 곳이 구어 「~고요」로 끝났다(도식 <i>“다른 건 과녁<b>이고요</b>”</i> · 정의 상자 <i>“취업은 그중 하나<b>고요</b>”</i>) → <b>“과녁입니다” · “그중 하나입니다”</b>. <b>글자 수가 같아 도식 좌표에 영향이 없다.</b> 대본 원문(<i>“다른 건 뭐냐면 — 과녁이죠”</i> · <i>“취업은 그중 하나고요”</i>)은 <b>강사 발화라 그대로</b> — 규칙 5의 「대본을 화면에 복사하지 않는다」를 되돌린 것이다. 「둘 다 명중」·과녁 이름은 손대지 않았다.'},

 note:'★★<b>손을 드는 게 목적이 아니라 「내려가는 걸 보여주는 게」 목적이다.</b> 방 전체가 드롭을 눈으로 본다 — 말로 하는 것보다 훨씬 센 증명.<br>★★<b>자리를 앞으로 옮기지 말 것(2026-08-08).</b> 강의 시작에 하면 <b>라포가 없어 1단부터 안 든다.</b> 1단이 실패하면 2·3단이 통째로 무너진다. 여기는 <b>25분 경과 + 채팅방에 한 줄 던져본 참여 경험</b>이 있어 문턱이 낮다.<br>⚠️<b>1단은 반드시 많이 들어야 한다.</b> 그래서 범위를 넓게 연다(폰·손글씨·카톡 전부). <b>강사가 먼저 손을 든다.</b><br>⚠️<b>안 들면:</b> “아, 다들 부끄러우시구나 <i>(웃으며)</i> 제가 들게요” 하고 <b>그냥 진행한다.</b> 재촉 금지.<br>★<b>손들기는 1회차에서 여기 한 번뿐이다</b> — 조건(결과가 보이는 깔때기 + 라포)이 갖춰진 유일한 자리.<br>⛔<b>“취업이나 진로 고민하시는 분?”을 1단으로 쓰지 말 것</b> — <b>전원 해당</b>이라 정보량이 0이고, 뻔해서 김이 샌다.'},

{sec:'도구 ① · 정의',t:'fig',h:'학교가 가르친 메모는 — <em>셋 중 하나</em>뿐입니다',

-weight="800" fill="var(--ac)">③ 꺼내기</text><line x1="864" y1="112" x2="1156" y2="112" stroke="var(--ac)" stroke-width="1.5" opacity=".5"/><text x="1010" y="150" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">모아둔 걸 재료로 바꾸기</text><text x="1010" y="182" text-anchor="middle" font-size="24" font-weight="700" fill="var(--ink)">자소서 · 기획서 · 공모전</text><rect x="940" y="206" width="140" height="38" rx="19" fill="var(--ac)"/><text x="1010" y="232" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">꺼내 쓰기</text></svg>',
 land:'오늘 하는 메모는 <b>「저장」이 아닙니다</b> — <em>캐는 것</em>입니다',
 sub:'스쳐 간 것은 <b>다시 돌아오지 않습니다</b> · 정답이 없어서 어려운 거지 — <b>태도의 문제가 아닙니다</b>',
 say:['①만 짚으며 — “<b>학교에선 이것만 가르쳤어요</b>”','②③으로 옮기며 — “근데 지금 필요한 건 <b>이 둘</b>이에요”','“면접 나와서 <b>«이렇게 말할걸»</b> 하는 거 — 집에 오면 기억 안 나죠. 그게 ②예요”','“<b>저장이 아니라 캐는 것</b>”'],
 note:'★<b>2026-08-10 도식화(강사 지적 — 시인성).</b> 3칸 나열이라 <b>①과 ②③의 갈림</b>이 안 보였고 sub 세 줄이 각각 다른 얘기였다. → <b>점선으로 「학교가 가르친 것」과 「지금 필요한 것」을 가르고</b>, 각 칸에 <b>목적 배지</b>(저장 / 안 놓치기 / 꺼내 쓰기)를 달았다. 결론은 <b>제목과 착지</b>로 올렸다.<br>⚠️비유 통일: <b>“캔다”까지만.</b> 광산·원석·세공은 요리 비유와 충돌하므로 폐기.'},
{sec:'도구 ① · 정의', img:'../이미지/CT노트.jpg',imgq:'<b>강사 손글씨 노트 사진</b> — 펼친 페이지에 여러 줄이 쌓인 게 보이게 <i>(직접 촬영)</i>',t:'big',big:'실제 기록',
 sub:'제목 없음 · 날짜 없음 · 비문 · 오탈자 — <em>이 상태가 정상</em>입니다<br><b>조건은 하나 — 한 곳에만 적을 것</b><br><br><small>필기든 휴대폰이든 상관없습니다 · <b>AI도 평소 쓰시던 것으로</b> — 오늘 다루는 건 <b>전부 무료로 됩니다</b></small>',
 say:['“이게 전부” — 한 줄 짚으며','“한 군데에만”','“<b>AI도 평소 쓰시던 거 아무거나</b>”'],
 note:'⬜<b>강사 실제 손글씨 노트 사진 필요.</b> ⚠️현장 미러링 금지. ⚠️“손으로 적으세요” 강요 금지.<br>★<b>2026-08-06 신설 — AI 도구 언급 규율(1·2·3회차 전체 적용).</b> 구조는 손글씨와 같다: <b>“저는 이렇게, 여러분은 편한 대로.”</b><br>①<b>순서 엄수</b> — “아무거나” → “무료로 다 된다” → (그다음에야) 강사 사정. 순서가 바뀌면 영업 톤이 된다.<br>②⛔<b>제품명을 먼저 발화하지 말 것.</b> “저는 유료로 쓰는 게 있어요”까지만. <b>학생이 물으면 그때 답한다</b>(강사 재량). 공공기관 강의에서 강사가 먼저 제품을 대면 ⛔“특정 AI 제품 영업 톤” 금지선이다.<br>③<b>유료를 말할 땐 반드시 이유를 붙인다</b> — “제가 이걸로 일을 하니까.” 이유가 없으면 “돈 내야 되나 보다”로 들려 <b>진입장벽이 생긴다.</b><br>④⛔<b>비교·추천 금지.</b>'},
{sec:'도구 ① · 정의',kick:'이렇게 <b>막</b> 적어도 되는 이유',t:'big',
 big:'이건 —<br><em>아무도 안 봅니다</em>',
 sub:'<b>CT 메모 · 불편 메모 · 다음 시간에 배울 세 번째</b> — <b>셋 다 같습니다</b><br><br>보는 사람은 <b>여러분</b>과 <b>AI</b>. 그게 전부입니다',
 land:'<b>남이 볼 거라고 생각하는 순간 — «적을 가치가 있나»부터 따지게 됩니다</b>',
 say:['“이거 어디 제출하는 거 아니에요”','“보는 사람은 <b>여러분이랑 AI</b>뿐이에요”','“<b>남이 본다</b>고 생각하면 — «이걸 적어도 되나»부터 따지게 되거든요”','★“그러다 <b>안 적게 돼요.</b> 그게 제일 아까워요”','⛔<b>「나중에 포폴로 낸다」고 말하지 말 것</b> — 지금 말하면 이 장이 무너진다. 3회차가 <b>「생각을 위한 것 / 제출을 위한 것」</b>으로 따로 가른다'],
 note:'★<b>2026-08-16 신설(강사 지시).</b> 세 도구 전부 <b>「혼자 보고 AI하고만 논의하는 자료」</b>임을 명시.<br>★★<b>90번이 요구하던 근거다</b> — 90번은 <i>“제목 없음·날짜 없음·비문·오탈자 — 이 상태가 정상입니다”</i>라고 하는데 <b>왜 정상인지가 없었다.</b> 그 이유가 이것이다.<br>★<b>94번(실행 규칙)의 복선</b> — 94번 land가 <i>“시작을 막는 건 대부분 이 다섯 개”</i>이고 그중 하나가 <b>「판단하지 않기」</b>다. 이 장이 <b>왜 판단하면 안 되는지</b>를 미리 깐다.<br>⚠️<b>100번(왜 15초)과 중복이 아니다</b> — 100번은 <b>「길이」</b> 때문에 «적은 걸 고치게» 되는 것이고, 이 장은 <b>「독자」</b> 때문에 «적을지 말지» 따지게 되는 것이다. 앞은 <b>내용을 왜곡</b>하고 뒤는 <b>시작을 막는다.</b><br>⛔<b>3회차 포폴과 충돌하지 않는다</b> — 3회차 130번이 이미 <b>「생각을 위한 것 / 제출을 위한 것」</b>으로 가른다. <b>메모는 그보다 «앞 층»</b>이라 그림에도 안 나온다. ⛔여기서 포폴을 예고하면 이 장의 효과가 0이 된다.<br>★<b>2026-08-18 글자 축약</b> — kick을 문장에서 명사구로("이유가 있습니다" → "이유").'},

 say:['“<b>정리해볼게요. CT 메모가 뭐냐.</b>”','세 조각을 <b>손으로 짚으며</b> — “언제 / 무엇을 / 얼마나”','“<b>감정 이름은 안 씁니다</b>” <i>(빨간 줄을 짚을 것)</i>','⛔“왜 하필 15초냐”는 <b>여기서 답하지 말 것</b> — 뒤에 따로 있다'],

{sec:'도구 ① · 정의',t:'fig',h:'CT 메모가 하는 일은 <em>세 가지</em>입니다',

 note:'⚠️<b>2026-08-08 압축(전수검사).</b> 구버전 4항목 중 <b>1·2가 72번 「②판단을 미룬다」와, 4가 72번 「①습관」과 중복</b>이었다 — <b>「판단」이 72·78·79 세 장에 걸쳐 세 번</b> 나왔다.<br>→ 여기서만 할 일(<b>왜 하필 이 길이인가</b>)로 좁히고, 앞 내용은 <b>③에서 회수</b>로 처리.<br>★<b>착지가 이 장의 값이다</b> — “<b>의지의 문제가 아니라 길이의 문제</b>”. 자책 해제와 해법이 한 문장에 있다.<br>★근거 5종은 <b>다음 장</b>.'},

{sec:'도구 ① · 왜 15초',t:'wrap',wn:'세션 3 · 파트 2',wt:'<em>어떻게 적나</em> — 방금 한 것',

 wl:'손에 남는 것 — <em>판단을 미루고 찍는 습관</em>. 해석은 <b>나중에 한꺼번에</b>',

{sec:'도구 ① · 묶기',t:'big',big:'모이면 <u>던진다</u>',
 sub:'스무 개면 가장 좋고 — <b>세 개여도 됩니다</b><br><br>메모를 넣으면 <b>아까 그 「한 문장」</b>을 뽑아주는 명령어 — <b>[P2]</b><br><small>채팅방 공지에 고정해 둡니다 · 오늘 드리는 명령어는 <b>도구별 하나씩</b>입니다</small>',
 say:['“많이 쓸수록 좋다”를 먼저 솔직하게','“<b>근데 세 개여도 됩니다</b>”','“<b>[P2]</b>라고 부를게요 — 2·3회차에서 «지난 시간 그거»라고 부를 거예요”','“오늘 드리는 명령어는 <b>도구별로 하나씩</b>이에요. 나머지 둘은 이따”'],
 note:'★[P2]는 <b>3회차 “갱신 엔진”에서 회수</b>된다. 번호를 반드시 말할 것.<br>⚠️⚠️<b>2026-08-06 압축(논리 감사관).</b> 구버전은 숫자를 <b>다섯 개</b> 던졌다(하루 2~3개/주 20개/하루 1줄/3주 20개/스무 개면 일요일). 게다가 ★공통 규칙이 하필 <b>최대치</b>라 “안 해도 된다”는 저부담 설계와 어긋났다.<br>★이 숫자는 <b>뒤에서 세 번 더 하향된다</b>(실패 시연 “세 개” · 숙제 “세 줄” · 마무리 “3개면 충분”). <b>여기서 “세 개여도 된다”를 먼저 말해두면 뒤의 세 번이 반복이 아니라 회수로 들린다.</b><br>★<b>2026-08-18 문구 손질</b> — 같은 sub 안에서 「세 개」가 메모 개수와 명령어 개수 두 뜻으로 겹쳤고, #158에는 명령어가 네 줄(P1·P2·P8·P7) 떠 있어 숫자가 어긋난다. 명령어 쪽 표현을 「도구별 하나씩」으로 바꿔 숫자 충돌과 중의성을 동시에 없앤다.'},

e-linejoin="round"/><circle cx="865" cy="46" r="28" fill="#fff" stroke="var(--ac)" stroke-width="3.5"/><text x="865" y="58" text-anchor="middle" font-size="28" font-weight="800" fill="var(--ac)">④</text><text x="865" y="134" text-anchor="middle" font-size="25" font-weight="800" fill="var(--ink)">보내기</text><text x="865" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="var(--mut)">몇 초만 기다립니다</text><path d="M971 46 H999 M987 34 L1001 46 L987 58" fill="none" stroke="var(--ln2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1110" cy="46" r="28" fill="var(--ac)" stroke="var(--ac)" stroke-width="3.5"/><text x="1110" y="58" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">⑤</text><text x="1110" y="118" text-anchor="middle" font-size="25" font-weight="800" fill="var(--ink)">결과를 따로</text><text x="1110" y="150" text-anchor="middle" font-size="25" font-weight="800" fill="var(--ink)">저장</text><text x="1110" y="188" text-anchor="middle" font-size="19" font-weight="700" fill="var(--mut)">메모와 다른 곳에</text></svg>',

 sub:'<b>정리해서 넣을 필요 없습니다</b> — 날짜·순서·오탈자 다 <em>상관없습니다</em><br><small>⑤를 빠뜨리기 쉽습니다 — 결과를 따로 안 두면 <b>다음 달 비교가 안 됩니다</b></small>',
 say:['손가락으로 <b>하나씩</b>','“<b>프롬프트가 먼저</b>, 메모가 나중이에요”','“<b>정리해서 넣을 필요 전혀 없어요</b>”','“⑤ — <b>결과는 따로.</b> 섞이면 다음에 <b>결과까지 같이</b> 들어가요”','착지 — “<b>메모만 넣어도 돼요.</b> 근데 넣기 전에 <b>«그때 어디였는지»</b> 한 줄만 더 붙이면 훨씬 잘 나와요”','⛔<b>“적을 때 더 쓰라”로 들리게 하지 말 것</b> — 15초 규칙이 무너진다. <b>넣기 직전</b>의 선택이다'],
 note:'★★<b>2026-08-10 「추가 기입」을 부담 없이 넣는 법(강사 문의).</b> 상황·장소를 더 적으면 결과가 좋아지는데, <b>「적을 때 더 쓰라」고 하면 15초 규칙이 무너진다.</b> → <b>시점을 옮긴다</b> — 적는 건 <b>한 줄 그대로</b>, 더 쓰는 건 <b>AI에 넣기 직전의 선택</b>. 그러면 <b>매일의 부담이 0</b>이고 결과만 좋아진다.<br>⛔<b>“하세요”로 말하지 말 것.</b> <b>“해도 되고 안 해도 되는데, 하면 더 잘 나온다”</b>까지만.<br>★<b>2026-08-10 흐름도화 + 착지 교정(강사 지적).</b> 구착지 <i>“⑤가 진짜입니다”</i>는 <b>«나머지 넷은 가짜냐»로 읽힌다</b> → <b>“⑤를 빠뜨리기 쉽습니다”</b>라는 <b>사실</b>로 바꿨다. 그리고 다섯 단계를 <b>화살표 흐름</b>으로 세웠다.<br>★<b>이 장의 핵심 메시지는 하나 — “형식 안 맞춰도 된다.”</b> 정리해야 한다고 느끼는 순간 안 한다.<br>★<b>2026-08-09 순서 교정.</b> <b>클립보드는 한 번에 하나만 담긴다</b> — 프롬프트를 나중에 복사하면 메모가 밀려나 <b>붙일 것이 없다.</b> <b>프롬프트가 먼저, 메모가 나중.</b><br>★<b>2026-08-06 신설.</b> 구버전은 “통째로 던지세요”라고만 하고 <b>실제로 어떻게 넣는지가 없었다</b> — 학생이 집에서 막히는 지점이 정확히 여기다.<br>★<b>2026-08-18</b> — sub 나열형 문장("날짜 없어도, 순서 뒤죽박죽이어도, 오탈자 있어도")을 키워드 나열("날짜·순서·오탈자 다 상관없습니다")로 압축.'},

 sub:'②는 ①의 <b>상위 버전이 아닙니다</b> — 메모가 많아지면 <em>복사·붙여넣기가 번거로워져서</em> 그렇게 바뀔 뿐입니다',
 say:['“오늘 배우는 건 <b>왼쪽</b>이에요”','“<b>준비물 없고 무료</b>예요. 오늘 밤에 바로 됩니다”','오른쪽 — “메모가 <b>수백 줄</b>이 되면 복사가 번거로워져요. 그때 <b>파일을 그대로 올리는</b> 거고요”','“<b>3주 동안은 왼쪽만</b> 하시면 됩니다”'],
 note:'★★<b>2026-08-10 전면 교체(강사 지적 — “파일을 통째로 물리기가 뭔말이냐 · 쌓인 다음도 모호”).</b><br>①<b>「물리기」는 강사 은어</b>다 → <b>“파일을 그대로 올리기”</b>. ②<b>「쌓인 다음」은 언제인지 없다</b> → <b>“메모가 수백 줄이 된 뒤”</b>.<br>→ 두 방법을 <b>언제 · 어떻게 · 준비물</b> 세 줄로 나란히 비교한다. <b>같은 잣대로 재야</b> 차이가 보인다.<br>★<b>2026-08-09 신설.</b> 강사는 파일째, <b>학생은 대부분 붙여넣기</b>를 쓴다 — 하나뿐인 것처럼 말하면 <b>강사 화면과 학생 화면이 달라 보인다.</b><br>⛔<b>제품으로 나누지 말 것 — 방식으로만.</b> 화면·발화 어디에도 제품명을 넣지 않는다.<br>⚠️<b>“오른쪽이 더 좋다”로 들리게 하지 말 것.</b> 저동기 청중에게 상위 버전을 보여주면 <b>왼쪽이 임시방편처럼 느껴져 시작을 미룬다.</b> <b>순서의 문제이지 우열이 아니다.</b>'},
{sec:'도구 ① · 묶기',t:'dots',h:'왜 <em>모아야</em> 하는가',
 sub:'<div class="trio"><div><i>점 → 선</i><b>한 번은 그날 기분</b><span>열 번 겹치면 — 그날 기분이 아닙니다</span></div><div><i>그래서 AI가</i><b>본인은 그 겹침을 못 봅니다</b><span>매일 자기를 보기 때문입니다</span></div><div><i>그래서 몸으로</i><b>몸이 한 일을 적어야 겹칩니다</b><span>“막막했다” 스무 개는 — 전부 “막막했다”입니다</span></div></div>',
 land:'그래서 <b>모읍니다</b> — 하나로는 아무것도 아니고, <em>겹쳐야 보입니다</em>',
 say:['“<b>점 스무 개면 선이 보여요</b>”','“한 번은 그날 기분일 수 있는데 — <b>열 번 겹치면 아니죠</b>”','“근데 <b>본인은 그걸 못 봐요.</b> 매일 자기를 보니까요”','“그래서 <b>AI가 대신 봐 주는 거예요</b>”'],
 note:'★<b>2026-08-10 문구 통일(강사 문의).</b> <i>“몸으로 적어야”</i>는 문자 그대로면 뜻이 이상하다 → <b>“몸이 한 일을 적어야”</b>. <b>80번(“몸이 한 일만 적으면”)과 같은 말</b>이라 79~81 CCTV 규율이 저절로 회수된다.<br>⛔<b>여기에 「CCTV」라는 단어를 넣지 말 것</b>(2026-08-10 검토) — ①이 장의 주제는 <b>“왜 모으나”</b>이지 “어떻게 적나”가 아니다 ②이미 <b>「자(척도)」 비유</b>가 도식에 있어 한 장에 비유가 셋이 된다(§14가 잡는다) ③<b>“몸이 한 일”이라는 말 자체가 CCTV 규율의 결과물</b>이라 단어 없이도 이어진다.<br>★<b>2026-08-10 세 칸 구조화(강사 지적 — “말이 줄줄 달려서 한눈에 안 들어온다”).</b> 세 문장이 각각 <b>위 도식의 다른 단계</b>를 설명하고 있었는데 <b>한 덩어리로 흘러</b> 연결이 안 보였다 → <b>칸 위 라벨(점→선 · 그래서 AI가 · 그래서 몸으로)</b>로 도식과 짝을 지었다.<br>★<b>2026-08-10 88번 흡수(강사 지적 — “없어져도 되지 않냐”).</b> 구 88번(<i>“막막했다 20개 = 전부 막막했다”</i>)은 <b>이 장의 근거 한 줄</b>이었다 — 별도 장으로 세울 무게가 아니다. <b>한 줄로 흡수하고 장은 삭제.</b><br>★<b>2026-08-10 문장 교정(강사 지적 — 막연하다).</b> <i>“몸의 반응은 왜곡되지 않음”</i>·<i>“거리가 너무 가깝다”</i>는 <b>설계자 요약</b>이지 청중이 이해할 문장이 아니었다 → <b>“한 번은 그날 기분일 수 있는데 열 번 겹치면 아니다”</b>, <b>“매일 자기를 보니까 차이가 안 보인다”</b>로 풀었다.<br>★이 블록이 CT 메모의 <b>존재 이유</b>. 절대 생략 금지.<br>⛔⛔<b>2026-08-10 복원.</b> 이 장이 앞 장과 <b>같은 줄에 붙어 있어</b> 범위 치환에 통째로 먹혔다 — CLAUDE.md 「반복된 실수」에 적힌 바로 그 사고다. <b>범위를 자를 땐 두 앵커 사이에 몇 장이 있는지 먼저 센다.</b><br>★<b>2026-08-18 문장 손질</b> — 가운데 칸 끝줄만 <i>“매일 자기를 <b>보니까요</b>”</i>로 구어였고, 좌우 두 칸(<i>“…아닙니다” · “…입니다”</i>)과 <b>어미가 어긋나 셋이 한 줄로 안 읽혔다</b> → <b>“매일 자기를 보기 때문입니다”</b>. 08-10 강사 교정이 요구한 뜻(<i>“매일 자기를 보니까 차이가 안 보인다”</i>)은 그대로다. say는 강사 발화라 유지.'},
{sec:'도구 ① · 묶기',t:'steps',h:'묶어서 — <em>AI가 이름을 붙입니다</em>',
 items:[
  ['1','겉모습이 다른 세 장면','게임할 때 · 조별과제 마감 전날 · 여행 일정 짜던 밤'],
  ['2','몸의 반응은 같았다','<b>세 번 다 시간 가는 줄 몰랐다</b>'],
  ['3','AI가 이름을 붙인다','세 장면의 공통점 = <b>“없던 걸 처음부터 짤 때”</b><br><span style="color:var(--body);font-size:29px">→ <b>진로 = 「어디로 갈지」, 취업 = 「어디를 볼지」</b>의 기준</span>']],
 sub:'<em>묶음 = 다른 장면을 하나의 이름으로</em><br><b>그 이름이 곧 「방향」</b> — <em>내가 무엇을 할 때 살아나는지</em><br>이름이 있어야 — <b>진로를 좁히고, 회사를 잴 기준</b>이 됩니다',
 say:['<b>세 장면 → 같은 반응 → 이름</b> 순서로','“<b>이름이 붙어야 쓸 수 있다</b>”'],
 note:'⚠️<b>2026-08-05 교정.</b> 구버전은 *“이것이 묶음, 곧 나의 분류 기준”*으로 끝나서 <b>묶음이 뭔지 알 수 없었다.</b> → <b>이름을 붙이는 단계</b>를 명시적으로 3단계로 분해.<br>★★<b>2026-08-10 교정(강사 지적).</b> ①<b>누가 하는지가 없었다</b> — 앞 장이 “본인은 못 보니 AI가 대신 본다”로 끝나는데 이 장 제목이 <i>“묶고, 이름을 붙인다”</i>라 <b>학생이 직접 하는 일처럼</b> 읽혔다 → <b>“AI가 이름을 붙입니다”</b>.<br>②<b>이름이 다음 장과 달랐다</b> — 여기선 <i>“판을 짜고 있을 때”</i>인데 <b>다음 장 검색어는 “없던 걸 급히 시작할 때 몰입한다”</b>였다. <b>같은 이름이어야 «이게 그거구나»가 성립</b>한다 → <b>“없던 걸 처음부터 짤 때”</b>로 통일.<br>⛔<b>이 이름을 다음 장 검색어와 어긋나게 두지 말 것.</b><br>★<b>“없던 걸 처음부터 짤 때”는 예시다.</b> 강사 본인 것으로 바꿔도 되고, 학생 채팅에서 나온 것으로 즉석 대체해도 된다.<br>★<b>2026-08-18</b> — items③ 두 화살표("이 이름 하나가 내 분류 기준이 된다"+"진로/취업")를 한 줄로 병합(중복 제거). sub 정의문 「묶음이란 = ~」을 등호 키워드로 압축, 뜻은 그대로.'},

 land:'<b>진로</b>는 그 검색어를 <em>갖는 것</em>이고 · <b>취업</b>은 그걸로 <em>찾아보는 것</em>입니다',
 sub:'같은 지도 앱입니다 — 위는 <b>맛집</b>, 아래는 <b>나</b>. 달라진 건 <em>넣은 말 하나</em>뿐입니다',
 say:['위 두 칸을 <b>손으로 짚으며</b> — “<b>이거, 아까 했던 거예요</b>” <i>(⛔“기억나시죠”로 묻지 말 것 — 20장 전이라 아무도 기억 못 한다. 화면을 짚어서 보여준다)</i>','아래로 내려오며 — “<b>지금 만든 게 이거예요</b>”','“<b>“나 뭐 하고 싶지”로는 안 나와요</b>”','“차이가 뭐냐면요” → <b>3초 침묵</b> → “<b>넣은 말 하나</b>”'],
 note:'★★<b>2026-08-10 회수 방식 교정(강사 지적 — “기억나시죠로 뭉개지 말 것”).</b> 말로 <i>“아까 그 검색창 기억나시죠”</i>라고 하면 <b>기억나는 사람만 따라온다</b> → <b>71번의 검색창을 위에 흐리게 다시 그리고</b>, 그 아래 <b>같은 모양으로 「나」 검색어</b>를 놓았다. <b>보면 바로 이어진다.</b><br>⛔<b>아래 오른쪽 문구를 88번 이름과 어긋나게 두지 말 것</b> — 88이 붙인 이름이 그대로 여기 검색어가 된다.<br>★★<b>놀라움 ④ — 검색어.</b> <b>반드시 한 박자 세울 것:</b> “차이가 뭐냐면요” → <b>3초 침묵</b> → 그다음 말한다.<br>★2회차가 이걸 한 단계 더 좁힌다(직무 이름) — 부정이 아니라 확장으로.'},
{sec:'도구 ① · 묶기',t:'steps',h:'그래서 이걸로 <em>무엇을 하는가</em>',items:[
  ['질문','AI에 그대로 묻는다','“<b>이런 사람이 갈 만한 방향과 직무를 열 개만 뽑아주고, 각각 왜 맞는지 한 줄로</b>”'],
  ['결과','<b>방향</b>이 후보 목록으로 나온다','신사업 기획 · 초기 스타트업 · 신규 브랜드 론칭 …'],
  ['핵심','물어본 말이 다르면 — 결과가 다릅니다','<b>“나 뭐 하고 싶지?”로 물었다면 나오지 않는다</b> — 차이는 <b>넣은 문장 하나</b>']],
 sub:'<div class="axpair"><div><span class="axl">진로</span><span class="axt">이 목록에서 <b>어느 쪽으로 좁힐지</b></span></div><div><span class="axl">취업</span><span class="axt">이 목록에서 <b>어디에 지원할지</b></span></div></div>',
 land:'<b>검색어가 있으면 답이 나오고 — 없으면 안 나옵니다</b>',
 say:['질문 문장을 <b>그대로</b> 읽어준다','결과는 <b>2~3개만</b> 읽고 넘긴다','“<b>같은 AI인데요</b>”에서 한 박자'],
 note:'★<b>2026-08-06 신설(강사 지적).</b> 구버전은 “AI한테 물어볼 수도 있고요” 한 줄로 끝나서 <b>놀라움④가 “그렇구나”로 끝났고 집에서 재현이 안 됐다.</b><br>⚠️⚠️<b>여기서 답을 길게 열지 말 것.</b> 직무 상세는 <b>74~80분 [P1] 시연</b>이 학생 실물로 한다. <b>3개 넘게 읽으면 그 시연이 죽는다.</b><br>★<b>2026-08-10 진로 축 보강(강사 지적).</b> 질문 문장이 <i>“맞는 직무를”</i>이라 <b>취업 전용</b>이었고, 진로/취업 대구는 <b>작은 &lt;small&gt;로 결과 칸에 눌려</b> 있었다 → 질문을 <b>“갈 만한 방향과 직무”</b>로, 대구는 <b>본문 두 줄</b>로 올렸다.<br>★이 장의 값은 목록이 아니라 <b>마지막 줄</b>이다 — “같은 AI인데 차이는 넣은 문장 하나.” 놀라움④를 <b>증명으로</b> 닫는다.<br>★<b>2026-08-18</b> — items③ 라벨을 「같은 AI, 다른 결과」에서 「물어본 말이 다르면 — 결과가 다릅니다」로 바꿨다. 「같은 AI인데」 도입이 73·110·146 세 곳에서 반복되며 결론(기록·문장·재료)만 달라 회수 시 층이 안 갈렸다 — 「같은 AI」 도입구는 146 하나에만 남기고 이 장은 「물어본 말」 층으로 이름을 바꾼다.'},
{sec:'도구 ① · 묶기',kick:'아까 <b>“잴 자가 없으면 못 잰다”</b> — 그 <b>자</b>가 방금 생겼습니다',

 note:'★<b>2026-08-10 재배치(강사 지적).</b> 진로·취업 두 축이 <b>작은 대구 상자</b>에 눌려 있고 근거 문장은 <b>맨 아래 착지</b>에 있어 <b>무슨 말인지 바로 안 들어왔다</b> → <b>좌(진로·취업) → 우(어떻게 재나)</b> + <b>아래 근거 띠</b>로 갈랐다. 박스·글자도 키웠다.<br>국가데이터처 2026-07-23. 뒤 벤다이어그램에서 재사용 = 회수.<br>★<b>2026-08-18 글자 축약</b> — kick 어미("고 했습니다"·"그 자가") 정리, 허리 콜백은 유지.<br>★<b>2026-08-18 문장 손질</b> — kick <i>“아까 <b>허리에서</b> — “잴 자가 없으면 못 잰다” — 방금 생겼습니다”</i>에 문제가 둘이었다. ⓐ<b>「허리」는 설계자 용어</b>다(화면에 그 이름이 뜬 적이 없다 — 표현규율 제9조 ⛔메타 언어) ⓑ<b>「생겼습니다」의 주어가 없어</b> 줄표 셋을 건너뛰며 읽어야 했다 → <b>“아까 「잴 자가 없으면 못 잰다」 — 그 「자」가 방금 생겼습니다”</b>. <b>이음매 「아까」와 72번 콜백은 그대로</b>, 길이도 거의 같아 08-18 축약분을 되돌리지 않는다.'},
{sec:'라이브 시연 ①',t:'gate',gnum:'세션 3 · 파트 3',gt:'<em>CT 메모</em> — 나 화살표 만들기',gs:'던져주신 한 줄을 <b>그 자리에서</b> 바꿔봅니다',
 say:['<b>말없이 2초</b> — 파트가 바뀐 걸 보여준다'],
 note:'★<b>2026-08-10 파트 번호 재부여(강사 지적 — “파트 3·4·6·7을 본 적이 없다”).</b> 도구 대문이 <i>“도구 — 첫 번째”</i>처럼 <b>파트 번호를 안 써서</b> 화면엔 <b>1 · 2 · 5 · 8 · 9 · 10 · 11</b>만 떴다 — 빠진 번호를 청중은 <b>“내가 놓쳤나”</b>로 읽는다. → <b>대문이 실제로 뜨는 순서</b>로 1~10을 다시 매기고, 도구 대문은 <b>“파트 3 · 도구 첫 번째”</b>처럼 둘 다 적는다.<br>⛔<b>대문을 새로 만들거나 지우면 뒤 번호가 전부 밀린다</b> — 반드시 전체를 다시 세어라.<br>★<b>2026-08-10 파트 대문 신설(강사 지적).</b> 구버전은 <b>도구 ①②③에만</b> 대문이 있어 나머지 파트는 전환 신호가 없었다 — <i>“없으면 헷갈린다”</i>.<br>⏱ <b>2초.</b> 읽어주지 말 것 — <b>넘어왔다는 표시</b>다.'},

{sec:'라이브 시연 ①',kick:'먼저 — <b>흔한 형태부터</b>',t:'big',big:'아마 <em>이렇게</em> 적으셨을 겁니다',

 note:'⚠️<b>진행:</b> 채팅이 안 왔을 때 이 두 개로.<br>⚠️<b>2026-08-10 교정(제9조).</b> 이 진행 지시가 <b>화면(sub)에 떠 있었다</b> — 화면은 <b>청중이 읽을 말</b>만 둔다.<br>★<b>2026-08-10 제목 교정(전수 검토).</b> 구제목 <i>“준비 예시 — 백업”</i>의 <b>「백업」은 강사 진행 용어</b>다. 채팅이 안 왔을 때 쓰는 장이라는 건 <b>note·say에만</b> 둔다.<br>⬜⬜<b>2026-08-06 신설 — 자리표시자.</b> 대본이 “없으면 준비 예시 2·3번으로 진행”이라 지시하는데 <b>덱에 그 장이 없었다.</b> 채팅 0개일 때의 <b>생명줄</b>.<br>⬜<b>강사 실제 수집 문장으로 교체 권장</b> — 위 두 줄은 결만 맞춘 것이다.<br>⚠️날것 그대로 유지할 것. 여기서 잘 쓰면 “고쳐주는 시연”이 성립하지 않는다.'},

{sec:'라이브 시연 ①',t:'vs',h:'같은 하루를 — <em>관찰</em>로 바꾸면',left:{t:'입력 원문',v:'“진로 상담 갔다 왔는데 <b>더 답답했다</b>”'},
 right:{t:'관찰로 변환',v:'“상담실 나와서 <b>벤치에 10분 앉아 있었음</b> · 추천받은 직무 세 개를 검색창에 쳤다가 <b>전부 지움</b> · 집에 와서 <b>상담 메모를 다시 안 열었음</b>”'},

 say:['실시간으로 변환하는 걸 보여준다','“어디 계셨어요? 몸이 뭘 했어요?”'],note:'⛔<b>2026-08-09 교정(강사 지적).</b> 구버전 예시는 <b>「면접 불합격 문자」</b>였다 — 지금 실제로 떨어지고 있는 방에서 <b>잔인하고 반발감을 부른다.</b> 게다가 92·93·94가 <b>연속 세 장 전부 면접 실패</b>였다.<br>★<b>진로 예시로 교체했다.</b> ①진로 축이라 이 구간(CT 메모=진로 도구)과 결이 맞고 ②<b>감정어 → 몸의 관찰</b> 변환 시범이 그대로 성립하며 ③아프지만 <b>가해자가 없는</b> 장면이라 반발이 없다.<br>⚠️ 92번 수집 예시와 <b>같은 문장</b>이어야 한다 — 하나만 고치면 시연이 어긋난다.<br>★<b>학생이 못 쓰게 놔두고, 고쳐주는 걸 보여주는 게 설계다.</b> 답이 안 나와도 강사가 채워도 된다.'},

{sec:'라이브 시연 ①',t:'list',h:'AI가 <em>내놓은 것</em>',items:[
  ['1','<b>사실</b>과 <b>해석</b>의 분리'],
  ['2','반응이 가리키는 <b>관심 · 강점</b>'],

 note:'★<b>2026-08-10 제목 교정(전수 검토).</b> 구제목 <i>“변환본 처리 결과 — [P1]”</i>은 <b>「변환본」도 「[P1]」도 강사용 용어</b>다 — 청중 화면에 프롬프트 번호가 떠 있었다. ⚠️<b>[P1]~[P7]은 「제목」에 쓰지 않는다</b> — 장의 주제처럼 보인다. 다만 <b>배포 안내</b>로는 화면에 써도 된다(84번 “처리용 명령어 [P2] · 채팅방 공지 고정”) — 학생이 채팅방에서 그 번호를 본다.<br>⛔<b>자소서 문장은 절대 뽑지 말 것</b> — 3회차 payoff.<br>⚠️⚠️<b>2026-08-06 — 이 장은 미리 돌려둔 캡처다. 라이브 실행 안 함.</b> 응답 대기 10~30초 동안 집중력이 흩어지고, 와이파이·출력 편차 리스크가 겹친다.<br>★<b>그리고 그 사실을 밝힌다</b> — “<b>어제 미리 돌려본 거예요. 저도 확인은 하고 보여드려야죠.</b>” 숨기면 “짜고 친 거 아니야?”가 되지만 밝히면 <b>정직</b>이 되고, 이 강의가 가르치는 “딸깍하지 마라”의 <b>시범</b>이 된다.<br>★라이브의 재미는 <b>앞 장(강사가 그 자리에서 CCTV로 번역)</b>이 책임진다 — 거긴 AI가 없어서 대기가 0이다.'},

{sec:'라이브 시연 ①',t:'big',big:'이 문장의 이름 — <em>‘나 화살표’</em>',

 land:'<b>2회차 · 3회차에서 계속 사용</b> — 오늘 만드는 것 중 <em>수명이 가장 긴 산출물</em>',

 note:'★★2·3회차가 “나 화살표”를 <b>다섯 번</b> 부른다. 여기서 명명 안 하면 뒤가 전부 뜬다.<br>★<b>2026-08-09 보강(강사 지적).</b> 구버전은 <i>“내가 향하는 방향을 가리키는 문장”</i>만 말해 <b>검색어라는 정체가 빠져 있었다.</b> 90번에서 <i>“진로는 그 검색어를 갖는 것”</i>이라고 정의해놓고 <b>6장 뒤 이름 붙일 때 그 연결이 끊겼다.</b><br>★<b>이름은 「나 화살표」를 유지한다.</b> ①1·2·3회차 <b>67곳</b>에 박힌 이름이라 바꾸면 2·3회차 회수가 전부 흔들린다 ②「검색어」로 바꾸면 <b>방향(진로)이 죽는다</b> — 이 문장의 1차 정체는 방향이고, 검색어는 <b>그 방향을 써먹는 방법</b>이다.<br>★<b>대신 두 얼굴을 한 장에 붙였다</b> — 화살표(진로) + 검색어(취업). <b>이름 하나에 양축</b>이 걸린다.'},

{sec:'라이브 시연 ①',t:'big',big:'지금 본 것이<br><u>집에서 할 일의 전부</u>',

 note:'★★<b>2026-08-10 신설(강사 지적 — “그냥 불편에서 서비스들이 나왔다는 건 사회불만자 같다”).</b> 구버전은 <b>결과론</b>이었다(불평 → 대박 서비스) → 청중이 <i>“불평하면 돈 되나?”</i>로 읽는다.<br>★<b>진짜 이유는 감지 가능성이다.</b> ⓐ회사 안은 못 본다(이미 38번에서 확립: “안에 있어도 회사의 내일은 모른다”) ⓑ그런데 <b>결정의 결과는 이미 밖에 나와 있다</b> ⓒ그게 나를 스칠 때 <b>잘 맞으면 아무 느낌이 없고 안 맞으면 걸린다</b> → <b>걸리는 자리 = 결정이 드러난 자리.</b><br>★★<b>2026-08-11 착지 명확화(강사 지적 — “회사의 결정이 나한테 닿는 자리」가 모호하다”).</b> <i>“닿는다”</i>가 무슨 동작인지 화면에 없었다 → <b>경로를 그대로 적는다</b>: 불편 → 회사가 기획 → 제품 → 내가 쓴다. 그리고 <b>“거꾸로 올라간다”</b>를 여기서 심는다 — 다음 장(표)이 즉시 실습, <b>114(4축)</b>가 회수한다. 강의구조도의 <i>“완성된 결과물에서 결정을 거꾸로 추론”</i>과 같은 말이다.<br>★<b>불평과의 차이는 다음 장이 아니라 그다음 장이 만든다</b> — 「짜증나네」에서 멈추면 감정, 질문을 더하면 분석(109). 여기서는 <b>왜 이 신호를 고르는지</b>까지만.<br>⛔<b>“불편을 찾아다녀라”로 들리게 하지 말 것</b> — 겪은 것만 적는다.<br>⏱ 40초.<br>★<b>2026-08-18</b> — sub 필러("회사가"·"이미"·"우리는"·"시작해") 정리, 경로·뜻은 그대로.'},

 note:'⚠️폐기 발화: “국민신문고 빅데이터·VOC” — 전문 용어라 안 와닿는다.<br>★★<b>2026-08-11 칩 → 3열 표(강사 지시 — “제품 | 회사 | 해소한 불편”).</b> 칩은 <b>「제품 — 불편」 2항</b>이라 <i>“불편이 저절로 제품이 됐다”</i>로 읽혔다. <b>가운데 「만든 회사」 칸이 주체를 못 박는다</b> — 누군가 <b>없애기로 정한 것</b>이다. 그게 이 도구의 전제(106 「누군가 설계한 것 전부」)와 같은 말이다.<br>★<b>왼→오 = 지금 → 원래.</b> 앞 장이 심은 <b>「거꾸로 올라간다」를 여기서 즉시 실습</b>시킨다 — 표를 읽는 것 자체가 역설계 연습이다. 114(4축 제시)가 이 감각을 받는다.<br>★<b>회사명은 정확히 아는 것만</b> 넣었다 — 8개 중 넷플릭스(회사=제품 중복)·삼성페이·무선이어폰 일반명은 컷.<br>★<b>배달 앱은 뺀 상태 유지</b>(2026-08-10) — 116 예고가 앱 이름을 안 부른다. <b>토스·카카오톡</b>이 「공짜/싸게 쓰는 것들」로 116을 받쳐준다 — ⛔빼지 말 것.<br>⏱ 20초.<br>★<b>2026-08-18</b> — sub 「~로 읽으면 ~입니다」 서술형을 「A→B = 」 등식 키워드로 압축.'},
{sec:'라이브 시연 ②',kick:'방금 <b>나</b>를 찍었으니 — 이번엔 <b>회사</b>를 찍습니다',t:'big',big:'“햄버거집 갔다. 쿠폰 쓰니 <u>10%</u> 깎아주네?<br>근데 먹으려니 <u>입을 엄청 크게</u> 벌려야 하고 —<br>문득, <u>쟁반도 왜 내가</u> 치우지?”',
 sub:'누구는 <b>“푸짐하다”</b>고 볼 수도 있습니다 — 그런데 <em>저는 불편했습니다.</em> 그거면 재료입니다',

 note:'준비 예시 먼저. 20초.<br>★<b>2026-08-10 4차 교체 — 강사 제안(햄버거).</b> 사유는 다음 장 note.<br>★★<b>2026-08-11 ② 질문 교정(강사 지적 — “누가 이렇게 정했나는 질문이 잘못됐다”).</b> <b>「누가」는 사람을 찾는 질문</b>이라 <i>“그 직원이 불친절했다”</i> 쪽으로 샌다(CLAUDE.md ⛔사람은 대상이 아니다). 우리가 찾는 건 <b>판단</b>이다 → <b>「회사는 왜 이렇게 정했나」.</b> 주어가 회사로 못 박히고 「왜」가 계산을 묻는다.<br>⚠️<b>106의 「이건 누가 이렇게 정했지?」는 그대로 둔다</b> — 거긴 <b>대상 판별</b>(사람 손을 탄 것인가)이라 하는 일이 다르다. 두 질문을 통일하지 말 것.<br>★<b>②의 화살표 3단은 &lt;br&gt;로 줄을 못 박았다</b>(강사 — “줄바꿈 주의”). 자동 줄바꿈에 맡기면 화살표가 줄 끝에 매달려 계단이 안 보인다.<br>★★<b>2026-08-10 서사형으로(강사 지시).</b> 정제된 한 줄이 아니라 <b>「갔더니 → 샀더니 → 문득」</b>이라 <b>실제로 사람이 적는 흐름</b>이 된다. 학생이 “아 이 정도면 되는구나”를 여기서 배운다.<br>★★<b>세 개가 각자 다른 칸으로 간다.</b> 「쟁반」은 <b>①②의 입구</b>(셀프서비스), 「입 벌리기」와 「10% 쿠폰」은 <b>③④의 물음표</b>. 하나라도 빼면 111에서 물음표가 비어 보인다.<br>★★<b>“푸짐하다고 볼 수도 있다”를 일부러 넣었다.</b> 불편 메모는 <b>객관적 결함 찾기가 아니라 내 반응 찍기</b>다 — 도구①(몸이 반응한 순간)과 같은 원리다. 이 한 줄이 없으면 학생은 <i>“진짜 문제인 것만 적어야 하나”</i>로 손이 멈춘다.<br>★<b>찡찡을 강사가 먼저 인정한다</b> — 그래야 청중이 자기 짜증을 꺼낸다.<br>★<b>출처 배지 제거</b>(강사 — “없어 보인다”). 강사 1인칭 경험은 <b>발화로 충분</b>하고 배지를 달면 오히려 논문처럼 보인다.<br>★둘 다 일부러 <b>CCTV형(몸 동작)</b> — 도구①에서 배운 기록법 그대로라 다리가 된다.<br>⛔<b>“일부러 불편하게 만들었다” 단정 금지</b> — 이 각도는 2026-08-06에 이미 기각됐다(연구가 반대 방향).'},

 sub:'②가 핵심 — <em>“짜증나네”에서 멈추면 감정 · 한 번 더 물으면 분석</em>',
 say:['한 칸씩 열어 보인다','“<b>질문 하나 차이</b>예요”','★②는 <b>사람을 찾는 질문이 아니다</b> — “누가 나쁘냐”가 아니라 <b>“회사가 무슨 계산으로 이렇게 정했나”</b>','②에서 — “<b>돈 아끼려고 한 건데, 그게 이유가 돼버린 거예요</b>”','★<b>청중 경험으로 확인시킨다</b> — “거기서 공부해 보신 분? 카페였으면 눈치 보이죠”','⛔<b>“일부러 불편하게 만들었다” 금지</b> — <b>셀프는 인건비</b>가 이유다. 눈치 안 보임은 <b>따라온 결과</b>','⛔<b>특정 브랜드 이름 금지</b>'],
 note:'★★<b>2026-08-10 4차 교체 — 반품 → 햄버거(강사 제안 + 분석 보고서).</b><br>⚠️<b>보고서의 ④「불편=풍성함 착시」는 쓰지 않았다.</b> ⓐ근거로 든 Elder &amp; Krishna 2012(JCR)는 <b>광고 이미지의 제품 방향</b> 연구라 내용이 다르다(오귀속) ⓑ이 각도는 <b>2026-08-06에 이미 기각</b>됐다 — 연구가 반대를 가리키고(지저분하면 덜 먹는다), <b>“일부러 불편하게 만들었다”는 단정</b>이 필요해진다.<br>★<b>대신 보고서 ③「비대면 공간 사용권」으로 착지.</b> ⓐ<b>셀프서비스=인건비 절감</b>은 단정이 아니라 사실 ⓑ<b>“눈치 안 보인다”는 청중이 자기 경험으로 즉시 확인</b>한다 ⓒ<b>회사 비난 톤 0</b> — 기만이 아니라 <b>교환</b> ⓓ원가(인건비)에서 출발해 <b>상품 가치</b>로 닿는다 — 강사 스펙의 「원가 구조」 요건 충족.<br>★<b>80~84분의 「햄버거 10초」는 삭제</b>(같은 재료 두 번). 그 블록의 값(“제품도 대상이 된다”)은 이 시연이 직접 준다.<br><small>이력: </small>★<b>2026-08-10 예시 3차 교체 — 배달 → 팝콘 → 반품.</b> 배달은 교정하니 상식으로 주저앉았고(센 통찰은 전부 2회차 ④수익 유출), 팝콘은 <i>“알 사람은 다 안다”</i>(강사). 최종 스펙 — <b>①일상 불편 즉시 공감 ②20대가 구조로는 모름 ③알면 좋은 지식 ④시장의 원가 구조가 드러남.</b><br><b>반품 채택 근거:</b> ①20대 <b>주간 단위 경험</b>(온라인 옷 쇼핑) ②반품의 <b>역물류 원가</b>(왕복 택배·검수·재포장)를 구조로 아는 20대는 드물다 ③<b>「무료의 값」 렌즈</b>는 무료배송·무료체험·공짜 앱으로 확장 — 알면 좋은 지식 ④시장이 <b>지금 무료→유료로 움직이는 중</b>이라 배운 눈이 바로 검증된다 ⑤다음 장 예고(공짜 배달 앱 — 누가 내지?)와 직결.<br><b>티켓팅·전공책·1+1·병원 대기는 전부 리젝</b>(강사 — 원가 구조 요건 미달).<br>★★<b>⛔③은 검증 대상이 아니다.</b> ③은 <b>제안</b>이지 사실 주장이 아니다 — 실존 사례로 채우면 그 칸은 「나라면 어떻게」가 아니라 <b>「이미 있는 것 소개」</b>가 되고, 학생은 <i>“업계가 뭘 하는지 맞혀야 하나”</i>로 오해해 아무것도 못 쓴다(2026-08-10 강사 지적으로 되돌림). ③의 판정 기준은 <b>ⓐ②의 제약을 실제로 푸는가 ⓑ사실과 충돌하지 않는가 ⓒ이미 표준이라 김빠지지 않는가</b> 셋뿐.<br>★<b>채택 안:</b> ②의 핵심 문장(“모두의 옷값에 녹아 있던 것”)을 <b>정면으로 뒤집는다</b> — 그래서 ②③이 한 몸이 된다. <b>컷한 안:</b> 「반품 잦은 상품의 사이즈 정보를 고친다」(원인을 치는 답이라 좋지만 ②의 문장을 안 받는다).<br>★★<b>2026-08-10 ② 검증 완료(출처는 결정로그).</b> ②앞부분 — 반품 절차(검수→세척→재포장→재등록·훼손 시 폐기)·<b>역물류비=배송비의 2~3배</b>·반품 물류비=온라인 매출의 약 8%(물류신문·이뉴스투데이). ②뒷부분 — Zara £1.95·H&M £1.99(멤버는 무료)·2023 소매업체 <b>81%가 최소 한 유형의 반품에 과금 시작</b>(Happy Returns)·국내 에이블리 반품비 3,000~5,000원. ③ — 실측 후기 적립금은 <b>무신사가 실제로 운영</b>(사이즈 추천 후기·키/몸무게 필터) · 멤버십 무료 반품은 <b>H&M(멤버만 무료)·쿠팡 와우</b>가 실제 구조 — 강사가 “실제로 다 있는 답”이라고 말할 수 있다.<br>⚠️<b>「모두의 옷값에 녹아 있던 것」만은 구조 추론이다</b> — 개별 회사의 가격 전가는 확인 불가. 그래서 ⛔특정 몰 금지·⛔수치 금지가 이 장의 방어선이다.<br>⛔“떠넘긴다” 금지.<br>⏱ 3분.<br>★<b>2026-08-18</b> — kick 신설. 3칸이 「집에서 할 것」으로 오독될 여지가 있어, 이 장은 시연에서 한 번 끝까지 밀어보는 예임을 명시하고 132번(배포 정본 [P8])과 층을 가른다.<br>★<b>2026-08-18 글자 축약</b> — kick "한 번"·"보겠습니다" 정리.'},

{sec:'라이브 시연 ②',t:'big',big:'내가 그 집을 고르는 이유가 —<br><u>회사가 비용을 줄이려고 한 결정</u> 중 하나였습니다',
 sub:'직원을 줄였더니 → <b>아무도 나한테 말을 안 걸고</b> → 그게 <em>혼자 갈 때 거길 고르는 이유</em>가 됐습니다<br><em>어디서도 안 배운 얘기</em>입니다 — 면접에서 말하면 <b>지원자를 보는 눈이 달라집니다</b>',
 say:['화살표를 <b>손으로 세 번</b> 짚는다 — “줄였더니 · 말을 안 걸고 · 그래서 거길 간다”','“이거 어디서 배웠어요? <b>안 배웠어요</b>”','“면접에서 나오면 — ‘이 지원자 뭐지?’”','⛔<b>“그래서 싸다”로 말하지 말 것</b> — 햄버거는 양 대비 싸지 않다. <b>값 얘기는 다음 장 ③④의 것</b>'],
 note:'★★<b>2026-08-10 명확화(강사 지적 — “막연하다”).</b> 구버전 <i>“인건비를 아끼려고 한 일이 그 가게를 고르는 이유가 됐다”</i>는 <b>이유가 뭔지를 안 말한다</b> — 청중이 연결을 스스로 해야 했다. 게다가 big과 sub가 <b>같은 말을 두 번</b> 하고 있었다.<br>→ <b>앞 장 ②의 세 단계를 sub에 그대로</b> 놓았다(줄였더니 → 말을 안 걸고 → 거길 고른다). 그리고 big은 <b>그 셋을 잇는 반전 한 문장</b>만 맡는다.<br>★★<b>2026-08-11 「중 하나」 추가(강사 지적).</b> 셀프서비스는 <b>비용을 줄이려는 결정 여럿 중 하나</b>다 — 「그 결정이었다」로 단정하면 <b>이 회사의 비용 구조 전체를 읽은 것처럼</b> 들린다. 시연②는 <b>한 줄로 한 칸을 읽는 것</b>까지다.<br>★<b>주어를 「내」로 잡은 게 핵심</b> — “회사가 …했다”가 아니라 <b>“내가 그 집을 고르는 이유가”</b>로 시작해야 청중 몸에 닿는다.<br>★이 착지가 이 블록의 전부 — 그리고 <b>다음 장 예고의 열쇠</b>다(돈 낸 것 ≠ 산 것 → 공짜인 것에선 뭘 내고 있나).<br>★<b>“어디서 버는지”라고 말하지 말 것</b> — 예고의 ④축 문구 선점.<br>★★<b>⛔“기만이었다” 금지</b> — <b>교환</b>이 우리 각도다. 회사는 인건비를 아꼈고 우리는 눈치 안 보는 자리를 얻었다 — <b>둘 다 얻은 거래</b>.<br>★②는 <b>단정이 아니다</b> — 셀프가 인건비 때문인 건 사실, 「눈치 안 보임」은 <b>청중이 자기 경험으로 확인</b>한다. 그래서 방어가 필요 없다.'},

 land:'사례가 바뀌어도 — <b>질문은 바뀌지 않습니다.</b> 그래서 <em>처음 보는 회사도 같은 방식으로</em> 읽힙니다',
 sub:'아까 ①②③으로 물은 것이 — 이 중 <b>앞의 두 질문</b>입니다. 둘 다 <b>「쟁반」</b> 하나로 채웠습니다<br>남은 <b>「입 크게 벌리기」</b>와 <b>「10% 쿠폰」</b>은 — <em>뒤의 두 질문</em>입니다',
 say:['“방금 여러분이 한 게 — <b>이 네 개 중 두 개</b>였어요”','① ② 짚으며 — “<b>쟁반</b>에서 이 둘이 나왔죠”','★★<b>타깃은 「누구」가 아니라 「어떤 상황」이다</b> — “<b>혼자 온 사람</b>”은 <b>내 자리</b>고, 타깃은 <b>조용히 빨리 먹으려는 사람 전부</b>(연인·가족도 그 상황에 있다)','★<b>남은 두 불편을 여기서 되짚는다</b> — “근데 <b>입 크게 벌린 거</b>랑 <b>10% 쿠폰</b>은 아직 답 안 했죠?”','★③ 짚으며 — “<b>직원을 안 쓰면 그 돈이 남을 텐데</b> — 어디로 갔을까요”','★④ 짚으며 — “그리고 <b>왜 10%씩 깎아주면서까지</b> 앱을 깔게 할까요”','⛔⛔<b>③④의 답을 말하지 말 것</b> — 2회차 본체다. <b>질문만 던지고 물음표로 둔다</b>','⏱30초'],
 note:'★★<b>2026-08-10 신설(강사 지적 2건).</b> ⓐ<i>“입 크게 벌리는 건 또 어디 갔나? 109에서는 안 다루나?”</i> — <b>훅으로 던지고 회수를 안 했다.</b> ⓑ<i>“4가지 역설계 축을 제시만 하고 2회차에서 제대로 분석하는 게 낫지 않나”</i>.<br>★<b>두 지적이 한 장으로 풀린다.</b> ①②는 방금 3칸에서 <b>이미 답했고</b>(쟁반→셀프), ③④는 <b>물음표</b>로 남는다 → <b>「입 벌리기」를 버리지 않고 ③④의 질문으로 넘긴다.</b> 1회차에서 단정할 수 없던 것(2026-08-06 기각 각도)이 <b>갈증으로 전환</b>된다.<br>★<b>축 이름·질문은 「5_담당자용/강의구조도_1장」과 한 글자도 다르지 않게</b> 맞췄다 — 담당자에게 이미 나간 문서다. 고칠 땐 <b>두 곳을 같이</b>.<br>★착지 문장도 <b>강의구조도의 문장 그대로</b>다(“사례가 바뀌어도 질문은 바뀌지 않습니다”).<br>★<b>2회차가 이 장을 받는다</b> — 2회차 대본 <i>“오늘은 가운데 칸을 네 개로 쪼갭니다”</i>가 <b>이 화면을 가리킨다.</b> 이 장이 없으면 그 말이 허공에 뜬다.<br>★★<b>2026-08-11 ①타깃 교정(강사 — “혼자 온 사람 외가 되어야 하지 않나”).</b> <b>「혼자 온 사람」은 인구 구분이지 상황이 아니다.</b> 연인·가족도 <b>방해받지 않고 빨리 먹고 나가려고</b> 온다 → 타깃은 <b>그 상황에 있는 사람 전부</b>, <b>「혼자 온」은 그중 내가 속한 부류</b>. <b>2회차 ①타깃 규율</b>(<i>“20~30대 여성 ✗ · 어떤 상황에 놓인 사람 ✓”</i>)의 씨앗이다.<br>★★<b>2026-08-11 ②에 「얻은 것」이 없었다(강사 지적).</b> 질문이 <i>“뭘 얻으려고 뭘 포기했나”</i>인데 답은 <b>포기한 것만</b>(접객) 있었다 → <b>얻은 것=인건비 / 버린 것=직원이 해주던 것</b> 2행 구조로. ①도 같은 구조(<b>편해진 사람 / 나는</b>)라 <b>두 카드가 같은 모양</b>으로 읽힌다.<br>★<b>「접객」은 안 쓴다</b> — 일상어가 아니다(제9조) → <b>“직원이 해주던 것”</b>.<br>★★<b>2026-08-10 ③④에 구체적 질문을 심었다(강사 관찰).</b> 물음표만 있으면 <b>“그래서 뭐”</b>가 된다 → <b>“인건비를 줄였는데 값은 왜 안 내려갔나”</b>(③) · <b>“왜 쿠폰을 그렇게 뿌리나”</b>(④). 둘 다 <b>청중이 매일 겪는 것</b>이라 갈증이 즉시 선다.<br>★<b>2회차가 채울 답(강사 분석 — ⚠️출처 검증은 2회차 착수 때):</b> ③ 줄인 인건비가 <b>자사 앱</b>으로 갔다 · ④ <b>쿠폰으로 앱을 깔게 하고</b> 그 채널을 얻는다. <b>쿠폰 값은 쿠폰을 안 쓰는 사람이 같이 낸다</b> — <b>보험과 같은 구조</b>라 뿌려도 손해가 아니다.<br>★이 「모두가 나눠 낸다」 구조는 <b>폐기한 반품 예시의 뼈대와 같다</b> — 재료는 바뀌었는데 <b>구조는 남았다.</b> 그게 4축이 하는 일이다.<br>⛔<b>③④의 답 금지</b> · ⏱30초.<br>★<b>2026-08-18</b> — h를 「이 틀의 절반」(홀로 선 지시어)에서 「회사를 읽는 네 질문」으로 바꿔 1화에서 이름을 준다. 129의 3칸→이 장 4칸으로 숫자가 말없이 바뀌던 것도 sub 첫 줄(“아까 ①②③으로 물은 것이 앞의 두 질문”)로 다리를 놓았다. 축 이름(①②③④)·질문 문구·svg는 그대로 — 5_담당자용/강의구조도와 맞춰진 부분은 손대지 않았다.<br>★<b>2026-08-18 글자 축약</b> — kick 끝 "였습니다" 삭제.<br>★<b>2026-08-18 문장 손질</b> — sub 첫 줄이 <i>“…하나로 <b>채웠고요</b>”</i>로 구어였고 다음 줄과 접속이 겹쳤다 → <b>“채웠습니다”</b>로 끊었다. 뒤 줄(<i>“남은 「입 크게 벌리기」와 「10% 쿠폰」은 — 뒤의 두 질문입니다”</i>)이 새 문장으로 서서 <b>①②(답함) ↔ ③④(안 답함)</b> 대비가 선명해진다. 축 이름·질문 문구·도식은 <b>강의구조도와 맞춘 부분이라 손대지 않았다.</b>'},

 note:'★★<b>2026-08-11 신설(강사 제공 문안 · Claude→AI 치환).</b> 불편 메모는 <b>도구 셋 중 유일하게 프롬프트가 없었다</b> — 15초는 [P2], 답사는 [P7]인데 불편만 맨손이었다.<br>★<b>이 프롬프트가 푸는 진짜 문제는 「뭘 봐야 할지 모른다」</b>이다. 앞 장들이 <i>“대상은 누군가 설계한 것 전부”</i>라고 넓혀놨는데, <b>넓히면 오히려 못 고른다</b> — AI가 <b>동선 순서로 3~5곳</b>을 좁혀주는 게 값이다.<br>★★<b>착지가 이 장의 안전장치</b> — <i>“0개인 날도 정상”</i>이 없으면 학생이 <b>억지로 트집을 잡는다.</b> 그러면 ⛔사회불만자 프레임(108번이 걷어낸 것)이 되살아난다.<br>★<b>강사용 코드는 [P8]</b> — 화면에는 번호를 띄우지 않는다(151 명령어 표에서만 부른다).<br>★<b>위치</b> — 4축 제시(앞) 뒤, 파트 마무리(뒤) 앞. <b>“읽는 법을 봤으니 이제 나가서 모을 차례”</b> 자리다.<br>⏱ 40초.<br>★<b>2026-08-18</b> — land 첫 구절을 「집에서는 이 한 줄이면 됩니다」로 못 박았다. 이 장이 [P8]로 배포되는 정본이라 실제로 집에서 할 일이 이 한 줄이라는 걸 화면에 남긴다. 「0개인 날도 정상입니다」(착지 안전장치)는 그대로 남긴다.'},
