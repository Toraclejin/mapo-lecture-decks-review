{sec:'다음 회차 예고',t:'big',
 kick:'다음 회차 예고',
 big:'오늘은 <u>두 질문</u>에 답했습니다 —<br>다음 시간에 <u>나머지 둘</u>을 답합니다',
 sub:'<b>③ 그 아낀 돈은 어디로 갔나</b> · <b>④ 왜 쿠폰까지 주면서 부르나</b><br><br>그리고 하나 더 — 여러분이 <em>공짜로 쓰는 앱</em>은 <b>돈을 안 냈는데 어떻게 굴러갈까요</b><br><small>여러분이 <b>고객이 아닐 수도 있다</b>는 이야기입니다</small>',
 say:['앞 장 <b>물음표 두 개를 손으로 짚으며</b> 연다 — “이 둘이 다음 시간 거예요”','⛔<b>회사·앱 이름을 대지 말 것</b> — 대는 순간 2회차 ④수익의 답이 새어나간다','“<b>그건 다음 시간에</b>”로 닫는다 — ⛔답을 열지 말 것'],
 note:'★★<b>2026-08-06 · 구버전 2장(배달앱 진짜 고객 · 최소주문금액 재해석)을 이 1장으로 대체.</b><br><b>이관 사유 3가지:</b> ①1회차는 <b>재료 캐기</b>인데 회사 해부(4축 ④)를 3분간 미리 완주했다 ②2회차 「4축 본체」에서 <b>④수익만 예시 없이 추상적</b>이었다 — 원래 그쪽 재료다 ③배달앱은 결론까지 완주(58분), 논픽션은 관찰까지만(88분) — <b>정점 뒤 30분이 더 약한 구조</b>였다.<br>⚠️⚠️<b>여기서 답을 열지 말 것.</b> “식당이 진짜 고객”을 발화하는 순간 2회차 ④축이 죽는다. <b>이름만 건다.</b><br>★<b>정점은 88번(논픽션 통합)으로 이동.</b><br>★★<b>2026-08-10 사례 이름 제거(강사 — “배달앱도 꼴보기 싫다”).</b> 예고가 <b>사례를 부를 이유가 없다</b> — 앞 장 착지가 이미 <b>「무료」라고 쓰인 것에는 누군가 대신 낸 값이 있다</b>는 렌즈를 줬으니, 예고는 그 렌즈를 <b>질문으로 이어받으면</b> 훅이 선다.<br>★<b>오히려 다리가 단단해졌다</b> — 구버전은 «앱 이름»으로 걸었고 지금은 «앞 장의 질문»으로 건다. 다섯 장 앞 107 칩의 <b>카카오톡·토스</b>(공짜인 것들)가 받쳐준다.<br>⛔<b>회사 이름 금지</b> — 대는 순간 2회차 ④수익의 답이 샌다.<br>★<b>정점은 88번(논픽션 통합)으로 이동.</b><br>★<b>2026-08-18</b> — big의 「두 칸/나머지 두 칸」을 「두 질문/나머지 둘」로 바꿨다. 0.9분 뒤 135번이 「칸」을 다른 뜻(도구 셋 중 둘)으로 다시 쓰는데, 「칸」이 4축의 칸과 도구의 칸 두 뜻으로 정점 직전에 겹치면 청중이 무엇이 몇 개인지 잃는다. 「칸」은 모래시계 전용어로 남긴다.'},

/* ★각 장이 «어느 파트에 있는지»를 대문(gate)의 gnum으로 계산한다.
   헤더에 세션만 있으면 「지금 세션 1의 어디쯤인지」를 모른다(2026-08-10 강사 지적). */
const SECN=(()=>{ const m={}; SECTIONS.forEach(t=>(t.keys||[]).forEach(k=>m[k]=t.n||'')); return m; })();
const PARTOF=(()=>{ let cur=''; return S.map(x=>{
  const g=String(x.gnum||'');
  const m=g.match(/파트\s*\d+/);
  if(m) cur=m[0];                       /* 「세션 N · 파트 M」 → 그 파트 시작 */
  else if(/^세션\s*\d+\s*$/.test(g)) cur='';   /* 세션 대문 → 파트 초기화 */
  /* ★세션에 안 속한 칸(도입·휴식)에선 파트 배지를 끈다 — 2026-08-12. */
  if(!SECN[x.sec]) cur='';
  return cur; }); })();

function render(){
  const root=document.getElementById('slides');
  /* ★말머리 배지 — 배지가 «이미 원»인데 그 안에 원문자(①)를 넣으면 원 안에 원이 되어
     숫자가 뭉개진다(2026-08-18 브라우저 실측 — 화면에서 ◎로만 보였다).
     배지 안에는 숫자만 넣는다. sub가 「①②는 …」로 그 번호를 가리키는 장이 있어
     번호 자체를 지우면 안 된다 — 모양만 바꾼다. */
  const LM=x=>String(x).replace(/[①-⑨]/g,c=>String(c.charCodeAt(0)-0x245F));
  S.forEach((s,i)=>{
    let b='';
    switch(s.t){
      case 'title': b=s.html; break;
      /* 파트 마무리 — wn(배지) · wt(제목) · rows[[라벨,내용]] · wl(착지 한 줄). ⏱15초 */
      case 'wrap':
        b=`<div class="wrap"><div class="wh"><span class="wn">${s.wn}</span><span class="wt">${s.wt}</span></div>`
         +`<div class="wrows">`+s.rows.map(r=>
            `<div class="wr"><span class="wk">${r[0]}</span><span class="wv">${r[1]}</span></div>`).join('')
         +`</div>`+(s.wl?`<div class="wl">${s.wl}</div>`:'')+`</div>`; break;
      case 'creed':
        b=`<div class="creed"><div class="q">${s.q}</div></div>`+(s.sub?`<div class="sub">${s.sub}</div>`:''); break;
      case 'big':
        b=`<div class="big">${s.big}</div>`;
        if(s.cols3) b+='<div class="cols" style="margin-top:26px">'+s.cols3.map(c=>
            `<div><div class="ct">${c[0]}</div><div class="ci">${c[1]}</div></div>`).join('')+'</div>';
        if(s.vs2) b+=`<div class="vs" style="margin-top:24px">
            <div class="vx"><div class="vt">${s.vs2.left.t}</div><div class="vv">${s.vs2.left.v}</div></div>
            <div class="vo"><div class="vt">${s.vs2.right.t}</div><div class="vv">${s.vs2.right.v}</div></div></div>`;
        if(s.out) b+=`<div class="out good" style="margin-top:22px"><span class="tag">${s.out.tag}</span>${s.out.v}</div>`;
        if(s.sub) b+=`<div class="sub">${s.sub}</div>`;
        break;
      case 'nums':
        /* ★n[3] = **숫자 위 라벨** — 「무엇을 잰 숫자인가」를 먼저 보여준다.
           없으면 안 그리므로 기존 장은 그대로다. (2026-08-11 강사 지적: 숫자만 먼저 보면
           무엇의 숫자인지 모른 채 읽게 된다 — 맥락 → 숫자 → 답 순서가 맞다) */
        b=(s.h?`<h2 class="h">${s.h}</h2>`:'')+`<div class="nums ${s.plain?'plain':''}">`+s.items.map(n=>
            `<div>${n[3]?`<div class="c">${n[3]}</div>`:''}<div class="n">${n[0]}</div><div class="l">${n[1]}</div>`
            +(n[2]?`<div class="s">${n[2]}</div>`:'')+`</div>`).join('')+'</div>';
        if(s.sub) b+=`<div class="sub center">${s.sub}</div>`;
        break;
      /* ★가로 막대 — 크기 비교가 논지인 장. 단일 계열이라 색은 하나(범례 불필요, 제목이 계열명).
         rows:[[라벨, 값, 표시문자열, 보조설명?, 'hi'?]] · max 지정 가능 · unit */
      case 'bars':{
        const mx=s.max||Math.max(...s.rows.map(r=>r[1]));
        b=(s.h?`<h2 class="h">${s.h}</h2>`:'')+'<div class="bars">'+s.rows.map(r=>{
          const w=Math.max(0.35,(r[1]/mx)*100);      /* 0에 붙어도 존재는 보이게 최소폭 */
          /* ⚠️ 막대가 트랙을 꽉 채우면 옆에 둔 숫자가 **화면 밖으로 밀려 사라진다** —
             실제로 1위 줄(3만 명)이 안 보였다(2026-08-10 강사 지적). 넓으면 막대 «안»에 흰 글자로. */
          const inb = w>55;
          return `<div class="brow ${r[4]||''}"><div class="blab">${r[0]}</div>
            <div class="btrack"><div class="bfill" style="width:${w}%">${inb?`<span class="bin">${r[2]}</span>`:''}</div>
              ${inb?'':`<div class="bval">${r[2]}</div>`}</div>
            <div class="bsub">${r[3]||''}</div></div>`;}).join('')+'</div>';
        if(s.sub) b+=`<div class="sub">${s.sub}</div>`;
        break; }
      /* ★두 시점 대비(슬로프) — 같은 단위 두 계열의 「속도 차이」가 논지인 장.
         ⛔ 축을 둘로 쪼개지 않는다(이중축 금지). 같은 눈금 위에 놓아야 속도 차이가 보인다. */
      case 'slope':{
        const A=s.a, B=s.b, mx=s.max||Math.max(A.v[0],A.v[1],B.v[0],B.v[1])*1.15;
        const H=330, y=v=>H-(v/mx)*H;
        /* ⛔⛔ SVG 안에 <b>·<em>·<span>을 쓰면 **HTML 파서가 SVG를 그 자리에서 닫아버린다.**
           그 뒤 도형이 전부 글자로 튀어나온다 — 실제로 이 장의 **둘째 선이 통째로 사라지고**
           라벨이 그래프 밑에 한 줄로 쏟아졌다(2026-08-10 강사 지적). 반드시 tspan으로. */
        const esc=t=>String(t).replace(/<b>/g,'<tspan class="stx">').replace(/<\/b>/g,'</tspan>');
        /* 배수는 **막대 옆 배지**로 — 문장으로 적으면 눈이 그래프와 글을 왕복해야 한다 */
        /* ⚠️⚠️ SVG는 **글자 폭을 모른 채 좌표를 박아야 한다.** 값 뒤에 배지를 붙이면
           «26.1%»와 «5%»의 폭이 달라 **매번 어긋난다**(2026-08-10 강사 지적, 재발).
           → 값·배지·이름을 **전부 같은 x에서 왼쪽 정렬해 세로로 쌓는다.** 폭에 안 기대므로 안 어긋난다. */
        const LX = 662;
        const line=(o,cls)=>{const y0=y(o.v[0]),y1=y(o.v[1]);return `
          <line class="sl ${cls}" x1="150" y1="${y0}" x2="640" y2="${y1}"/>
          <circle class="sd ${cls}" cx="150" cy="${y0}" r="8"/><circle class="sd ${cls}" cx="640" cy="${y1}" r="8"/>
          <text class="st1" x="136" y="${y0+9}" text-anchor="end">${o.v[0]}%</text>
          <text class="st1" x="${LX}" y="${y1+9}">${o.v[1]}%</text>
          <rect class="bg ${cls}" x="${LX}" y="${y1+24}" width="104" height="42" rx="21"/>
          <text class="bt" x="${LX+52}" y="${y1+53}" text-anchor="middle">${esc(o.mult)}</text>
          <text class="st2" x="${LX+124}" y="${y1+54}">${esc(o.name)}</text>`;};
        b=(s.h?`<h2 class="h">${s.h}</h2>`:'')+
          `<div class="slope"><svg viewBox="0 0 1240 400" preserveAspectRatio="xMidYMid meet">
             <line class="ax" x1="150" y1="${H}" x2="640" y2="${H}"/>
             <text class="sx" x="150" y="${H+36}" text-anchor="middle">${s.x[0]}</text>
             <text class="sx" x="640" y="${H+36}" text-anchor="middle">${s.x[1]}</text>
             ${line(A,'a')}${line(B,'b')}</svg></div>`;
        if(s.sub) b+=`<div class="sub">${s.sub}</div>`;
        break; }
      /* ★도형 — 말로 여러 줄 설명할 것을 그림 한 장으로. svg 문자열을 그대로 받는다.
         ⚠️ 글자 크기는 뒷자리 기준(24px 이상). 색은 덱 변수만 쓴다. */
      case 'fig':
        b=(s.h?`<h2 class="h">${s.h}</h2>`:'')+`<div class="fig">${s.svg}</div>`;
        if(s.sub) b+=`<div class="sub">${s.sub}</div>`;
        break;
      case 'cols':
        b=(s.h?`<h2 class="h">${s.h}</h2>`:'')+'<div class="cols">'+s.items.map(c=>
            `<div class="${c.no?'no':''}"><div class="ct">${c.t}</div>`+c.l.map(x=>`<div class="ci">${x}</div>`).join('')+'</div>').join('')+'</div>';
        if(s.sub) b+=`<div class="sub">${s.sub}</div>`;
        break;
      case 'list':
        b=(s.h?`<h2 class="h">${s.h}</h2>`:'')+s.items.map(x=>
          `<div class="li"><div class="lm">${LM(x[0])}</div><div class="lc">${x[1]}</div></div>`).join('');
        if(s.sub) b+=`<div class="sub">${s.sub}</div>`;
        break;
      case 'chips':
        b=(s.h?`<h2 class="h">${s.h}</h2>`:'')+'<div class="spread">'+
          s.items.map(x=>`<span class="chip">${x}</span>`).join('')+'</div>';
        if(s.sub) b+=`<div class="sub">${s.sub}</div>`;
        break;
      case 'vs':
        b=(s.h?`<h2 class="h">${s.h}</h2>`:'')+
          `<div class="vs ${s.tone||''}"><div class="vx"><div class="vt">${s.left.t}</div><div class="vv">${s.left.v}</div></div>
           <div class="vo"><div class="vt">${s.right.t}</div><div class="vv">${s.right.v}</div></div></div>`;
        if(s.sub) b+=`<div class="sub">${s.sub}</div>`;
        break;
      /* ⚠️ 3번째 칸(x[2])은 **없을 수 있다.** 그냥 찍으면 화면에 «undefined»가 뜬다
         — 실제로 1회차 「손 한 번만 들어주세요」에 세 개가 떠 있었다(2026-08-10 발견). */
      case 'steps':
        b=(s.h?`<h2 class="h">${s.h}</h2>`:'')+s.items.map(x=>
          `<div class="step"><div class="sn">${x[0]}</div><div><div class="sq">${x[1]}</div>${x[2]?`<div class="sa">${x[2]}</div>`:''}</div></div>`).join('');
        /* ★out(예시 상자)은 **모든 타입 공통**이어야 한다 — 2026-08-11 steps에 없어서
           예시가 조용히 사라졌다(화면엔 아무 표시도 안 남는다). big·out2와 같은 모양으로. */
        if(s.out) b+=`<div class="out good" style="margin-top:18px"><span class="tag">${s.out.tag}</span>${s.out.v}</div>`;
        if(s.sub) b+=`<div class="sub">${s.sub}</div>`;
        break;
      case 'out2':
        b=`<h2 class="h">${s.h}</h2><div class="out"><span class="tag">3주치 메모 5줄</span>`+
          s.lines.map(l=>`· ${l}`).join('<br>')+`</div>
          <div class="out good" style="margin-top:13px"><span class="tag">${s.out.tag}</span>${s.out.v}</div>`;
        if(s.sub) b+=`<div class="sub">${s.sub}</div>`;
        break;
      case 'flood':
        /* 층 이름은 **표 바깥 왼쪽 여백**에 둔다 — 건물 옆에 붙은 층수처럼 보여야 구조가 읽힌다.
           오른쪽 칸은 상태 표시(아직 안전 / ▲물이 여기까지 / 이미 침수). 2026-08-10 강사 지시. */
/* ★제목은 왼쪽 정렬 — 다른 타입이 전부 왼쪽인데 여기만 가운데라 눈이 한 번 되돌아간다
   (2026-08-11 강사 지적). 표(.flood)는 max-width로 가운데 놓이지만 제목은 화면 기준 왼쪽이다. */
        b=`<h2 class="h">${s.h}</h2><div class="flood">`+s.rows.map(r=>
          `<div class="fn">${r[0]}</div><div class="flr ${r[3]||''}"><span class="ft2">${r[1]}</span>`
          +(r[2]?`<span class="fs">${r[2]}</span>`:'')+`</div>`).join('')+'</div>';
        if(s.sub) b+=`<div class="sub center">${s.sub}</div>`;
        break;
      case 'tl':
        b=`<h2 class="h">${s.h}</h2><div class="tl">`+s.items.map(x=>
          `<div class="${x[4]||''}"><div class="yr">${x[0]}</div><div class="dt"></div>
           <div class="bx"><div class="bt">${x[1]}</div><div class="bs2">${x[2]}</div></div></div>`).join('')+'</div>';
        if(s.sub) b+=`<div class="sub center">${s.sub}</div>`;
        break;
      case 'dots':
        b=`<h2 class="h center">${s.h}</h2><div class="dots">
          <div class="dcell s1"><div class="dt2">1 · 점</div><div class="dv"><span class="dot"></span></div><div class="dn">한 개는 의미 없음</div></div>
          <span class="darr">→</span>
          <div class="dcell s2"><div class="dt2">2 · 선</div><div class="dv"><span class="dline"></span></div><div class="dn">스무 개면 겹치는 것이 보임</div></div>
          <span class="darr">→</span>
          <div class="dcell s3"><div class="dt2">3 · 묶음</div><div class="dv"><span class="dbox"></span><span class="dbox"></span><span class="dbox"></span></div><div class="dn">이름을 붙일 수 있음</div></div>
          <span class="darr">→</span>
          <div class="dcell s4"><div class="dt2">4 · 자(척도)</div><div class="dv"><span class="ruler">│&nbsp;│&nbsp;│&nbsp;│</span></div><div class="dn">회사나 진로를 볼 때<br><b>“여기서 그 상황이<br>자주 생기나”</b>를 물을 수 있음</div></div>
        </div>`;
        if(s.sub) b+=`<div class="sub center">${s.sub}</div>`;
        break;
      case 'post':
        b=`<h2 class="h">${s.h}</h2><div class="post">`+s.rows.map(r=>
          `<div class="pl ${r[2]?'mk':''}"><span class="pk">${r[0]}</span><span class="pv">${r[1]}</span>`
          +(r[3]?`<span class="mrk">${r[3]}</span>`:'')+`</div>`).join('')+'</div>';
        if(s.sub) b+=`<div class="sub center">${s.sub}</div>`;
        break;
      case 'gate':
        /* ⚠️ row는 선택이다. 「번호 + 이름만」인 파트 대문(door page)도 이 타입을 쓴다 —
           row를 필수로 두면 도구 구간에만 대문을 달 수 있다(2026-08-10 강사 지적). */
        /* ★대문 번호는 **헤더 칩과 같은 배지**로 — 「세션 1 · 파트 1」을 그냥 글씨로 두면
           던져놓은 것처럼 보인다(2026-08-10 강사 지적). 「·」로 갈라 세션/파트 두 알약. */
        const _gn=String(s.gnum||'').split('·').map(x=>x.trim()).filter(Boolean);
        b=`<div class="gate"><div class="gnum">`+_gn.map((x,i)=>
             `<span class="${i?'gp':'gs2'}">${x}</span>`).join('')+`</div>`
          +`
             <div class="gt">${s.gt}</div>
             ${s.gs?`<div class="gs">${s.gs}</div>`:''}`
          +(s.row?`<div class="grow">`+s.row.map((x,i)=>
               `<div class="gi ${i===s.at?'on':(i<s.at?'done':'')}">
                  <div class="gk">${x[0]}</div><div class="gv">${x[1]}</div></div>`).join('')+
           `</div>`:'')+`</div>`;
        break;
      /* ⚠️ cap이 **핵심 문장**이다. 모래시계 아래 두면 눈이 그림에 먼저 가서 **못 읽고 지나간다**
         (2026-08-10 강사 지적). → 제목 자리처럼 **위**에 둔다. */
      case 'hg': b=(s.cap?`<div class="hgcap">${s.cap}</div>`:'')+hourglass(s.lit, s.hgbot); break;
      case 'venn':
        /* ★범례 각 줄에 **원 이름(나·회사·시장)**을 같이 적는다 — 이름이 있으면 «위치»에 안 기대고도
           짝이 보인다. 벤에 딱 붙여 놓으면 이름표처럼 보여 초라하다(2026-08-10 강사 지적 3회). */
        b=`<h2 class="h center">${s.h}</h2><div class="vennwrap"><div class="venn">
             <div class="vc a"><span class="vtx"><span class="vn">나</span><span class="vd">CT 메모</span></span></div>
             <div class="vc b"><span class="vtx"><span class="vn">회사</span><span class="vd">불편 메모</span></span></div>
             <div class="vc c${(s.dim||[]).includes('c')?' voff':''}"><span class="vtx"><span class="vn">${(s.dim||[]).includes('c')?'시장':'시장'}</span><span class="vd">${(s.dim||[]).includes('c')?'? — 다음 시간에 다룹니다':'답사 메모'}</span></span></div>
             ${s.core?`<div class="vcore">${s.core}</div>`:''}
           </div>
           <div class="vennside">
             <div class="vlegend">
               <span><i style="border-color:#2C3542;background:rgba(44,53,66,.10)"></i><b style="color:#2C3542">나</b>내가 몰입하는 조건</span>
               <span><i style="border-color:var(--ac);background:rgba(27,77,143,.12)"></i><b style="color:var(--ac)">회사</b>그 일이 어떤 문제를 푸는지</span>
               <span${(s.dim||[]).includes('c')?' class="voff"':''}><i style="border-color:#B8801F;background:rgba(184,128,31,.13)"></i><b style="color:#7A5410">시장</b>시장이 가는 방향${(s.dim||[]).includes('c')?' <b style="color:var(--mut)">— 다음 시간</b>':''}</span>
             </div>
             ${s.side?`<div class="vnote">${s.side}</div>`:''}
           </div></div>
           <div class="hgcap">${s.cap}</div>`; break;
      case 'dict':
        b=(s.h?`<h2 class="h">${s.h}</h2>`:'')+`<div class="dict">
             <div class="dl"><div class="dw">${s.word}</div><div class="dh">${s.hanja}</div></div>
             <div class="dr">`
          + s.defs.map((d,k)=>`<div class="di ${d[2]?'new':''}"><span class="dn2">${d[2]?'③':(k+1)}</span><span class="dt3">${d[1]}</span></div>`).join('')
          + (s.src?`<div class="src">${s.src}</div>`:'') + `</div></div>`;
        if(s.sub) b+=`<div class="sub">${s.sub}</div>`;
        break;
      case 'ref':
        b=(s.h?`<h2 class="h">${s.h}</h2>`:'')+`<div class="ref ${s.two?'two':''}">`+s.rows.map(r=>
          `<div class="rr"><div class="rk">${r[0]}${r[2]?`<small>${r[2]}</small>`:''}</div><div class="rv">${r[1]}</div></div>`).join('')+'</div>';
        if(s.sub) b+=`<div class="sub">${s.sub}</div>`;
        break;
      case 'agenda':
        b=`<div class="agtop"><h2 class="h" style="margin:0">${s.h}</h2><span class="cnt">${s.items.length}개 세션</span></div>
           <div class="ag">`+s.items.map((x,k)=>
          `<div class="ar"><div class="an">${String(k+1).padStart(2,'0')}</div><div class="at">${x[0]}</div>
           <div class="av"><div class="ah">${x[1]}</div><div class="ad">${x[2]}</div></div></div>`).join('')+'</div>';
        if(s.sub) b+=`<div class="sub">${s.sub}</div>`;
        break;
      case 'toc':{
        const half=Math.ceil(SECTIONS.length/2);
        const col=a=>a.map(x=>`<div class="trow"><div class="tn">${x.n}</div>
            <div><div class="tt">${x.name}</div><div class="td">${x.desc}</div></div>
            <div class="tm">${x.time}</div></div>`).join('');
        b=`<h2 class="h">${s.h}</h2><div class="toc"><div>${col(SECTIONS.slice(0,half))}</div><div>${col(SECTIONS.slice(half))}</div></div>`;
        break; }
    }
    /* ★출처 줄 — 수치가 나오는 장은 화면에 출처를 띄운다 (2026-08-08 강사 지시).
       ⚠️ 공공기관 강의다. 숫자를 근거 없이 띄우면 그 자리에서 신뢰가 깨진다.
       ⚠️ 발화로 읽지 말 것 — 화면에 있는 것으로 충분하다(대본 규율과 동일). */
    /* ★착지 줄 — 그 장이 남길 한 문장. 본문보다 크게, 맨 아래.
       ⚠️ 정보를 더 넣는 칸이 아니다. 청중이 그 장에서 하나만 가져간다면 이 문장이어야 한다. */
    /* ★이미지 자리 — 아직 안 들어온 사진·일러스트의 위치를 화면에 표시한다.
       실물이 오면 이 필드를 지우고 <img>로 바꾼다. 발표용에도 보이므로 리허설에서 눈에 띈다. */
    /* ★kick(다리 문구)은 **모든 타입 공통**이다 — 2026-08-10 이전엔 big 타입에서만 렌더돼
       ref·cols·steps 장에 단 kick이 화면에서 조용히 사라졌다(회사의 언어 복선이 그렇게 증발했다). */
    /* ★out(예시 상자)도 **모든 타입 공통**이다 — kick과 «똑같은 사고»가 두 번 더 났다.
       2026-08-11 steps · 2026-08-18 fig(83번 「진로 정의」가 화면에 없었다 — 대본과 note는
       둘 다 화면에 있다고 전제하고 있었다). 그때마다 그 «타입 하나»만 때웠던 게 원인이다.
       ⚠️타입 분기에서 이미 그린 장은 두 번 그리지 않는다. */
    if(s.out && !/class="out/.test(b))
      b+=`<div class="out good" style="margin-top:20px"><span class="tag">${s.out.tag}</span>${s.out.v}</div>`;
    if(s.kick) b=`<div class="kick">${s.kick}</div>`+b;
    /* ★실제 사진: img 경로가 있으면 띄우고, 로드 실패(파일 없음)면 자리표시자로 되돌린다 */
    if(s.img){
      b+=`<div class="deckimg"><img src="${s.img}" alt="" onerror="this.parentElement.style.display='none';var n=this.parentElement.nextElementSibling;if(n&&n.classList.contains('imgslot'))n.style.display='';">`
        +(s.imgcap?`<span class="cap">${s.imgcap}</span>`:'')+`</div>`;
      if(s.imgq) b+=`<div class="imgslot" style="display:none"><b>⬜ 이미지 자리</b><span>${s.imgq}</span></div>`;
    } else if(s.imgq) b+=`<div class="imgslot"><b>⬜ 이미지 자리</b><span>${s.imgq}</span></div>`;
    /* ★★핵심 문장(land)은 **제목 바로 아래**에 둔다 — 맨 밑에 두면 눈이 도식에서 멈춰
       «스쳐 보면 안 읽힌다»(2026-08-10 강사 지적). 두괄식이 제8조(payoff 선행)와도 맞다.
       ⚠️예외: 답을 미리 보이면 놀라움이 죽는 장은 `landAt:'bottom'`을 준다. */
    if(s.land){
      const _L=`<div class="land">${s.land}</div>`;
      let _done=false;
      if(s.landAt!=='bottom'){
        const _i=b.indexOf('</h2>');
        if(_i>=0){ b=b.slice(0,_i+5)+_L+b.slice(_i+5); _done=true; }
        else if(b.startsWith('<div class="big">')){
          const _j=b.indexOf('</div>');
          if(_j>=0){ b=b.slice(0,_j+6)+_L+b.slice(_j+6); _done=true; }
        }
      }
      if(!_done) b+=_L;
    }
    /* ★sub를 도식 «위»로 올리는 옵션 — 반론 대응처럼 **그림보다 먼저 읽어야 하는 글**이 있다
       (2026-08-10 강사 지적: 69번 “그럼 취업 준비부터가 효율 아닌가”). `subAt:'top'` */
    if(s.sub && s.subAt==='top'){
      const _S=`<div class="sub">${s.sub}</div>`;
      const _i=b.lastIndexOf(_S);
      if(_i>=0) b=b.slice(0,_i)+b.slice(_i+_S.length);
      const _li=b.indexOf('<div class="land">');
      const _at=_li>=0 ? b.indexOf('</div>',_li)+6
                       : (b.indexOf('</h2>')>=0 ? b.indexOf('</h2>')+5 : 0);
      b=b.slice(0,_at)+_S+b.slice(_at);
    }
    /* ⚠️dict은 **정의 옆에 이미 출처를 그린다** — 여기서 또 붙이면 한 화면에 출처가 두 번 뜬다
       (2026-08-10 9번에서 실제로 두 번 떠 있었다). */
    if(s.src && s.t!=='dict') b+=`<div class="srcline">${s.src}</div>`;
    const M=SECIDX[s.sec];
    /* 헤더 = 섹션 이름까지만. 시간은 발표자 뷰(note)에만 둔다 — 학생에게 진도 압박을 주지 않는다. */
    /* ★헤더 문법 (2026-08-07 재정리) — 조각 4개·줄표 3개짜리 한 줄이 중구난방이었다.
       이제 두 덩어리만 읽는다: [구간칩] │ 지금 하는 것.
       구간칩 = 고정(어느 큰 덩어리인지) · 오른쪽 = 장마다 바뀜(지금 뭘 하는지 = 크게).
       s.hl로 장 단위 덮어쓰기 (''를 주면 라벨 없음). */
    const sub=(s.hl!==undefined)?s.hl:(SUBLBL[s.sec]||'');
    const _pt=PARTOF[i];
    const chip=M?`<div class="pg${M.n?'':' solo'}">${M.n?`<span class="sn">${M.n}</span>`:''}${_pt?`<span class="sp">${_pt}</span>`:''}<span class="st">${M.short||M.name}</span></div>`
                :`<div class="pg solo"><span class="st">${s.sec||''}</span></div>`;
    const label=chip+(sub?`<span class="sbar"></span><span class="ss">${sub}</span>`:'');
    /* ★진행 레일 — 전체 구간 중 현재 위치를 막대로. “지금 어디쯤인지”가 매 장에 보인다. */
    const myIdx=M?SECTIONS.indexOf(M):-1;
    const rail='<div class="rail">'+SECTIONS.map((x,k)=>{
      /* 파트가 바뀌는 자리에 틈 — 레일만 봐도 «파트 경계»가 보인다 */
      const brk = k>0 && String(x.n||'')!==String(SECTIONS[k-1].n||'');
      const st = myIdx<0?'rest':(k<myIdx?'done':(k===myIdx?'now':'rest'));
      return `<i class="${st}${brk?' brk':''}" title="${x.n?x.n+' · ':''}${x.name}"></i>`;}).join('')+'</div>';
    /* ★모래시계 짝 — 도구 구간에서 “위 어느 칸에 대응하는지”를 상시 표시 */
    /* ⚠️ 세부 라벨이 이미 "① CT 메모 — 나를 찍는다"를 말하므로, 짝 표시는 짧게 위 칸만.
       둘 다 길게 두면 헤더가 두 줄로 밀린다(2026-08-07). */
    /* ⚠️ 짝 표시는 제목 줄에서 뺐다 — 제목 옆에 두면 읽을 조각이 셋이 된다.
       오른쪽 페이지번호 옆 배지로 보낸다(=참조 정보이지 제목이 아니다). */
    const pair=(M&&M.pair)
      ? `<span class="pair"><span class="plbl">짝</span><span class="pu">${M.pair[0].replace('위 3칸 전부','위 전부').split('—')[0].trim()}</span></span>` : '';
    /* ★진행 큐 — say[]를 화면 하단에 띄운다 (2026-08-08 강사 요구).
       ⚠️ 이유: 강사가 「슬라이드만 보고 바로 진행」할 수 있어야 한다. 발표자 뷰(S키)는 화면이
          둘일 때만 쓸 수 있는데, 현장은 대개 미러링이라 못 본다.
       ⚠️ 그래서 청중이 봐도 되는 형태(짧은 진행 순서)로만 쓴다 — 대본 문장을 그대로 넣지 말 것.
       C키로 끈다. 여백은 유지한다 — 여백은 청중이 강사 말을 듣게 하는 장치라 없애면 안 된다. */
    const cue=(s.say&&s.say.length)
      ? `<hr><b>진행 메모</b> · ` + s.say.map(x=>x.replace(/<\/?b>/g,'')).join(' → ') : '';
    const say=(s.say&&s.say.length)
      ? `<div class="cuebar"><span class="cl">진행</span>`
        + s.say.map((x,i)=>`<span class="ci"><i>${i+1}</i>${x}</span>`).join('')
        + `</div>` : '';
    const sec=document.createElement('section');
    sec.innerHTML=`<div class="fr">
        <div class="hd">
          <div class="hdtop"><div class="sec">${label}</div>
          <div class="hdr">${pair}<div class="pg"><b>${String(i+1).padStart(2,'0')}</b> / ${String(S.length).padStart(2,'0')}</div></div></div>
          ${rail}
        </div>
        <div class="bd"><div class="bdi">${b}</div></div>${say}</div>
      <aside class="notes">${M?`<b>⏱ ${M.time} · ${M.name}</b><br>`:''}${s.note||''}${cue}</aside>`;
    root.appendChild(sec);
  });
}
render();
Reveal.initialize({ width:1600, height:900, margin:0.02, minScale:.2, maxScale:1.6,
  hash:true, controls:true, progress:true, slideNumber:false, transition:'fade',
  transitionSpeed:'fast', jumpToSlide:true, plugins:[RevealNotes] });

/* ── ★좌측 내비게이터 ────────────────────────────────────── */
const navBody=document.getElementById('navBody'), navQ=document.getElementById('navQ');
document.getElementById('navCount').textContent=S.length+'장';

/* 슬라이드 제목 뽑기 — 타입마다 제목이 있는 필드가 다르다 */
function titleOf(x){
  const strip=t=>String(t||'').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
  if(x.t==='title') return '표지';
  if(x.t==='agenda') return strip(x.h);
  if(x.t==='creed') return '신조 — ' + strip(x.q).slice(0,22);
  if(x.t==='hg') return '모래시계 — ' + strip(x.cap).slice(0,26);
  if(x.h) return strip(x.h);
  if(x.big) return strip(x.big);
  if(x.cap) return strip(x.cap);
  return strip(x.sec);
}
let curSec=null, html='';
S.forEach((x,i)=>{
  const M=SECIDX[x.sec];
  if(M && M!==curSec){
    curSec=M;
    const cnt=S.filter(y=>SECIDX[y.sec]===M).length;
    html+=`<div class="sec" data-sec="1">${M.n?`<i>${M.n}</i>`:''}<b>${M.name}</b><em>${cnt}장</em></div>`;
  }
  html+=`<a data-i="${i}" data-q="${titleOf(x).toLowerCase()}">
           <span class="n">${String(i+1).padStart(2,'0')}</span>
           <span class="t">${titleOf(x)}</span></a>`;
});
navBody.innerHTML=html+'<div class="none" id="navNone" style="display:none">일치하는 슬라이드가 없습니다</div>';

navBody.addEventListener('click',e=>{
  const a=e.target.closest('a'); if(!a) return;
  Reveal.slide(+a.dataset.i,0);
});
function markNav(idx){
  navBody.querySelectorAll('a').forEach(a=>a.classList.toggle('on',+a.dataset.i===idx));
  const on=navBody.querySelector('a.on');
  if(on&&document.body.classList.contains('navopen')) on.scrollIntoView({block:'nearest'});
}
/* 검색 — 숫자면 바로 이동, 글자면 필터 */
navQ.addEventListener('keydown',e=>{
  e.stopPropagation();
  if(e.key==='Enter'){
    const n=parseInt(navQ.value.replace(/[^0-9]/g,''),10);
    if(n>=1&&n<=S.length){ Reveal.slide(n-1,0); navQ.value=''; filterNav(''); navQ.blur(); }
  }
  if(e.key==='Escape'){ navQ.value=''; filterNav(''); navQ.blur(); }
});
navQ.addEventListener('keypress',e=>e.stopPropagation());
navQ.addEventListener('input',()=>filterNav(navQ.value));
function filterNav(q){
  q=q.trim().toLowerCase(); let hit=0;
  navBody.querySelectorAll('a').forEach(a=>{
    const ok=!q||a.dataset.q.includes(q)||a.querySelector('.n').textContent.includes(q);
    a.classList.toggle('hidden',!ok); if(ok) hit++;
  });
  navBody.querySelectorAll('.sec').forEach(d=>{ d.style.display=q?'none':'flex'; });
  document.getElementById('navNone').style.display=hit?'none':'block';
}
function toggleNav(force){
  const open=force!==undefined?force:!document.body.classList.contains('navopen');
  document.body.classList.toggle('navopen',open);
  if(open){ setTimeout(()=>{ const on=navBody.querySelector('a.on');
    if(on) on.scrollIntoView({block:'center'}); },20); }
}
document.getElementById('navtab').addEventListener('click',()=>toggleNav());

/* ★목차를 열어둔 채 슬라이드를 클릭하면 자동으로 접는다 (2026-08-07).
   목차에서 장을 고른 뒤 화면을 한 번 누르면 바로 진행할 수 있어야 한다 —
   탭을 다시 찾아 누르게 하면 강의 중 손이 두 번 간다.
   ⚠️ 목차 내부(#nav)와 탭(#navtab) 클릭은 제외해야 한다. 안 그러면 목차에서 항목을 고르는 순간 닫힌다. */
document.addEventListener('click',e=>{
  if(!document.body.classList.contains('navopen')) return;
  if(e.target.closest('#nav')||e.target.closest('#navtab')) return;
  toggleNav(false);
},true);

/* ── ★★발표자 보기 (파워포인트 방식) ─────────────────────
   P키 → 강사용 창을 새로 연다. 두 창은 postMessage로 양방향 동기화.
   맥북 「디스플레이 → 미러링 끄기(확장)」 상태에서
     · 빔   = 이 창(발표용)을 전체화면으로
     · 맥북 = 새로 열린 강사용 창

   ★★안전 설계 (2026-08-08) — 강의 중 절대 죽으면 안 된다
   1. 모든 동기화 코드는 try/catch로 감싼다. 예외가 나도 **슬라이드 넘김은 반드시 살아 있다**
   2. 동기화는 「있으면 좋은 것」이다. 끊겨도 두 창을 각각 방향키로 넘기면 그대로 진행된다
   3. alert() 금지 — 강의 중 모달은 최악. 안내는 3초 토스트로만
   4. 모드 감지 실패에 대비해 부모가 자식에게 「coach로 전환」 신호를 보낸다(런타임 복구) */
/* ★슬라이드 동기화 — 양방향. 어느 창에서 넘겨도 반대쪽이 따라온다.
   ⚠️ 2026-08-08 재작성(강사 지적: "강사용에서만 넘어간다").
      구버전은 SYNCING 플래그 + 80ms 타이머를 썼는데, Reveal.slide가 한 번이라도
      예외를 던지면 플래그가 true로 굳어 **그 창은 영영 안 보내게** 됐다 → 한 방향만 되는 증상.
      이제는 「마지막으로 맞춘 번호(LAST)」만 비교한다 — 타이머도 플래그도 없어 스스로 회복한다. */
let PEER=null, LAST=-1;

function sendIdx(){
  try{
    const i=Reveal.getIndices().h;
    if(i===LAST) return;                    /* 방금 받아서 옮긴 자리면 되돌려 보내지 않는다 */
    LAST=i;
    if(PEER&&!PEER.closed) try{ PEER.postMessage({deck:1,i},'*'); }catch(e){}
    try{ if(window.opener&&!window.opener.closed) window.opener.postMessage({deck:1,i},'*'); }catch(e){}
    /* 2차 채널 — 두 파일을 따로 열었을 때도 맞춰준다(같은 브라우저 한정) */
    try{ localStorage.setItem('deckSync', i+'|'+Date.now()); }catch(e){}
  }catch(e){}                               /* ⚠️ 여기서 던지면 reveal 이벤트가 깨진다 — 반드시 삼킨다 */
}
function applyIdx(i){
  try{
    if(typeof i!=='number'||!isFinite(i)||i<0||i>=S.length) return;
    if(i===Reveal.getIndices().h) return;
    LAST=i;                                 /* 「받은 이동」으로 표시 → 메아리 차단 */
    Reveal.slide(i);
  }catch(e){}
}
window.addEventListener('storage',e=>{
  try{ if(e.key!=='deckSync'||!e.newValue) return;
    applyIdx(parseInt(String(e.newValue).split('|')[0],10));
  }catch(err){}
});
window.addEventListener('message',e=>{
  try{
    const d=e.data; if(!d||!d.deck) return;
    if(d.coach) enableCoach();              /* 모드 감지 실패 시 런타임 복구 */
    applyIdx(d.i);
  }catch(err){}
});
function openPresenter(){
  try{
    if(PEER&&!PEER.closed){ PEER.focus(); return; }
    PEER=window.open(location.pathname+'?mode=coach','deckCoach',
      'width=1280,height=860,menubar=no,toolbar=no,location=no');
    if(!PEER){ toast('팝업이 차단됐습니다 — 브라우저에서 이 페이지의 팝업을 허용해 주세요'); return; }
    document.body.classList.add('nocue');        /* 이 창은 빔으로 나간다 — 큐를 끈다 */
    toast('강사용 창을 열었습니다 — 「이 창」을 빔으로 옮기고 F를 누르세요');
    /* 자식이 준비될 때까지 몇 번 신호를 보낸다(로드 타이밍 편차 흡수) */
    [400,900,1600,2600].forEach(ms=>setTimeout(()=>{
      try{ if(PEER&&!PEER.closed) PEER.postMessage({deck:1,coach:1,i:Reveal.getIndices().h},'*'); }catch(e){}
    },ms));
  }catch(e){ toast('강사용 창을 열지 못했습니다 — 발표는 그대로 진행됩니다'); }
}

/* ── ★★프레젠테이션 리모컨 + 마우스 클릭 (2026-08-08) ────────
   리모컨(무선 프리젠터)은 대개 키보드로 인식된다. 기종별로 보내는 키:
     · Page Down / Page Up   ← 가장 흔함 (로지텍 R400/R500, 대부분의 중국산)
     · → / ←                 ← 일부 기종
     · B 또는 .              ← 화면 검게(블랭크)
     · F5 / ESC              ← 시작 / 종료
   reveal이 PageUp·PageDown·화살표·B·.·ESC를 이미 기본으로 잡고 있어 그대로 동작한다.
   여기서는 ①F5(전체화면 시작) ②마우스 클릭 진행 만 추가한다. */
try{
  Reveal.addKeyBinding({keyCode:116,key:'F5',description:'전체화면으로 시작 (리모컨 호환)'},()=>{
    try{ const el=document.documentElement;
      if(!document.fullscreenElement) (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
    }catch(e){}
  });
}catch(e){}

/* ★마우스 클릭으로 넘기기 — 리모컨의 좌클릭, 그리고 손에 마우스만 있을 때.
   ⚠️ 오작동 방지: 목차·코치패널·진단창·컨트롤·링크·버튼 위 클릭은 무시.
      드래그(글자 선택)도 무시. Shift+클릭 = 이전. */
(function(){
  let dx=0, dy=0, sx=0, sy=0;
  addEventListener('mousedown',e=>{ sx=e.clientX; sy=e.clientY; },true);
  addEventListener('click',e=>{
    try{
      dx=Math.abs(e.clientX-sx); dy=Math.abs(e.clientY-sy);
      if(dx>6||dy>6) return;                                   /* 드래그였다 */
      if(String(getSelection()||'').length) return;            /* 글자 선택 중 */
      if(e.target.closest('#nav,#navtab,#coach,#diag,#keyhelp,.controls,a,button,input,textarea,kbd')) return;
      if(document.body.classList.contains('navopen')) return;  /* 목차가 열려 있으면 목차가 우선 */
      try{ if(Reveal.isOverview&&Reveal.isOverview()) return; }catch(err){}
      e.shiftKey ? Reveal.prev() : Reveal.next();
    }catch(err){}
  });
})();

/* ── ★키 등록 (2026-08-08 재배치) ─────────────────────
   ⚠️ reveal 기본 키와 겹치면 안 된다: N/SPACE/→/↓/L/J = 다음 · P/←/↑/H/K = 이전
      F = 전체화면 · S = 발표자뷰 · B/. = 잠깐 검게 · ESC/O = 전체보기 · ? = 도움말 · A = 자동넘김
   → 안 쓰는 글자만 골랐다: D(강사용) · Z(패널 접기) · C(진행 큐)
   → Reveal.addKeyBinding으로 등록하면 <b>? 도움말 목록에도 자동으로 실린다.</b> */
try{
  Reveal.addKeyBinding({keyCode:68,key:'D',description:'강사용 창 열기 (발표자 보기)'},()=>openPresenter());
  Reveal.addKeyBinding({keyCode:90,key:'Z',description:'강사용 패널 크기 (크게→작게→숨김)'},()=>{ if(window._coachFold) window._coachFold(); });
  Reveal.addKeyBinding({keyCode:67,key:'C',description:'진행 큐 켜기/끄기'},()=>document.body.classList.toggle('nocue'));
  Reveal.addKeyBinding({keyCode:84,key:'T',description:'타이머 정지/재개 (강사용)'},()=>{ if(window._toggleTimer) window._toggleTimer(); });
}catch(e){}


/* ★toast — 화면 아래에 잠깐 뜨는 안내.
   ⚠️ 2026-08-10까지 **정의가 아예 없었다.** 시작 안내가 매번 «toast is not defined»로
      조용히 실패하고 있었다(콘솔에만 남아 아무도 몰랐다). */
function toast(msg, ms){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el); }
  el.textContent=msg; el.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'), ms||4200);
}

/* ★키 안내 — K로 열고 K나 ESC로 닫는다. ⛔수식키에 걸지 말 것(아래 이유). */
(function(){
  const K=[['→ / Space','다음 슬라이드'],['←','이전 슬라이드'],
           ['D','강사용 창 열기 (발표자 보기)'],['F','전체화면'],
           ['[','목차 열기 / 닫기'],['/','목차에서 검색·번호 점프'],
           ['Z','강사용 패널 접기'],['C','진행 큐 켜기/끄기'],
           ['ESC','전체 슬라이드 한눈에'],['B','화면 잠깐 검게'],['K','이 안내 열기/닫기']];
  const el=document.createElement('div'); el.id='keyhelp';
  el.innerHTML='<div class="kh"><b>키 안내</b>'+K.map(x=>'<div><kbd>'+x[0]+'</kbd><span>'+x[1]+'</span></div>').join('')+'</div>';
  document.body.appendChild(el);
  /* ⛔ 수식키(⌘/Ctrl)에 걸지 말 것 — macOS가 ⌘⇧4를 **OS 단계에서 가로채서**
     페이지엔 Meta keydown만 오고 Shift가 안 온다. 「조합키면 취소」가 발동을 못 한다.
     0.7초 홀드로 바꿔도 스크린샷을 찍는 동안 그대로 떴다(2026-08-10 강사 지적 2회).
     → **K 한 글자**로 옮긴다. reveal 기본 키(P·N·J·B·F·O·ESC)와도 안 겹친다. */
  const hide=()=>el.classList.remove('on');
  addEventListener('keydown',e=>{
    if(e.metaKey||e.ctrlKey||e.altKey) return;                 /* 수식키 조합은 통과 */
    const t=e.target, tag=t&&t.tagName;
    if(tag==='INPUT'||tag==='TEXTAREA'||(t&&t.isContentEditable)) return;
    if(e.key==='k'||e.key==='K'||e.key==='ㅏ') el.classList.toggle('on');
    else if(e.key==='Escape') hide();
  });
  addEventListener('blur',hide);
  addEventListener('mousedown',hide);
})();

/* ── ★모드 적용 ────────────────────────────────────── */
document.body.dataset.mode=MODE;
try{ Reveal.on('slidechanged',sendIdx); }catch(e){}
if(MODE==='stage') document.body.classList.add('nocue');

/* ★코치 패널 — 함수로 분리했다. 모드 감지가 실패해도 부모 신호({coach:1})로 런타임에 켤 수 있다.
   ⚠️ 내부 전체가 try/catch다 — 패널이 못 떠도 발표는 계속돼야 한다. */
let COACH_ON=false;
function enableCoach(){
  try{
    if(COACH_ON) return; COACH_ON=true;
    document.body.dataset.mode='coach';
    document.body.classList.add('nocue');
    const P=document.createElement('div'); P.id='coach';
    P.innerHTML='<div class="ct"><span class="cbadge">강사용</span><span class="cnow">–</span><b id="cTitle">–</b>'
      +'<span class="cdelta" id="cDelta" title="예정 대비">–</span>'
      +'<span class="clink" id="cLink" title="발표 창 연결 상태">○</span>'
      +'<span class="cclock" id="cClock">00:00</span>'
      +'<button id="cHist" title="제작 이력 펼치기">이력</button>'
      +'<button id="cFold" title="패널 크기 (Z)">▾</button></div>'
      +'<div class="cban" id="cBan"></div><div class="csay" id="cSay"></div>'
      +'<div class="ccue" id="cCue"></div><div class="cbody" id="cNote"></div>'
      +'<div class="cnext">다음 · <b id="cNext">–</b></div>';
    document.body.appendChild(P);
    /* ★타이머 — 클릭: 정지/재개 · 더블클릭: 시간 직접 입력
       휴식(10분)에 세워두고, 늦게 시작했으면 실제 경과로 맞춰 넣는다. */
    let acc=0, t0=null, run=false;                 /* acc=쌓인 초 · t0=이번 구간 시작 · run=도는 중 */
    const secs=()=> acc + (run ? (Date.now()-t0)/1000 : 0);
    const fmt=d=>{ d=Math.max(0,Math.floor(d));
      return String(Math.floor(d/60)).padStart(2,'0')+':'+String(d%60).padStart(2,'0'); };
    const paint2=()=>{ try{
      cClock.textContent=fmt(secs());
      cClock.classList.toggle('on', run);
      cClock.classList.toggle('paused', !run && (acc>0));
    }catch(e){} };
    setInterval(paint2,500);
    const startT=()=>{ if(!run){ t0=Date.now(); run=true; paint2(); } };
    const pauseT=()=>{ if(run){ acc=secs(); run=false; paint2(); } };
    const toggleT=()=>{ run?pauseT():startT(); toast(run?'타이머 시작':'타이머 정지 — 다시 누르면 재개'); };
    window._toggleTimer=toggleT;

    /* 더블클릭 → 그 자리에서 입력. "12" = 12분 · "12:30" = 12분 30초 */
    const editT=()=>{ try{
      if(cClock.querySelector('input')) return;
      const wasRun=run; pauseT();
      const cur=fmt(secs());
      cClock.innerHTML='<input id="cSet" value="'+cur+'" size="5">';
      const inp=document.getElementById('cSet'); inp.focus(); inp.select();
      const done=ok=>{ try{
        if(ok){ const v=String(inp.value).trim();
          let sec=0;
          if(/^\d+:\d{1,2}$/.test(v)){ const [m,x]=v.split(':').map(Number); sec=m*60+x; }
          else if(/^\d+$/.test(v)) sec=Number(v)*60;
          else sec=null;
          if(sec!==null){ acc=sec; }
        }
        cClock.innerHTML=''; paint2();
        if(wasRun) startT();
      }catch(e){} };
      inp.addEventListener('keydown',e=>{ e.stopPropagation();
        if(e.key==='Enter') done(true); if(e.key==='Escape') done(false); });
      inp.addEventListener('blur',()=>done(true));
    }catch(e){} };

    let ct=null;
    cClock.onclick=e=>{ e.stopPropagation(); clearTimeout(ct); ct=setTimeout(toggleT,220); };
    cClock.ondblclick=e=>{ e.stopPropagation(); clearTimeout(ct); editT(); };
    cClock.title='클릭 = 정지/재개 · 더블클릭 = 시간 입력 (T키도 정지/재개)';
    /* 첫 슬라이드 이동에 자동 시작 */
    Reveal.on('slidechanged',()=>{ if(!run && acc===0) startT(); });
    /* 연결 상태 — 끊겨도 두 창을 각각 방향키로 넘기면 그대로 진행된다 */
    setInterval(()=>{ try{
      let ok=false;
      try{ ok=!!(window.opener&&!window.opener.closed); }catch(e){}
      if(!ok) try{ ok=!!(PEER&&!PEER.closed); }catch(e){}
      cLink.textContent=ok?'●':'○'; cLink.className='clink'+(ok?' on':'');
    }catch(e){} },2000);
    /* ★note 가르기 — ⛔는 금지선(맨 위 띠) · 날짜 없는 ⚠️⏱는 무대 지시 · 나머지는 제작 이력.
       날짜가 붙어 있으면 그건 «왜 이렇게 됐나»지 «지금 할 일»이 아니다. */
    const HASDATE=/20\d\d[-.\/]\d{1,2}|\d{4}년/;
    const cutNote=raw=>{ const o={ban:[],cue:[],his:[]};
      String(raw||'').split(/<br\s*\/?>/i).forEach(x=>{ const t=x.trim(); if(!t) return;
        const q=t.replace(/<[^>]+>/g,'');
        if(/⛔/.test(q)) o.ban.push(t);
        else if(/[⚠⏱]/.test(q) && !HASDATE.test(q)) o.cue.push(t);
        else o.his.push(t); });
      return o; };
    const wrap=a=>a.map(x=>'<div>'+x+'</div>').join('');
    /* ★다음 장 미리보기 — 제목이 없는 타입(fig·vs·nums…)에서 「—」만 뜨던 것을 넓힌다 */
    const peek=o=>{ if(!o) return '끝';
      let r=o.gt||o.h||o.big||o.q||o.gs||o.land||o.kick||'';
      if(!r && o.items && o.items[0]) r=Array.isArray(o.items[0])?o.items[0].join(' '):(o.items[0].t||o.items[0].big||'');
      if(!r && o.rows && o.rows[0]) r=Array.isArray(o.rows[0])?o.rows[0].join(' '):'';
      if(!r && o.left) r=(o.left.t||'')+' ↔ '+((o.right&&o.right.t)||'');
      const t=String(r).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
      return t?t.slice(0,46):('['+(o.t||'?')+' 장]'); };
    /* ★예정 대비 — 레일(SECTIONS)의 시작·끝 분을 장 수로 나눠 «이 장의 예정 분»을 만든다 */
    const PLAN=(()=>{ const a=[]; let cur=null, buf=[];
      const flush=()=>{ if(cur){ const g=String(cur.time||'').match(/(\d+)\s*[~–-]\s*(\d+)/);
        const s0=g?+g[1]:0, s1=g?+g[2]:s0;
        buf.forEach((ix,k)=>a[ix]=s0+(s1-s0)*k/Math.max(1,buf.length)); } buf=[]; };
      S.forEach((sl,ix)=>{ const m=SECIDX[sl.sec]; if(m!==cur){ flush(); cur=m; } buf.push(ix); });
      flush(); return a; })();
    const cDelta=document.getElementById('cDelta');
    const paintDelta=()=>{ try{
      const i=Reveal.getIndices().h, plan=PLAN[i];
      /* 타이머가 1분도 안 돌았으면 «예정 대비»는 뜻이 없다 — 장을 건너뛰어 온 것뿐이다 */
      if(plan==null || secs()<60){ cDelta.textContent='–'; cDelta.className='cdelta'; cDelta.title='예정 대비 — 타이머 1분 뒤부터'; return; }
      const d=Math.round(secs()/60-plan);
      cDelta.textContent=d>0?('+'+d+'분'):(d<0?(d+'분'):'정시');
      cDelta.className='cdelta'+(d>=3?' late':(d<=-3?' early':''));
      cDelta.title='예정 '+Math.round(plan)+'분 지점';
    }catch(e){} };
    setInterval(paintDelta,2000);
    const paint=()=>{ try{
      const i=Reveal.getIndices().h, sl=S[i], M=SECIDX[sl.sec];
      document.querySelector('#coach .cnow').textContent=(i+1)+' / '+S.length;
      cTitle.textContent=(M?M.time+' · ':'')+(SUBLBL[sl.sec]||(M&&M.name)||sl.sec||'');
      cSay.innerHTML=(sl.say&&sl.say.length)?sl.say.map((x,k)=>'<span><i>'+(k+1)+'</i>'+x+'</span>').join(''):'';
      cSay.style.display=(sl.say&&sl.say.length)?'flex':'none';
      const n=cutNote(sl.note);
      cBan.innerHTML=wrap(n.ban); cBan.style.display=n.ban.length?'block':'none';
      cCue.innerHTML=wrap(n.cue); cCue.style.display=n.cue.length?'block':'none';
      cNote.innerHTML=n.his.length?wrap(n.his):'<i style="opacity:.35">이력 없음</i>';
      cNext.textContent=peek(S[i+1]);
      cNote.scrollTop=0; cBan.scrollTop=0; cSay.scrollTop=0; paintDelta();
    }catch(e){} };
    Reveal.on('slidechanged',paint); paint();
    /* ★3단계 — 46vh(다 본다) → 27vh(말할 것만) → 6vh(슬라이드만). 두 단계로는 부족했다 */
    const fit=()=>{ try{
      const c=document.body.classList;
      const h=c.contains('cfold')?'6vh':c.contains('cmid')?'27vh':'46vh';
      document.querySelector('.reveal').style.height='calc(100vh - '+h+')'; Reveal.layout();
    }catch(e){} };
    let cstep=0;
    const fold=()=>{ cstep=(cstep+1)%3;
      document.body.classList.remove('cmid','cfold');
      if(cstep===1) document.body.classList.add('cmid');
      if(cstep===2) document.body.classList.add('cfold');
      fit(); };
    const cHist=document.getElementById('cHist');
    if(cHist) cHist.onclick=e=>{ e.stopPropagation(); document.body.classList.toggle('chist'); };
    cFold.onclick=e=>{ e.stopPropagation(); fold(); };
    window._coachFold=fold;                 /* 키 등록은 아래 addKeyBinding에서 한다 */
    fit(); window.addEventListener('resize',fit);
  }catch(e){}
}
if(MODE==='coach') Reveal.on('ready',enableCoach);
if(MODE==='coach'){ try{ if(window.opener) setTimeout(sendIdx,400); }catch(e){} }

/* 처음 한 번만 키 안내 */
if(MODE!=='coach') setTimeout(()=>toast('K 키 안내 · D 강사용 창 · F 전체화면'),2200);

/* ⚠️ 2026-08-08 키 충돌 정리
     · D는 「강사용 창」으로 넘겼다 → 진단 오버레이는 개발용이라 Q로 옮김
     · J는 reveal의 「다음 슬라이드」다 → 목차 검색에서 뺀다(/ 로만) */
document.addEventListener('keydown',e=>{
  if(e.target===navQ) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='['||e.key===']'){ e.preventDefault(); toggleNav(); }
  if(e.key==='q'||e.key==='Q'){ e.preventDefault();
    const d=document.getElementById('diag');
    d.classList.contains('on') ? d.classList.remove('on') : runDiag(); }
  if(e.key==='/'){ e.preventDefault(); toggleNav(true); setTimeout(()=>navQ.focus(),120); }
});
Reveal.on('slidechanged',ev=>markNav(ev.indexh));
Reveal.on('ready',ev=>markNav(ev.indexh||0));
markNav(0);

/* ── ★autofit v3 — 잘림 완전 차단 (2026-08-05 강화) ──────────
   ⚠️ v2 문제: reveal은 현재 장 외 display:none이라 지연 측정만 했고,
      전환 타이밍·폰트 로딩에 따라 일부 장이 측정을 건너뛰어 **잘렸다.**
   ✅ v3: 로드 직후 **전 슬라이드를 강제로 한 번 측정**한다.
      (display:block + visibility:hidden 으로 화면 깜빡임 없이)
   ────────────────────────────────────────────────────────── */
const MINSC=0.50;
function fitOne(sec,force){
  if(!sec) return false;
  const bd=sec.querySelector('.bd'), inner=sec.querySelector('.bdi'), fr=sec.querySelector('.fr');
  if(!bd||!inner) return false;
  inner.style.transform='none'; if(fr) fr.style.padding='';
  /* ⚠️ clientHeight는 padding을 포함한다. .bd에 padding:14px 0 12px가 있어
     그대로 쓰면 26px을 과대 계산해 덜 줄이고 → 아래가 잘렸다(2026-08-07 교정). */
  const cs=getComputedStyle(bd);
  const pad=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
  let avail=bd.clientHeight-pad, nat=inner.scrollHeight;
  if(!avail||!nat) return false;
  if(nat>avail-2){
    let k=(avail-2)/nat;
    if(k<0.80 && fr){                       // 많이 넘치면 여백부터 줄인다
      fr.style.padding='14px 40px 10px';
      avail=bd.clientHeight-pad; nat=inner.scrollHeight; k=(avail-2)/nat;
    }
    k=Math.max(MINSC, Math.min(1,k));
    inner.style.transform='scale('+k.toFixed(3)+')';
    inner.dataset.fit=k.toFixed(2);
  } else { inner.style.transform='none'; delete inner.dataset.fit; }
  return true;
}
/* 전 슬라이드 강제 측정 — 숨긴 채로 재기 때문에 깜빡임이 없다 */
function inOverview(){ try{ return !!(Reveal.isOverview&&Reveal.isOverview()); }catch(e){ return false; } }
function fitAll(log){
  /* ⚠️ 개요 모드(ESC)에서는 재지 않는다 — 슬라이드가 변형·축소된 상태라
     잘못 계산된 배율이 그대로 굳어서, 나온 뒤에도 화면이 틀어진다. (2026-08-08) */
  if(inOverview()) return {done:0,shrunk:0,hard:[]};
  const secs=[...document.querySelectorAll('.reveal .slides section')];
  const H=(Reveal.getConfig&&Reveal.getConfig().height)||900;
  let done=0, shrunk=0, hard=[];
  secs.forEach((sec,i)=>{
    const wasDisp=sec.style.display, wasVis=sec.style.visibility, wasH=sec.style.height;
    /* ⚠️ 숨긴 섹션은 height:100%가 0으로 풀려 .bd clientHeight=0 → 측정이 통째로 실패했다.
       강제로 캔버스 높이를 줘야 잴 수 있다. (2026-08-05 버그 수정) */
    if(getComputedStyle(sec).display==='none'){
      sec.style.visibility='hidden'; sec.style.display='block'; sec.style.height=H+'px';
    }
    if(fitOne(sec,true)) done++;
    const f=sec.querySelector('.bdi')?.dataset.fit;
    if(f){ shrunk++; if(+f<0.75) hard.push((i+1)+'번 '+f); }
    sec.style.display=wasDisp; sec.style.visibility=wasVis; sec.style.height=wasH;
  });
  if(log!==false){
    console.log(`autofit — 측정 ${done}/${secs.length}장 · 축소 ${shrunk}장`);
    if(hard.length) console.warn('⚠️ 75% 미만으로 줄어든 장(내용을 덜어낼 것):\n  '+hard.join('\n  '));
  }
  return {done,shrunk,hard};
}
window.fitAll=fitAll;
window.fitReport=()=>fitAll(true);

function fitNow(){ if(inOverview()) return;
  fitOne(document.querySelector('.reveal .slides section.present'),true); }

/* ★자가진단 — D키로 열고 닫는다. 잘리는 장이 있으면 번호를 알려준다. */
function runDiag(){
  const r=fitAll(false), d=document.getElementById('diag');
  const secs=[...document.querySelectorAll('.reveal .slides section')];
  const list=[]; secs.forEach((sec,i)=>{ const f=sec.querySelector('.bdi')?.dataset.fit;
    if(f&&+f<0.85) list.push({n:i+1,f:+f}); });
  list.sort((a,b)=>a.f-b.f);
  let html='<h4>슬라이드 자가진단</h4>';
  html+= '측정 '+r.done+' / '+secs.length+'장 · 축소 적용 '+r.shrunk+'장<br>';
  if(!list.length){ html+='<span class="ok">✓ 85% 미만으로 줄어든 장 없음 — 잘림 위험 낮음</span>'; }
  else{
    html+='<span class="warn">⚠ 85% 미만 '+list.length+'장</span> — 내용을 덜어내는 편이 낫습니다<ul>'
      + list.map(x=>'<li><b class="jump" data-i="'+(x.n-1)+'">'+String(x.n).padStart(3)+'번</b> → '+Math.round(x.f*100)+'%</li>').join('')
      + '</ul>';
  }
  html+='<div class="hint">번호를 누르면 그 장으로 이동합니다 · <b>D</b>로 닫기</div>';
  d.innerHTML=html; d.classList.add('on');
  d.querySelectorAll('b.jump').forEach(el=>el.onclick=()=>Reveal.slide(+el.dataset.i,0));
}
/* ★짝 연결선 좌표 — 레이아웃 좌표(offset*)로 재므로 autofit 배율에 영향받지 않는다 */
function off(el,root){ let x=0,y=0,n=el;
  while(n&&n!==root){ x+=n.offsetLeft; y+=n.offsetTop; n=n.offsetParent; }
  return {x,y}; }
function drawPairs(){
  try{
    if(inOverview()) return;                 /* 개요 모드에서는 좌표가 무의미하다 */
    document.querySelectorAll('.reveal .hg').forEach(hg=>{
      const c=hg.querySelector('.hgconn'); if(!c) return;
      const U=hg.querySelectorAll('.bar.up.on'), D=hg.querySelectorAll('.bar.dn.on');
      if(U.length!==1||D.length!==1){ c.classList.remove('on'); return; }
      const u=U[0], d=D[0];
      if(!u.offsetWidth||!d.offsetWidth){ c.classList.remove('on'); return; }
      const pu=off(u,hg), pd=off(d,hg);
      const x=Math.max(pu.x+u.offsetWidth, pd.x+d.offsetWidth);   /* 오른쪽 모서리 */
      const GAP=26, y1=pu.y+u.offsetHeight/2, y2=pd.y+d.offsetHeight/2;
      c.querySelector('.tk.t').style.cssText='left:'+(pu.x+u.offsetWidth-8)+'px;top:'+(y1-1)+'px;width:'+(x-pu.x-u.offsetWidth+GAP+8)+'px';
      c.querySelector('.tk.b').style.cssText='left:'+(pd.x+d.offsetWidth-8)+'px;top:'+(y2-1)+'px;width:'+(x-pd.x-d.offsetWidth+GAP+8)+'px';
      c.querySelector('.vl').style.cssText='left:'+(x+GAP-3)+'px;top:'+y1+'px;height:'+(y2-y1)+'px';
      c.querySelector('.lb').style.cssText='left:'+(x+GAP)+'px;top:'+((y1+y2)/2)+'px';
      c.classList.add('on');
    });
  }catch(e){}
}
window.drawPairs=drawPairs;
Reveal.on('slidechanged',()=>setTimeout(drawPairs,30));
Reveal.on('ready',()=>{ fitNow(); setTimeout(()=>{fitAll(false); drawPairs();
  /* ★★svg 재장착 — 초기화 과정에서 일부 <svg>가 «글자만» 좌표를 잘못 잡은 채 굳는다
     (도형은 제 크기, 글자는 1/3 크기로 좌상단에 뭉침 · 2026-08-11 24·151번에서 재현).
     ⚠️격리 결과: ⓐsvg 자식만 재파싱해서는 안 낫는다 — **요소 자체를 다시 만들어야** 한다
                ⓑ그런데 autofit이 걸어둔 **.bdi transform 안에서 다시 만들면 또 틀어진다**
                → **transform을 잠깐 벗기고 → 재장착 → 되돌린다.** 이 순서라야 낫는다. */
  const healFig=sec=>{ if(!sec) return;
    const f=sec.querySelector('.fig'); if(!f||!f.querySelector('svg')) return;
    const bdi=sec.querySelector('.bdi'), tf=bdi?bdi.style.transform:'';
    if(bdi) bdi.style.transform='none';
    f.innerHTML=f.innerHTML;
    if(bdi) bdi.style.transform=tf; };
  document.querySelectorAll('.reveal .slides section').forEach(healFig);
  window.__healFig=healFig;
},120); });
/* 장에 도착할 때마다 그 장만 한 번 더 — 페인트가 낡은 채 남는 층이 따로 있다.
   해시(#/23)로 직접 착륙한 첫 페인트도 여기서 받는다. */
Reveal.on('slidechanged',ev=>window.__healFig&&window.__healFig(ev.currentSlide));
Reveal.on('ready',ev=>[60,240,600].forEach(t=>setTimeout(()=>window.__healFig&&window.__healFig(Reveal.getCurrentSlide()),t)));
window.addEventListener('resize',()=>setTimeout(drawPairs,120));
/* ★개요(ESC) 나올 때 · 전체화면 전환 때 다시 잰다 — 그때 크기가 바뀌기 때문 */
try{ Reveal.on('overviewhidden',()=>setTimeout(()=>{ fitAll(false); drawPairs(); },160)); }catch(e){}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>
  document.addEventListener(ev,()=>setTimeout(()=>{ fitAll(false); drawPairs(); },200)));
Reveal.on('slidechanged',()=>{ requestAnimationFrame(fitNow); setTimeout(fitNow,90); });
if(document.fonts&&document.fonts.ready){
  document.fonts.ready.then(()=>{ setTimeout(()=>fitAll(true),80); });
}
window.addEventListener('load',()=>setTimeout(()=>fitAll(false),400));
window.addEventListener('resize',()=>{ clearTimeout(window.__ft); window.__ft=setTimeout(()=>fitAll(false),200); });
</script>
</body>
