<style>
/* ═══════════════════════════════════════════════════════════════
   1회차 프레젠테이션 — A안 · 에디토리얼 (Readymag Blue 계열)
   2026-08-05 v3 · "큼직큼직" 타입 스케일 확대판
   · 스택: HTML + CSS + 바닐라 JS + reveal.js 4.6.1 (빌드 없음, 단일 파일)
   · 슬라이드 = S[] 데이터 + render() 생성
   · say[] = 발표자 뷰 전용 진행 메모 (화면에 안 나옴)
   · note   = 발표자 뷰 전용(S키). 학생 화면에 안 뜬다.
   ── 조판 원칙 ────────────────────────────────────────────────
   ① 헤드라인이 화면을 지배한다 (시선이 꽂히는 곳 하나)

   ③ 강조는 단색 1개(블루) — 슬라이드당 한 군데

   ═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#FFFFFF; --paper:#FAF9F7; --panel:#FFFFFF;
  --ink:#0E1116; --body:#333B45; --mut:#5E6773; --faint:#9AA2AC;
  --ln:#E4E2DD; --ln2:#D2CFC8;
  --ac:#1B4D8F;          /* Readymag Blue 계열 */
  --acbg:#EDF3FA; --acln:#B9CFE6; --acdim:#5C86B8;
  --ok:#1B6E52; --okbg:#EAF5F0; --red:#B8443A; --redbg:#FBEEEC;
}
*{ box-sizing:border-box; word-break:keep-all; -webkit-font-smoothing:antialiased; }

/* ★줄바꿈 품질 (2026-08-07)
   문제: keep-all은 '단어 중간'만 막을 뿐, **의미 단위**로 끊어주지는 않는다.
        → "정답이 이미 / 존재했다"처럼 볼드 구간 한복판에서 갈리거나,
          마지막 줄에 한 단어만 남는(고아) 줄이 생겼다.
   해결: 제목류는 balance(줄 길이를 고르게), 본문류는 pretty(고아 줄 방지).
   ⚠️ 강조 구간(b/em/u)은 붙여서 끊는다 — 강조가 두 줄로 갈리면 강조가 아니게 된다. */
.h, .big, .cols .ct, .vs .vt, .dcell .dt2, .hgcap,
.creed .q{ text-wrap:balance; }
/* ★2026-08-14 venn dim — 아직 안 켠 원. 1회차 「세 번째는 비운 채」 설계용

      그 바람에 .h·.big이 전부 opacity:.34 + dashed가 되어 **모든 제목이 흐렸고**,
      제목류의 text-wrap:balance는 .creed .q 하나만 남아 «줄바꿈 품질 규칙이 사라졌다».
      ⛔주석을 셀렉터 목록 «줄 끝»에 붙이지 말 것 — 다음 줄이 그 목록에 딸려 들어간다. */
.venn .vc.voff{ opacity:.34; border-style:dashed }
.vlegend span.voff{ opacity:.45 }
.ci, .lc, .vv, .sub, .rv, .out, .li .lc small, .cols .ci small, .vs .vv small{ text-wrap:pretty; }

.hgcap b, .rv b, .out b{ white-space:nowrap; }
/* 강조가 한 줄에 안 들어갈 만큼 길면 nowrap이 넘치므로, 긴 강조는 예외 */
.ci b.wrap, .sub b.wrap, .rv b.wrap, .vv b.wrap{ white-space:normal; }

/* ── 프레임 ── */
/* ★2026-08-05 밀도 조정: 수직 여백을 줄여 확보한 공간을 글자 크기로 돌린다.
   (autofit 축소가 걸리면 글자가 작아지므로, 여백을 먼저 줄이는 것이 순서다) */
.fr{ height:100%; display:flex; flex-direction:column; padding:22px 52px 16px; }
/* ★헤더 v2 — “지금 어디서 뭘 하는지”가 한눈에 (2026-08-05) */
.hd{ flex:0 0 auto; padding-bottom:10px; border-bottom:2px solid var(--ink); }
.hdtop{ display:flex; justify-content:space-between; align-items:center; }
.hd .sec{ display:flex; align-items:center; gap:10px; min-width:0; padding-left:34px; }
/* ★파트와 구간은 «다른 단위»다 — 붙여 놓고 색을 갈라 위계를 보인다.
   [파트 3][도구 ①] = 한 덩어리 · │ 뒤 = 지금 하는 것 (2026-08-10 강사 지적) */
.hd .pg{ display:flex; align-items:stretch; min-width:0; }
.hd .sn{ flex:0 0 auto; height:56px; padding:0 21px; border-radius:13px 0 0 13px; background:var(--ink);
         color:#fff; font-size:32px; font-weight:800; letter-spacing:-.03em; white-space:nowrap;
         display:flex; align-items:center; justify-content:center; }
.hd .st{ flex:0 0 auto; display:flex; align-items:center; font-size:32px; color:var(--ink);
         font-weight:800; letter-spacing:-.04em; white-space:nowrap; background:#E4E7EC;
         border-radius:0 13px 13px 0; padding:0 21px; }
.hd .sp{ flex:0 0 auto; display:flex; align-items:center; font-size:32px; font-weight:800;
         letter-spacing:-.03em; white-space:nowrap; color:#fff; background:#5A6474; padding:0 19px; }
.hd .pg.solo .st{ border-radius:13px; }
.hd .sbar{ flex:0 0 auto; width:2px; height:27px; background:var(--ln2); margin:0 4px; }
/* ★모래시계 짝 표시 — 모래시계와 같은 색 규칙을 써서 즉시 연결되게 */
.pair{ display:flex; align-items:center; gap:7px; padding-right:16px;
       border-right:1px solid var(--ln2); }
.pair .pu{ background:#2C3542; color:#fff; }
.pair .pd{ background:var(--ac); color:#fff; }
.pair .pu,.pair .pd{ font-size:19px; font-weight:800; padding:4px 10px; border-radius:6px;
                     letter-spacing:-.02em; white-space:nowrap; }
.pair .parrow{ font-size:24px; color:var(--faint); font-weight:800; }
.pair .plbl{ font-size:16px; font-weight:800; letter-spacing:.12em; color:var(--faint);
             margin-right:2px; }
/* 지금 하는 것 = 헤더에서 제일 크고 진하다. 구간칩보다 커야 눈이 여기 먼저 간다. */
.hd .ss{ flex:0 1 auto; font-size:32px; color:var(--ink); font-weight:800;
         letter-spacing:-.045em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hd .hdr{ flex:0 0 auto; display:flex; align-items:center; gap:16px; }
.cuebar{ flex:0 0 auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
   margin-top:10px; padding-top:11px; border-top:1px dashed var(--ln2); }
.cuebar .cl{ flex:0 0 auto; font-size:16px; font-weight:800; letter-spacing:.14em; color:var(--faint); }
.cuebar .ci{ display:flex; align-items:center; gap:7px; font-size:20px; font-weight:600;
   color:var(--mut); letter-spacing:-.02em; background:#F4F5F7; border-radius:7px; padding:5px 12px; }
.cuebar .ci i{ font-style:normal; font-size:14px; font-weight:800; color:#fff; background:var(--faint);
   border-radius:50%; width:19px; height:19px; display:flex; align-items:center; justify-content:center; }
.cuebar .ci b{ color:var(--ink); font-weight:800; }
.cuebar .ci em{ font-style:normal; color:var(--ac); }
body.nocue .cuebar{ display:none; }
/* ★강사용 하단 코치 패널 — 태블릿·폰에서 연다(빔에는 발표용을 띄운다)
   ⚠️2026-08-18 개편(강사: "발표할 때 읽고 보기가 너무 어렵더라").
   원인은 «위계»였다 — 실제로 말할 것(say)은 15.5px 칩인데,
   현장에서 안 읽어도 되는 «제작 이력»(note)이 본문을 통째로 먹고 있었다(147장 중 99장).
   ⛔금지선은 그 회색 문단 «속»에 묻혀 있었다.
   → ①⛔금지선을 맨 위 빨간 띠로 ②say를 세로로 크게 ③이력은 접는다. */
#coach{ position:fixed; left:0; right:0; bottom:0; height:46vh; z-index:80; background:#15171C; color:#E7E9EE;
  display:flex; flex-direction:column; font-size:15px; line-height:1.55; }
body.cmid #coach{ height:27vh; }
body.cfold #coach{ height:6vh; }
body.cmid #coach .cbody, body.cmid #coach .cnext{ display:none !important; }
body.cfold #coach .cban, body.cfold #coach .csay, body.cfold #coach .ccue,
body.cfold #coach .cbody, body.cfold #coach .cnext{ display:none !important; }

/* ⛔금지선 — 놓치면 사고가 나는 것. 맨 위, 빨간 띠, 접어도 안 숨긴다(cfold 제외) */
#coach .cban{ flex:0 0 auto; max-height:20vh; overflow-y:auto; background:#6E1D18; color:#FFE6E2;
  font-size:15.5px; font-weight:600; line-height:1.5; padding:9px 15px; }
#coach .cban b{ color:#fff; } #coach .cban i{ font-style:normal; color:#FFC9C0; }
#coach .cban div+div{ margin-top:5px; padding-top:5px; border-top:1px solid rgba(255,255,255,.14); }
/* ⚠️⏱ 무대 지시 — 날짜가 없는 것만. 날짜가 붙었으면 그건 이력이다 */
#coach .ccue{ flex:0 0 auto; padding:7px 15px 0; font-size:15.5px; color:#F5B54B; line-height:1.5; }
#coach .ccue b{ color:#FFD98A; } #coach .ccue div+div{ margin-top:3px; }
#coach #cFold{ flex:0 0 auto; background:#232833; color:#8E97A6; border:0; border-radius:6px;
  font-size:13px; padding:3px 9px; cursor:pointer; }
body.cfold #coach #cFold{ transform:rotate(180deg); }
#coach .ct{ flex:0 0 auto; display:flex; align-items:center; gap:11px; padding:9px 15px;
  border-bottom:1px solid #2C313A; }
#coach .cnow{ font-size:13px; font-weight:800; color:#8E97A6; font-variant-numeric:tabular-nums; }
#coach .ct b{ font-size:17px; letter-spacing:-.02em; flex:1 1 auto; }
#coach .cbadge{ flex:0 0 auto; background:#7FB2FF; color:#15171C; font-size:12px; font-weight:800;
  border-radius:5px; padding:3px 8px; letter-spacing:.04em; }
#coach .clink{ font-size:13px; color:#5A6272; }
#coach .clink.on{ color:#4ADE80; }
#dtoast{ position:fixed; left:50%; bottom:26px; transform:translate(-50%,14px); z-index:120;
  background:#15171C; color:#fff; font-size:16px; font-weight:600; border-radius:10px;
  padding:11px 20px; opacity:0; pointer-events:none; transition:.22s; max-width:78vw; text-align:center; }
#dtoast.on{ opacity:.96; transform:translate(-50%,0); }
#toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(14px);
        z-index:200; background:#15171C; color:#E7E9EE; font-size:15px; font-weight:700;
        letter-spacing:-.02em; padding:11px 20px; border-radius:999px; opacity:0;
        pointer-events:none; transition:opacity .25s, transform .25s; white-space:nowrap; }
#toast.on{ opacity:.94; transform:translateX(-50%) translateY(0); }
#keyhelp{ position:fixed; inset:0; z-index:130; display:none; align-items:center; justify-content:center;
  background:rgba(14,17,22,.55); }
#keyhelp.on{ display:flex; }
#keyhelp .kh{ background:#15171C; color:#E7E9EE; border-radius:14px; padding:22px 28px; min-width:340px;
  font-size:17px; line-height:1.9; }
#keyhelp .kh b{ display:block; font-size:15px; letter-spacing:.14em; color:#8E97A6; margin-bottom:12px; }
#keyhelp .kh div{ display:flex; gap:16px; align-items:baseline; }
#keyhelp kbd{ flex:0 0 118px; background:#232833; border-radius:6px; padding:3px 9px; font-size:15px;
  font-weight:800; font-family:inherit; text-align:center; }
#coach .cclock{ font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; color:#5A6272; }
#coach .cclock.on{ color:#7FB2FF; }
#coach .cclock{ cursor:pointer; user-select:none; }
#coach .cclock.paused{ color:#F5B54B; }
#coach .cclock.paused::after{ content:' ⏸'; font-size:14px; }
#coach .cclock input{ width:110px; background:#232833; color:#7FB2FF; border:2px solid #7FB2FF;
  border-radius:6px; font:800 20px/1 inherit; font-variant-numeric:tabular-nums;
  text-align:center; padding:2px 4px; outline:none; }
/* ★말할 것 — 이 패널의 «주인공». 가로로 흘리면 순서가 흐려진다 → 세로로 쌓는다 */
#coach .csay{ flex:0 1 auto; display:flex; flex-direction:column; gap:5px;
  padding:9px 15px 3px; overflow-y:auto; }
#coach .csay span{ display:flex; align-items:flex-start; gap:9px; background:#232833; border-radius:8px;
  padding:7px 13px; font-size:18px; font-weight:700; color:#F2F4F8; line-height:1.45; }
#coach .csay span b{ color:#fff; }
/* 제작 이력 — 현장에서 읽을 것이 아니다. 접어두고, 필요할 때만 편다 */
#coach .cbody{ flex:1 1 auto; overflow-y:auto; padding:9px 15px; font-size:13.5px; color:#8A93A2;
  line-height:1.55; border-top:1px solid #2C313A; margin-top:7px; }
#coach #cHist{ flex:0 0 auto; background:#232833; color:#8E97A6; border:0; border-radius:6px;
  font-size:13px; padding:3px 9px; cursor:pointer; font-family:inherit; }
body.chist #coach #cHist{ background:#2F3949; color:#C7D0DE; }
body:not(.chist) #coach .cbody{ display:none; }
/* 예정 대비 — 절대 시각만 보면 «늦었는지»를 강사가 암산해야 한다 */
#coach .cdelta{ flex:0 0 auto; font-size:14px; font-weight:800; color:#5A6272;
  font-variant-numeric:tabular-nums; }
#coach .cdelta.late{ color:#FF8A7A; } #coach .cdelta.early{ color:#4ADE80; }
#coach .cbody b{ color:#D7DBE2; } #coach .cbody i{ color:#8E97A6; }
#coach .csay span i{ flex:0 0 auto; margin-top:3px; font-style:normal; font-size:12px; font-weight:800;
  color:#15171C; background:#7FB2FF; border-radius:50%; width:19px; height:19px;
  display:flex; align-items:center; justify-content:center; }
#coach .cnext{ flex:0 0 auto; padding:8px 15px; border-top:1px solid #2C313A; font-size:13.5px; color:#8E97A6; }
#coach .cnext b{ color:#E7E9EE; }
/* 강사용에서 목차 점프는 오히려 더 필요하다 — 살려둔다 */
body[data-mode="coach"] #navtab{ top:8px; }
@media print{ #coach{ display:none; } }
@media print{ .cuebar{ display:none; } }
.hd .pg{ flex:0 0 auto; font-size:21px; color:var(--faint);
         font-variant-numeric:tabular-nums; letter-spacing:.1em; }
.hd .pg b{ color:var(--ink); font-weight:800; font-size:25px; }
/* ── 영화 초거대 기업 장 (2026-08-08) ── */
.src{ font-size:20px; color:var(--faint); margin:-6px 0 18px; }
/* 하단 출처 줄 — 작게, 그러나 뒷자리에서도 읽히는 하한(17px) */
.imgslot{ margin-top:20px; border:3px dashed var(--ln2); border-radius:12px;
  background:repeating-linear-gradient(45deg,#FBFAF8,#FBFAF8 12px,#F5F3EF 12px,#F5F3EF 24px);
  padding:22px 26px; display:flex; align-items:baseline; gap:16px; }
.imgslot b{ flex:0 0 auto; font-size:21px; font-weight:800; color:var(--red);
  background:var(--redbg); border-radius:7px; padding:5px 12px; }
.imgslot span{ font-size:22px; color:var(--mut); line-height:1.5; }
/* ★2026-08-19 실제 사진 렌더 — img 필드에 경로를 주면 뜬다. 파일이 없으면 위 imgslot(자리표시자)로 내려간다(깨진 이미지 방지) */
.deckimg{ margin-top:20px; text-align:center; }
.deckimg img{ max-width:100%; max-height:50vh; border-radius:12px; box-shadow:0 6px 28px rgba(20,17,14,.18); object-fit:contain; }
.deckimg .cap{ display:block; margin-top:10px; font-size:19px; color:var(--mut); }
/* 제목 바로 아래에 오므로 «위» 선이 아니라 «아래» 선으로 받친다 */
.land{ margin:10px 0 24px; padding-bottom:18px; border-bottom:3px solid var(--ink);
  font-size:42px; font-weight:800; letter-spacing:-.045em; line-height:1.3; color:var(--ink); }
.land.bot{ margin:26px 0 0; padding:20px 0 0; border-top:3px solid var(--ink); border-bottom:0; }
.land em{ font-style:normal; color:var(--ac); }
.land b{ background:linear-gradient(transparent 60%,#FFE9A8 60%); }
.srcline{ margin-top:16px; padding-top:9px; border-top:1px solid var(--ln);
  font-size:17px; line-height:1.5; color:var(--faint); letter-spacing:-.01em; }
.srcline b{ color:var(--mut); font-weight:700; }
.srcline::before{ content:'출처'; font-size:12px; font-weight:800; letter-spacing:.12em;
  color:#fff; background:var(--faint); border-radius:4px; padding:2px 7px; margin-right:9px;
  vertical-align:2px; }
.movwrap{ display:flex; gap:56px; align-items:stretch; }
.movcol{ flex:0 0 560px; display:flex; flex-direction:column; gap:14px; }
.movco{ border:1px solid var(--ln); border-radius:12px; padding:16px 20px 14px; background:#fff;
        display:flex; flex-direction:column; gap:6px; position:relative; }
.movco .mtag{ font-size:17px; color:var(--mut); }
.movco .mtag b{ color:var(--ink); }
.movco .mb{ display:inline-block; font-size:13px; font-weight:800; letter-spacing:.1em; color:#fff;
        background:var(--faint); border-radius:5px; padding:2px 8px; margin-right:7px; vertical-align:2px; }
.movco .mv{ position:absolute; right:20px; bottom:12px; font-size:40px; font-weight:800;
        letter-spacing:-.04em; color:var(--ink); font-variant-numeric:tabular-nums; }
.movco .wm{ line-height:1.02; }
.movco.wayne .wm{ font-family:Georgia,'Times New Roman',serif; font-size:35px; font-weight:700;
        letter-spacing:.13em; color:#1B2A41; }
.movco.stark .wm{ font-size:38px; font-weight:900; font-style:italic; letter-spacing:-.01em; color:#9A2B23; }
.movco.stark .wm span{ display:block; font-size:19px; font-weight:800; letter-spacing:.42em; color:#3B4250; font-style:normal; }
.movco.cyber .wm{ font-family:'SF Mono',Menlo,monospace; font-size:31px; font-weight:700;
        letter-spacing:.16em; color:#232A33; }
.movco.cyber .wm span{ display:block; font-size:16px; letter-spacing:.52em; color:var(--faint); }
.g900wrap{ flex:1 1 auto; display:flex; flex-direction:column; align-items:center; gap:12px; }
.g900{ position:relative; width:438px; height:438px; border:2px solid var(--ink); border-radius:6px;
  background-image:repeating-linear-gradient(0deg,transparent 0 13.6px,var(--ln) 13.6px 14.6px),
                   repeating-linear-gradient(90deg,transparent 0 13.6px,var(--ln) 13.6px 14.6px);
  background-color:var(--acbg,#EEF3FA); }
.g900lbl{ position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); text-align:center;
  font-size:26px; color:var(--mut); background:rgba(255,255,255,.88); border-radius:9px; padding:10px 18px; }
.g900lbl b{ font-size:40px; color:var(--ink); letter-spacing:-.03em; }
.gcell{ position:absolute; left:1px; bottom:1px; width:13px; height:13px; background:#232A33; }
.gcallout{ position:absolute; left:24px; bottom:-4px; font-size:19px; color:var(--ink);
  background:#FFE9A8; border-radius:6px; padding:3px 10px; transform:translateY(100%); }
.gsum{ position:absolute; left:0; right:0; bottom:70.7%; border-top:3px dashed #B3261E;
  display:flex; justify-content:flex-end; }
.gsum .gsl{ transform:translateY(-100%); background:#B3261E; color:#fff; font-size:18px; font-weight:700;
  border-radius:6px 6px 0 0; padding:4px 11px; letter-spacing:-.02em; }
.gsum .gsl b{ font-weight:800; }
.gpunch{ font-size:30px; font-weight:800; letter-spacing:-.03em; margin-top:18px; }
.gpunch b{ color:var(--ac); }
.gpunch2{ font-size:21px; font-weight:600; color:var(--body); letter-spacing:-.02em; margin-top:2px;
  text-align:center; line-height:1.45; }
.gpunch2 b{ color:var(--ink); font-weight:800; }
.gnote{ font-size:15.5px; color:var(--faint); }
/* 진행 레일 — 전체 구간 중 현재 위치 */
.rail{ display:flex; gap:3px; margin-top:10px; }
.rail i.brk{ margin-left:11px; }
.rail i{ flex:1 1 0; height:5px; border-radius:3px; background:#E8E9EC; display:block; }
.rail i.done{ background:#C3C8CF; }
.rail i.now{ background:var(--ac); box-shadow:0 0 0 2px rgba(27,77,143,.16); }
.rail i.rest{ background:#EFF0F2; }
.bd{ flex:1 1 auto; display:flex; flex-direction:column; justify-content:center;
     padding:14px 0 12px; min-height:0; overflow:hidden; }
/* ★autofit — 큰 타입에서 넘치는 슬라이드만 자동 축소. 90장을 손으로 안 다듬어도 된다. */
/* ⚠️ transform-origin은 반드시 top center. (2026-08-07 교정)
   center center면 축소해도 요소가 상자 중심을 기준으로 퍼져서, avail/nat 배율로는 위아래가 남는다.
   실제 필요 배율이 (avail/2)/(nat-avail/2)가 되어 계산이 어긋나고 → 덜 줄여서 잘렸다.
   top 기준으로 바꾸면 필요 배율이 정확히 avail/nat이 된다. */
.bdi{ width:100%; transform-origin:top center; min-height:0; }

/* (구 "말할 것" 레일 · "논지 흐름" 블록 — 2026-08-05 전면 삭제.
   슬라이드 본문 자체로 진행이 되어야 한다는 원칙. say[]는 발표자 뷰로만 간다.) */

/* ── 타이포 ── */
.kick{ font-size:21px; color:var(--ac); font-weight:800; letter-spacing:.22em; margin-bottom:22px; }
h1.t{ font-size:94px; line-height:1.06; font-weight:800; margin:0; letter-spacing:-.055em; }
h2.h{ font-size:60px; line-height:1.1; font-weight:800; margin:0 0 24px; letter-spacing:-.05em; }
.big{ font-size:78px; line-height:1.12; font-weight:800; margin:0; letter-spacing:-.052em; }
.big em{ font-style:normal; color:var(--ac); }
.big u{ text-decoration:none; box-shadow:inset 0 -6px 0 var(--acbg); }
.sub{ font-size:35px; line-height:1.48; color:var(--body); margin-top:26px;
      padding-left:20px; border-left:3px solid var(--ac); max-width:88%; }
.sub em{ font-style:normal; color:var(--ac); font-weight:700; }
.sub b{ color:var(--ink); font-weight:700; }
.sub.center{ border-left:0; padding-left:0; max-width:none; text-align:center; }
/* 「클릭해야 뜨는」 힌트 — 아직 안 뜬 동안 «빈 세로 막대»만 남지 않게 (2026-08-18)
   ⚠️이 줄은 sync-engine이 «안 가져간다» — PARTS의 CSS 칸은 첫 <style>(reveal reset)만 잡는다.
   덱 스타일시트는 네 번째 <style>이다. ⛔고쳤으면 세 회차에 손으로 같이 넣을 것. */
.sub:has(> .fragment:only-child:not(.visible)){ border-left-color:transparent; }
.center{ text-align:center; }

/* ── 신조 ── */
.creed .q{ font-size:70px; line-height:1.28; font-weight:800; letter-spacing:-.05em;
           padding-left:26px; border-left:5px solid var(--ac); }

/* ── 숫자 (규칙선 그리드) ── */
.nums{ display:grid; grid-template-columns:repeat(3,1fr); border-top:1px solid var(--ln); }
.nums>div{ padding:30px 30px 8px; }
.nums>div+div{ border-left:1px solid var(--ln); }
/* 숫자 위 라벨 — 「무엇을 잰 숫자인가」. 숫자보다 작고 옅어야 위계가 산다 */
.nums .c{ font-size:25px; font-weight:800; color:var(--faint); letter-spacing:-.01em;
          line-height:1.34; margin-bottom:14px; }
.nums .n{ font-size:98px; font-weight:800; color:var(--ac); line-height:.94;
          font-variant-numeric:tabular-nums; letter-spacing:-.06em; }
.nums.plain .n{ color:var(--ink); }
.nums .l{ font-size:38px; color:var(--ink); margin-top:18px; line-height:1.32; font-weight:800;
           letter-spacing:-.035em; }
/* ★2026-08-12 — 이 규칙이 없어서 <b>타깃</b><small>누구한테 파는가</small>가
   「타깃누구한테 파는가」로 한 줄에 붙어 나왔다(2회차 55·56 · 3회차 126 = 4축 도입과 회수 양쪽).
   형제 규칙(.cols .ci small · .li .lc small · .vs .vv small)과 같은 처리로 맞춘다. */
.nums .l small{ display:block; font-size:26px; color:var(--mut); font-weight:600;
                letter-spacing:0; margin-top:7px; }
.nums .s{ font-size:26px; color:var(--mut); margin-top:11px; line-height:1.45; font-weight:600;
          padding-top:10px; border-top:1px solid var(--ln); display:inline-block; }

/* ── 칼럼 ── */
.cols{ display:grid; grid-template-columns:repeat(auto-fit,minmax(0,1fr));
       border-top:1px solid var(--ln); }
.cols>div{ padding:26px 28px 10px; }
.cols>div+div{ border-left:1px solid var(--ln); }
.cols .ct{ font-size:33px; font-weight:800; color:var(--ac); letter-spacing:-.02em; margin-bottom:16px; }
.cols .ci{ font-size:36px; line-height:1.34; color:var(--ink); font-weight:700; }
.cols .ci+.ci{ margin-top:20px; }
.cols .ci small{ display:block; font-size:26px; color:var(--body); margin-top:8px;
                 line-height:1.46; font-weight:500; }
.cols .ci b{ color:var(--ac); font-weight:800; }
/* ★「안 하는 것」 칸은 성격이 반대편이다 — 1px 구분선만으로는 ①②와 «동급»으로 읽힌다.
   옅은 바탕을 깔아 한눈에 갈라준다. ⛔붉은 바탕은 쓰지 않는다 — 이 칸은 «경고»가 아니라
   «안심»을 주는 칸이다(저동기 청중은 '안 해도 된다'에 안심한다). (2026-08-11) */
.cols>div.no{ background:rgba(0,0,0,.032); }
.cols>div.no .ct{ color:var(--red); }
.cols>div.no .ci b{ color:var(--red); }

/* ── 목록 ── */
.li{ display:flex; gap:22px; align-items:baseline; padding:19px 0; border-bottom:1px solid var(--ln); }
.li:first-child{ border-top:1px solid var(--ln); }
.li .lm{ flex:0 0 auto; width:40px; height:40px; border-radius:50%; background:var(--acbg);
         border:2px solid var(--ac); color:var(--ac); font-size:26px; font-weight:800;
         display:flex; align-items:center; justify-content:center; margin-top:2px; }
.li .lc{ min-width:0; font-size:43px; line-height:1.26; color:var(--ink); font-weight:700; }
.li .lc b{ color:var(--ac); font-weight:800; }
.li .lc small{ display:block; font-size:26px; color:var(--body); margin-top:9px;
               line-height:1.48; font-weight:500; }

/* ── 좌우 대비 ── */
.vs{ display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--ln); }
.vs>div{ padding:28px 30px 12px; }
.vs>div+div{ border-left:1px solid var(--ln); }
.vs .vt{ font-size:30px; font-weight:800; letter-spacing:-.02em; margin-bottom:16px; color:var(--ink); }
/* ★톤 (2026-08-08) — 기본은 「왼쪽 부정 / 오른쪽 긍정」이지만 그게 맞는 장은 절반뿐이다.
     (없음) 왼쪽 부정 · 오른쪽 긍정   |   flat 둘 다 중립   |   flip 왼쪽 긍정 · 오른쪽 부정
   ⚠️ 색이 논지와 반대면 청중은 말보다 색을 믿는다. 새 vs 장을 만들 때 반드시 지정할 것. */
.vs .vx .vt{ color:var(--red); } .vs .vo .vt{ color:var(--ac); }
.vs.flat .vx .vt, .vs.flat .vo .vt{ color:var(--ink); }
.vs.flat .vx .vv, .vs.flat .vo .vv{ color:var(--ink); }
.vs.flat .vo .vv b{ color:var(--ac); }
.vs.flip .vx .vt{ color:var(--ac); } .vs.flip .vo .vt{ color:var(--red); }
.vs.flip .vx .vv{ color:var(--ink); } .vs.flip .vo .vv{ color:var(--mut); }
.vs.flip .vx .vv b{ color:var(--ac); font-weight:800; } .vs.flip .vo .vv b{ color:var(--mut); }
.vs .vv{ font-size:39px; line-height:1.34; color:var(--ink); font-weight:600; }
.vs .vo .vv b{ color:var(--ac); font-weight:800; }
.vs .vx .vv{ color:var(--mut); }
.vs .vv small{ display:block; font-size:25px; color:var(--body); margin-top:12px; font-weight:500; }

/* ── ★차트 ───────────────────────────────────────────
   색: 계열이 하나면 한 색(제목이 계열명이라 범례가 필요 없다).
       두 계열은 #2A63AE(돈) / #A8621B(사람) — 색각 검증 통과(ΔE 22+, 명도대 통과).
   ⛔ 이중축 금지 · 값은 직접 라벨(축 눈금 나열 금지) · 격자·축은 흐리게. */
.bars{ margin-top:6px; }
.brow{ display:grid; grid-template-columns:230px 1fr; gap:0 20px; align-items:center;
       padding:14px 0; border-top:1px solid var(--ln); }
.brow:first-child{ border-top:0; }
.blab{ font-size:27px; font-weight:800; letter-spacing:-.03em; color:var(--ink); line-height:1.25; }
.btrack{ position:relative; display:flex; align-items:center; gap:14px; height:44px; }
.bfill{ height:44px; background:#2A63AE; border-radius:0 5px 5px 0; min-width:3px; flex:0 0 auto; }
.brow.hi .bfill{ background:#A8621B; }
.bval{ font-size:31px; font-weight:800; color:var(--ink); letter-spacing:-.03em;
       font-variant-numeric:tabular-nums; white-space:nowrap; }
.bsub{ grid-column:2; font-size:22px; color:var(--mut); margin-top:2px; line-height:1.45; }
.brow .blab small{ display:block; font-size:19px; font-weight:600; color:var(--faint); margin-top:3px; }
/* ★도식 아래 설명을 «세 칸»으로 — 문장이 줄줄 달리면 어느 게 핵심인지 눈이 못 고른다.
   칸 위 라벨(i)이 위 도식의 어느 단계를 설명하는지 가리킨다(2026-08-10 강사 지적) */
.trio{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:24px; }
.trio > div{ padding:18px 22px; border:2.5px solid var(--ln); border-radius:13px; background:#fff; text-align:left; }
.trio i{ font-style:normal; display:block; font-size:19px; font-weight:800; color:var(--ac);
         letter-spacing:-.02em; margin-bottom:9px; }
.trio b{ display:block; font-size:27px; font-weight:800; color:var(--ink); letter-spacing:-.03em; line-height:1.28; }
.trio span{ display:block; margin-top:10px; font-size:22px; font-weight:700; color:var(--mut); line-height:1.4; }
.sub small{ font-size:26px; opacity:.75; } /* 부연 안 small 축소 — 6개 장이 쓰는데 규칙이 없어 본문 크기로 떴다(2026-08-12) */
.fig{ margin:10px 0 0; }
.fig svg{ width:100%; height:auto; max-height:430px; display:block; }
.fig .fl{ fill:var(--ink); font-weight:800; letter-spacing:-.03em; }
.fig .fm{ fill:var(--mut); font-weight:600; letter-spacing:-.02em; }
.fig .fa{ fill:var(--ac); font-weight:800; }
.fig .fr{ fill:var(--red); font-weight:800; }
.slope{ margin:4px 0 0; }
.slope svg{ width:100%; height:auto; max-height:430px; display:block; }
.slope .ax{ stroke:var(--ln2); stroke-width:2; }
.slope .sx{ fill:var(--mut); font-size:24px; font-weight:700; }
.slope .sl{ stroke-width:5; fill:none; stroke-linecap:round; }
.slope .sl.a,.slope .sd.a{ stroke:#2A63AE; } .slope .sd.a{ fill:#2A63AE; }
.slope .sl.b,.slope .sd.b{ stroke:#A8621B; } .slope .sd.b{ fill:#A8621B; }
.slope .sd{ stroke:#fff; stroke-width:2.5; }
.slope .st1{ font-size:29px; font-weight:800; fill:var(--ink); font-variant-numeric:tabular-nums; }
.slope .st2{ font-size:24px; font-weight:700; fill:var(--mut); }
.slope .stx{ font-weight:800; fill:var(--ink); }

/* ── AI 출력 ── */
.out{ background:var(--paper); border-left:4px solid var(--ln2); padding:24px 30px;
      font-size:35px; line-height:1.55; color:var(--body); }
.out.good{ background:var(--acbg); border-left-color:var(--ac); color:var(--ink); }
.out .tag{ display:block; font-size:24px; color:var(--ink); letter-spacing:-.01em;
           font-weight:800; margin-bottom:14px; }
.out.good .tag{ color:var(--ac); }
.out b{ color:var(--ac); font-weight:700; }

/* ── 사다리 ── */
.step{ display:flex; gap:22px; align-items:center; padding:20px 22px; border-radius:10px;
        background:var(--paper); border:1px solid var(--ln); }
.step+.step{ margin-top:12px; }

/* ⚠️ 번호(①)만 오는 게 아니라 「질문」·「결과」 같은 «단어»도 온다 — 고정 원이면 글자가 넘친다
   (2026-08-10 발견: 91번 배지 밖으로 글자가 삐져나와 있었다). 최소 46px 원, 길면 알약으로. */
.step .sn{ flex:0 0 auto; min-width:46px; height:46px; padding:0 14px; border-radius:23px;
            background:var(--ac); color:#fff; font-size:26px; font-weight:800; letter-spacing:-.03em;
            white-space:nowrap; display:flex; align-items:center; justify-content:center;
            box-shadow:0 4px 14px rgba(27,77,143,.24); }
.step .sq{ font-size:32px; font-weight:800; color:var(--ac); margin-bottom:8px; }
.step .sa{ font-size:35px; line-height:1.36; color:var(--ink); font-weight:600; }
.step .sa b{ font-weight:800; box-shadow:inset 0 -5px 0 var(--acbg); }

/* ── ★모래시계 v2 (2026-08-05 전면 재설계) ────────────────
   위(세상이 한 일) = 슬레이트 · 아래(내가 하는 일) = 블루 · 허리 = 앰버
   → 색만 보고도 “당하는 쪽 / 하는 쪽”이 갈린다.
   점등 시 배경을 채워 대비를 최대로.
   ────────────────────────────────────────────────────── */
.hgwrap{ display:flex; flex-direction:column; align-items:center; width:100%; }
.hg{ display:flex; flex-direction:column; align-items:center; gap:5px; width:100%;
     padding-right:170px; position:relative; }
/* ★짝 연결선 — 기본은 숨김. 위/아래가 하나씩만 켜진 장에서만 JS가 켠다. */
.hgconn{ display:none; }
.hgconn.on{ display:block; }
.hgconn i{ position:absolute; background:var(--ac); display:block; }
.hgconn .vl{ width:3px; border-radius:2px; }
.hgconn .tk{ height:3px; border-radius:2px; }
.hgconn .lb{ position:absolute; background:var(--ac); color:#fff; font-size:19px; font-weight:800;
  border-radius:6px; padding:3px 10px; letter-spacing:.06em; transform:translate(-50%,-50%); }

/* 구역 라벨 */
.hg .zone{ display:flex; align-items:center; gap:12px; width:990px;
           margin:0 0 2px; }
.hg .zone .ln3{ flex:1 1 auto; height:1px; background:var(--ln); }
.hg .zone .zt{ flex:0 0 auto; font-size:21px; font-weight:800; letter-spacing:.18em; }
.hg .zone.up .zt{ color:#7B8798; }
.hg .zone.dn .zt{ color:var(--ac); }

/* 막대 공통 */
.hg .bar{ display:flex; align-items:center; gap:14px; border-radius:6px;
          padding:10px 20px; border:2px solid transparent; }
.hg .bnum{ flex:0 0 auto; width:30px; height:30px; border-radius:50%;
           display:flex; align-items:center; justify-content:center;
           font-size:24px; font-weight:800; }
.hg .btxt{ flex:1 1 auto; min-width:0; text-align:left; }
.hg .bn{ display:block; font-size:29px; font-weight:800; line-height:1.15; letter-spacing:-.035em; }
.hg .bs{ display:block; font-size:23px; margin-top:2px; font-weight:600; }

/* 위 = 세상이 한 일 (슬레이트) */
.hg .bar.up{ background:#F2F3F5; border-color:#E2E5E9; }
.hg .bar.up .bnum{ background:#E2E5E9; color:#8C96A3; }
.hg .bar.up .bn{ color:#8C96A3; }
.hg .bar.up .bs{ color:#A6AEB9; }
.hg .bar.up.on{ background:#2C3542; border-color:#2C3542;
                box-shadow:0 6px 22px rgba(44,53,66,.26); }
.hg .bar.up.on .bnum{ background:rgba(255,255,255,.18); color:#fff; }
.hg .bar.up.on .bn{ color:#fff; }
.hg .bar.up.on .bs{ color:rgba(255,255,255,.72); }

/* 아래 = 내가 하는 일 (블루) */
.hg .bar.dn{ background:#F4F7FB; border-color:#E0E8F1; }
.hg .bar.dn .bnum{ background:#E0E8F1; color:#93A4B8; }
.hg .bar.dn .bn{ color:#93A4B8; }
.hg .bar.dn .bs{ color:#A9B6C6; }
.hg .bar.dn.on{ background:var(--ac); border-color:var(--ac);
                box-shadow:0 6px 22px rgba(27,77,143,.28); }
.hg .bar.dn.on .bnum{ background:rgba(255,255,255,.20); color:#fff; }
.hg .bar.dn.on .bn{ color:#fff; }
.hg .bar.dn.on .bs{ color:rgba(255,255,255,.78); }

/* ★허리 — 이 강의의 전환점. 가장 좁지만 가장 강해야 한다.
   ⚠️ 애니메이션·backdrop-filter 금지(인쇄에서 깨짐). 순수 CSS만. */
/* ★허리 행 — 그룹(brk+bars)과 같은 flex 구조를 써서 막대 중심축에 정확히 맞춘다.
   ⚠️ brk가 있을 때만 같은 폭의 spacer를 넣는다. 안 그러면 허리가 154px 왼쪽으로 밀린다(2026-08-07 교정). */
.hg .waistline{ display:flex; align-items:center; gap:16px; justify-content:center; }
.hg .waistrow{ display:flex; margin:10px 0; width:420px; border-radius:8px;
               overflow:hidden; border:2px solid #E2E5E9; }
.hg .brk.empty{ visibility:hidden; }
/* ★주어 브래킷 — 허리에 붙이지 않고 그룹 우측에서 세 칸을 통째로 묶는다(2026-08-05).
   붙여 쓰면 안 보인다는 지적 반영. */
.hg .grp{ display:flex; align-items:stretch; gap:16px; justify-content:center; }
.hg .bars{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:8px; }
.hg .brk{ flex:0 0 auto; width:154px; display:flex; align-items:center; gap:12px; padding:6px 0; }
.hg .brk .bkline{ flex:0 0 auto; width:16px; align-self:stretch;
                  border:3px solid #C9CDD4; border-right:0; border-radius:10px 0 0 10px; }
.hg .brk .bktx{ flex:1 1 auto; text-align:right; font-size:20.5px; font-weight:800;
                letter-spacing:.14em; line-height:1.25; color:#A6AEB9; }
.hg .brk .bktx b{ display:block; font-size:34px; letter-spacing:-.04em; margin-top:5px; color:#8C96A3; }
/* ★주어 라벨 점등 — 라벨은 막대 점등과 무관하게 lu/ld로 직접 켠다.
   ⚠️ 예전엔 .grp.up.on(=막대가 켜졌을 때)에만 색이 붙어서, 허리 장(막대 소등)에서
      라벨이 흐린 회색으로 나와 거의 안 보였다(2026-08-07 교정).
   ★ 위=잉크 / 아래=블루로 갈라 **색만으로도 "주어가 바뀐다"가 읽히게** 한다. */
.hg .brk.on .bkline{ border-width:4px; }
.hg .brk.on.up .bkline{ border-color:#1A1D23; }
.hg .brk.on.up .bktx{ color:#4A5462; }
.hg .brk.on.up .bktx b{ color:#1A1D23; }
.hg .brk.on.dn .bkline{ border-color:var(--ac); }
.hg .brk.on.dn .bktx{ color:var(--acdim); }
.hg .brk.on.dn .bktx b{ color:var(--ac); }
/* 막대까지 켜진 장에서는 기존 대비 유지 */
.hg .grp.up.on .brk .bkline{ border-color:#1A1D23; }
.hg .grp.dn.on .brk .bkline{ border-color:var(--ac); }
.hg .waist{ flex:1 1 auto; display:flex; align-items:center; justify-content:center;
            padding:12px 28px; font-size:28px; font-weight:800; letter-spacing:-.02em;
            color:#A6AEB9; background:#F2F3F5; }

/* ★점등 — 여기가 임팩트 지점 */
.hg .waistrow.on{ border-color:#1A1D23; background:#fff;
                  box-shadow:0 10px 34px rgba(26,29,35,.22); }
.hg .waistrow.on{ border-color:#1A1D23; }
.hg .waistrow.on .waist{ background:#1A1D23; color:#fff; font-size:31px; letter-spacing:-.02em; }
.hg .waistrow.on .waist b{ color:#F0B429; }

/* ★대문(챕터) 슬라이드 — 지금 어느 파트인지 한 화면으로 (2026-08-07 신설)
   ⚠️ 모래시계는 '어디쯤'을 보여주지만 칸이 작아 강사도 청중도 순간적으로 놓친다.
      각 층·도구가 시작될 때 대문을 한 장 세워 **번호와 이름을 크게** 박는다. */
.gate{ display:flex; flex-direction:column; justify-content:center; height:100%; }
.gate .gnum{ display:inline-flex; align-items:stretch; align-self:flex-start; margin-bottom:34px; }
.gate .gnum span{ font-size:42px; font-weight:800; letter-spacing:-.02em; padding:15px 34px;
                  display:flex; align-items:center; white-space:nowrap; }
.gate .gnum .gs2{ background:var(--ink); color:#fff; border-radius:18px 0 0 18px; }
.gate .gnum .gs2:only-child{ border-radius:18px; }
.gate .gnum .gp{ background:#E4E7EC; color:var(--ink); border-radius:0 18px 18px 0; }
.gate .gt{ font-size:136px; font-weight:800; letter-spacing:-.06em; line-height:1.02;
           margin:16px 0 0; color:var(--ink); }
.gate .gt em{ font-style:normal; color:var(--ac); }
.gate .gs{ font-size:46px; color:var(--body); margin-top:26px; font-weight:700; }
/* ★2026-08-12 — gs 안 <small>(부속 안내)에 규칙이 없으면 46px로 붙어 나온다.
   .nums .l small과 같은 구멍이었다 — 쓰기 전에 먼저 판다. */
.gate .gs small{ display:block; font-size:28px; color:var(--mut); font-weight:600; margin-top:14px; }
.gate .grow{ display:flex; gap:12px; margin-top:44px; padding-top:22px;
             border-top:2px solid var(--ink); }
.gate .gi{ flex:1 1 0; padding:14px 16px; border-radius:9px; background:var(--pa,#FAF9F7);
           border:1px solid var(--ln); }
.gate .gi .gk{ font-size:30px; font-weight:800; color:var(--faint); letter-spacing:-.02em; }
.gate .gi .gv{ font-size:36px; font-weight:800; color:var(--faint); margin-top:6px; letter-spacing:-.03em; }
.gate .gi.on{ background:var(--acbg); border-color:var(--ac); border-width:2px; }
.gate .gi.on .gk{ color:var(--ac); }
.gate .gi.on .gv{ color:var(--ink); }
.gate .gi.done{ background:#fff; }

/* ── 파트 마무리(wrap) — CT · 「방금 뭘 했나」 ── */
/* ★★모든 파트가 **같은 그림**으로 닫혀야 청중이 「아 정리구나」를 학습한다.
   장마다 모양이 다르면 정리인지 새 얘기인지 **매번 다시 판단**해야 한다
   (2026-08-10 강사 지적: “파트 마지막에 핵심만 짚고 넘어가야 이 파트에서 뭘 했구나 이해할 듯”).
   ⛔이 타입의 배치를 장별로 손대지 말 것 — 형식이 곧 신호다. */
.wrap{ display:flex; flex-direction:column; justify-content:center; height:100%; }
.wrap .wh{ display:flex; align-items:center; gap:20px; margin-bottom:36px; }
.wrap .wn{ font-size:32px; font-weight:800; color:#fff; background:var(--ink);
           padding:11px 24px; border-radius:14px; letter-spacing:-.02em; white-space:nowrap; }
.wrap .wt{ font-size:58px; font-weight:800; color:var(--ink); letter-spacing:-.045em; line-height:1.1; }
.wrap .wt em{ font-style:normal; color:var(--ac); }
.wrap .wrows{ display:flex; flex-direction:column; gap:14px; }
.wrap .wr{ display:flex; align-items:center; gap:26px; padding:19px 28px; border-radius:13px;
           background:var(--pa,#FAF9F7); border:2px solid var(--ln); }
.wrap .wk{ flex:0 0 200px; font-size:31px; font-weight:800; color:var(--faint); letter-spacing:-.02em; }
.wrap .wv{ font-size:41px; font-weight:700; color:var(--ink); letter-spacing:-.035em; line-height:1.24; }
.wrap .wv b{ font-weight:800; color:var(--ac); }
.wrap .wl{ margin-top:32px; padding-top:24px; border-top:3px solid var(--ink);
           font-size:50px; font-weight:800; color:var(--ink); letter-spacing:-.04em; line-height:1.26; }
.wrap .wl em{ font-style:normal; color:var(--ac); }


/* ── 벤다이어그램 ── */
/* ★벤다이어그램 v2 — 세 원을 각각 다른 색으로, 교집합을 명시 */
/* ★벤다이어그램 — 삼각 배치 (2026-08-07 교정)
   ⚠️ 이전엔 원 3개를 가로 일렬로 두고 margin-left:-76px만 줬다. 그 결과
      나–시장 중심 거리 388px > 반지름 합 270px → **두 원이 닿지도 않았다.**
      즉 3중 교집합이 물리적으로 없는데 캡션은 "겹치는 자리"라고 말했다 — 그림이 말을 반박.
   ✅ 삼각 배치로 중심 거리를 반지름 합보다 짧게. 가운데에 실제 교집합이 생긴다. */
.venn{ position:relative; width:430px; height:396px; margin:0 auto; }
.vc{ position:absolute; width:262px; height:262px; border-radius:50%; border:3px solid; display:flex;
     flex-direction:column; align-items:center; justify-content:center; text-align:center;
     mix-blend-mode:multiply; }
.vc .vtx .vn{ display:block; font-size:38px; font-weight:800; letter-spacing:-.04em; }
.vc .vtx .vd{ display:block; font-size:23px; font-weight:700; margin-top:6px; opacity:.85; }
.vc.a{ border-color:#2C3542; background:rgba(44,53,66,.10); color:#2C3542; }
.vc.b{ border-color:var(--ac); background:rgba(27,77,143,.12); color:var(--ac); }
.vc.c{ border-color:#B8801F; background:rgba(184,128,31,.13); color:#7A5410; }
.vc.a{ left:84px;  top:0;    }   /* 나  — 위    중심(215,131) */
.vc.b{ left:0;    top:134px; }   /* 회사 — 좌하  중심(131,265) */
.vc.c{ left:168px; top:134px; }  /* 시장 — 우하  중심(299,265) */
/* 중심 간 거리 158~168px < 반지름 합 262px → 3중 교집합 성립 */
.vc .vtx{ position:absolute; text-align:center; }
.vc.a .vtx{ top:24px;    left:0; right:0; }
.vc.b .vtx{ bottom:26px; left:0; right:0; }
.vc.c .vtx{ bottom:26px; left:0; right:0; }
.vcore{ position:absolute; left:50%; top:52%; transform:translate(-50%,-50%);
        z-index:3; text-align:center; font-size:44px; font-weight:800; color:var(--ink);
        letter-spacing:-.04em; }
.vlegend{ display:flex; justify-content:center; gap:34px; margin-top:22px; }
.vlegend span{ display:flex; align-items:center; gap:9px; font-size:26px; font-weight:700; color:var(--body); }
.vlegend i{ width:15px; height:15px; border-radius:50%; border:2px solid; display:block; }

/* ── 물 차오르는 층 ── */
.flood{ display:flex; flex-direction:column; max-width:900px; margin:0 auto;
        border-top:1px solid var(--ln); }
.flr{ display:flex; align-items:baseline; gap:22px; padding:22px 8px; border-bottom:1px solid var(--ln); }
.flr .fn{ flex:0 0 auto; font-size:20px; font-weight:800; color:var(--mut); width:46px; letter-spacing:.1em; }
.flr .ft2{ flex:1 1 auto; font-size:38px; font-weight:700; color:var(--ink); min-width:0; }
.flr .fs{ flex:0 0 auto; font-size:26px; color:var(--body); font-weight:700; }
.flr.wet{ background:var(--acbg); } .flr.wet .ft2,.flr.wet .fn,.flr.wet .fs{ color:var(--acdim); }
.flr.now .ft2{ color:var(--ac); font-weight:800; } .flr.now .fn{ color:var(--ac); }
.wlvl{ font-size:22px; font-weight:800; color:var(--ac); padding:10px 8px;
       border-bottom:1px solid var(--ln); letter-spacing:.04em; }

/* ── ★연표 ── */
.tl{ display:grid; grid-template-columns:repeat(6,1fr); }
.tl>div{ padding:0 14px; position:relative; }
.tl>div:before{ content:""; position:absolute; left:0; right:0; top:31px; height:1px; background:var(--ln2); }
.tl>div:first-child:before{ left:50%; } .tl>div:last-child:before{ right:50%; }
.tl .yr{ font-size:22px; font-weight:800; color:var(--mut); letter-spacing:.1em; margin-bottom:11px; }
.tl .dt{ width:11px; height:11px; border-radius:50%; background:#fff; border:2px solid var(--ln2);
         position:relative; z-index:2; margin-bottom:20px; }
.tl .bt{ font-size:32px; font-weight:800; line-height:1.28; color:var(--ink); letter-spacing:-.04em; }
.tl .bs2{ font-size:24.5px; color:var(--body); margin-top:11px; line-height:1.48; font-weight:500; }
.tl>div.hot .yr,.tl>div.hot .bt{ color:var(--ac); }
.tl>div.hot .dt{ background:var(--ac); border-color:var(--ac); }
.tl>div.cold .yr,.tl>div.cold .bt{ color:var(--red); }
.tl>div.cold .dt{ background:var(--red); border-color:var(--red); }

/* ── 채용공고 ── */
.post{ max-width:1000px; margin:0 auto; border-top:1px solid var(--ln); }
.post .pl{ display:flex; gap:20px; align-items:baseline; padding:17px 6px; border-bottom:1px solid var(--ln); }
.post .pk{ flex:0 0 auto; width:150px; font-size:22px; color:var(--mut); font-weight:700; letter-spacing:.04em; }
.post .pv{ font-size:36px; color:var(--ink); font-weight:600; min-width:0; }
.post .pl.mk .pv{ color:var(--ac); font-weight:800; box-shadow:inset 0 -6px 0 var(--acbg); }
.post .mrk{ flex:0 0 auto; font-size:21px; font-weight:800; color:var(--ac); margin-left:auto; }

/* ── 점→선→묶음→자 ── */
.dots{ display:grid; grid-template-columns:1fr 34px 1fr 34px 1fr 34px 1fr;
       align-items:center; border-top:1px solid var(--ln); }
.dcell{ padding:26px 18px 16px; text-align:center; border-radius:10px; border:2px solid transparent; }
.dcell.s1{ background:#F4F5F7; border-color:#E2E5E9; }
.dcell.s2{ background:#EFF3F8; border-color:#DCE5EF; }
.dcell.s3{ background:#E6EDF6; border-color:#C9DAEB; }
.dcell.s4{ background:var(--ac); border-color:var(--ac); box-shadow:0 6px 22px rgba(27,77,143,.28); }
.dcell.s4 .dt2{ color:rgba(255,255,255,.72); }
.dcell.s4 .dn{ color:#fff; } .dcell.s4 .dn b{ color:#fff; }
.dcell.s4 .ruler{ font-size:44px; color:#fff; font-weight:800; letter-spacing:-2px; }
.dcell .dt2{ font-size:29px; font-weight:800; color:var(--ink); letter-spacing:-.02em; margin-bottom:18px; }
.dcell .dv{ height:66px; display:flex; align-items:center; justify-content:center; gap:10px; }
.dcell .dn{ font-size:27px; color:var(--ink); font-weight:700; margin-top:20px; }
.dot{ width:14px; height:14px; border-radius:50%; background:var(--ac); }
.dline{ width:132px; height:3px; background:var(--ac); position:relative; }
.dline:before,.dline:after{ content:""; position:absolute; width:12px; height:12px; border-radius:50%;
  background:var(--ac); top:-4.5px; } .dline:before{ left:0; } .dline:after{ right:0; }
.dbox{ width:36px; height:28px; border:2px solid var(--ac); background:var(--acbg); }
.darr{ font-size:31px; color:var(--faint); text-align:center; }

/* ── 칩 ── */
.spread{ display:flex; flex-wrap:wrap; gap:0; border-top:1px solid var(--ln); }
.chip{ font-size:38px; color:var(--ink); font-weight:600; padding:19px 0;
       border-bottom:1px solid var(--ln); width:100%; }
.chip b{ color:var(--ac); font-weight:800; }

/* ── ★목차(agenda) — 스포일러 없는 세션 단위 ───────────────
   2026-08-05 교체. 구버전은 도구 이름·시간·세부 내용을 전부 노출해
   **뒤에 나올 재미를 먼저 소비**했다. 세션 이름과 한 줄 요약까지만.
   ────────────────────────────────────────────────────────── */
.ag{ border-top:1px solid var(--ln); }
.ag .ar{ display:flex; gap:30px; align-items:baseline; padding:26px 4px; border-bottom:1px solid var(--ln); }
.ag .an{ flex:0 0 auto; width:44px; font-size:24px; font-weight:800; color:var(--ac);
         letter-spacing:.06em; font-variant-numeric:tabular-nums; }
.ag .at{ flex:0 0 auto; width:150px; font-size:43px; font-weight:800; color:var(--ink);
         letter-spacing:-.05em; line-height:1.15; }
.ag .av{ flex:1 1 auto; min-width:0; }
.ag .ah{ font-size:41px; font-weight:700; color:var(--ink); line-height:1.25; letter-spacing:-.04em; }
.ag .ad{ font-size:27px; color:var(--body); margin-top:9px; line-height:1.46; font-weight:500; }
.ag .ad b{ color:var(--ac); font-weight:700; }
.agtop{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
.agtop .cnt{ font-size:22px; font-weight:800; color:var(--ac); letter-spacing:.14em; }

/* ★사전 인용 — 정의를 깔고 뒤집는 장치 */
.dict{ display:flex; gap:46px; align-items:flex-start; }
.dict .dl{ flex:0 0 auto; }
.dict .dw{ font-size:72px; font-weight:800; letter-spacing:-.05em; line-height:1; }
.dict .dh{ font-size:38px; font-weight:600; color:var(--faint); letter-spacing:.06em; margin-top:8px; }
.dict .dr{ flex:1 1 auto; min-width:0; border-left:2px solid var(--ln); padding-left:38px; }
.dict .di{ display:flex; gap:14px; align-items:baseline; padding:11px 0; }
.dict .di+.di{ border-top:1px dashed var(--ln); }
.dict .dn2{ flex:0 0 auto; width:26px; font-size:26px; font-weight:800; color:var(--faint); }
.dict .dt3{ font-size:34px; color:var(--body); font-weight:600; }
.dict .di.new{ border-top:2px solid var(--ac); margin-top:6px; padding-top:16px; }
.dict .di.new .dn2{ color:var(--ac); }
.dict .di.new .dt3{ color:var(--ac); font-weight:800; }
.dict .src{ font-size:22px; color:var(--faint); margin-top:12px; letter-spacing:.04em; }

/* ── ★참고표(ref) — 강사가 보면서 바로 말할 실제 내용 ──────
   2026-08-05 신설. 추상 큐가 아니라 **숫자·사례 원본**을 얹는다.
   말이 막히면 여기서 바로 집어 쓰면 된다.
   ────────────────────────────────────────────────────────── */
.ref{ border-top:1px solid var(--ln); }
.rr{ display:flex; gap:22px; align-items:baseline; padding:12px 4px; border-bottom:1px solid var(--ln); }
.rk{ flex:0 0 auto; width:206px; font-size:26px; font-weight:800; color:var(--ac); line-height:1.38; }
.rk small{ display:block; font-size:21.5px; color:var(--mut); font-weight:600; margin-top:3px; }
.rv{ flex:1 1 auto; min-width:0; font-size:32px; line-height:1.42; color:var(--ink); font-weight:600; }
.rv b{ color:var(--ac); font-weight:800; }
.rv small{ display:block; font-size:25px; color:var(--body); margin-top:6px; line-height:1.45; font-weight:500; }
.rv .tag2{ display:inline-block; font-size:20px; font-weight:800; color:var(--ac);
           background:var(--acbg); border-radius:3px; padding:2px 8px; margin-right:8px; vertical-align:2px; }
.ref.two{ display:grid; grid-template-columns:1fr 1fr; gap:0 40px; }

/* ── 목차 ── */
.toc{ display:grid; grid-template-columns:1fr 1fr; gap:0 46px; }
.trow{ display:flex; gap:16px; align-items:baseline; padding:13px 0; border-bottom:1px solid var(--ln); }
.tn{ flex:0 0 auto; font-size:21px; font-weight:800; color:var(--ac); width:16px; }
.tt{ font-size:27px; font-weight:700; color:var(--ink); line-height:1.3; letter-spacing:-.035em; }
.td{ font-size:22px; color:var(--mut); margin-top:5px; line-height:1.45; }
.td em{ font-style:normal; color:var(--ac); font-weight:700; }
.tm{ flex:0 0 auto; font-size:20.5px; color:var(--faint); margin-left:auto; padding-left:12px;
     font-variant-numeric:tabular-nums; }

/* ── ★좌측 내비게이터 (Notion 스타일) ─────────────────────────
   2026-08-05 교체: 우하단 점프박스 → 좌측 사이드 패널.
   스크롤해서 바로 선택. 현재 슬라이드 자동 하이라이트·자동 스크롤.
   토글 = [ 키 또는 좌상단 탭. 강의 중엔 닫아두고 필요할 때만 연다.
   ────────────────────────────────────────────────────────── */
#nav{ position:fixed; left:0; top:0; bottom:0; width:322px; z-index:70;
      background:#FCFCFB; border-right:1px solid var(--ln2);
      display:flex; flex-direction:column; box-shadow:2px 0 22px rgba(0,0,0,.07);
      transform:translateX(-100%); transition:transform .18s cubic-bezier(.4,0,.2,1); }
body.navopen #nav{ transform:translateX(0); }

#nav .nh{ flex:0 0 auto; padding:16px 16px 13px; border-bottom:1px solid var(--ln); }
#nav .nt{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
#nav .nt b{ font-size:13px; font-weight:800; color:var(--ink); letter-spacing:.02em; }
#nav .nt span{ font-size:11.5px; color:var(--mut); font-variant-numeric:tabular-nums; }
#nav .nj{ display:flex; gap:7px; align-items:center; }
#nav .nj input{ flex:1 1 auto; min-width:0; background:#fff; border:1px solid var(--ln2);
                border-radius:6px; color:var(--ink); font-family:inherit; font-size:20px;
                font-weight:600; padding:7px 10px; outline:none; }
#nav .nj input:focus{ border-color:var(--ac); background:var(--acbg); }
#nav .nj input::placeholder{ color:var(--faint); font-weight:500; }

#nav .nb{ flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain; padding:6px 8px 18px; }
#nav .nb::-webkit-scrollbar{ width:9px; }
#nav .nb::-webkit-scrollbar-thumb{ background:#DCD9D2; border-radius:6px; border:3px solid #FCFCFB; }
#nav .nb::-webkit-scrollbar-thumb:hover{ background:#C3BFB6; }

#nav .sec{ margin-top:12px; padding:5px 9px 6px; display:flex; align-items:baseline; gap:7px; }
#nav .sec:first-child{ margin-top:2px; }
#nav .sec i{ font-style:normal; font-size:10px; font-weight:800; color:#fff; background:var(--ac);
             border-radius:5px; padding:2px 6px; letter-spacing:-.02em; white-space:nowrap; }
#nav .sec b{ font-size:11px; font-weight:800; color:var(--mut); letter-spacing:.11em;
             text-transform:uppercase; }
#nav .sec em{ font-style:normal; margin-left:auto; font-size:10.5px; color:var(--faint);
              font-variant-numeric:tabular-nums; }

#nav a{ display:flex; gap:9px; align-items:baseline; padding:6px 9px; border-radius:6px;
        text-decoration:none; cursor:pointer; }
#nav a:hover{ background:#F1EFEA; }
#nav a .n{ flex:0 0 auto; width:22px; font-size:11px; color:var(--faint); font-weight:700;
           font-variant-numeric:tabular-nums; }
#nav a .t{ flex:1 1 auto; min-width:0; font-size:13px; line-height:1.42; color:var(--body);
           font-weight:500; overflow:hidden; text-overflow:ellipsis; display:-webkit-box;
           -webkit-line-clamp:2; -webkit-box-orient:vertical; }
#nav a.on{ background:var(--acbg); }
#nav a.on .n{ color:var(--ac); font-weight:800; }
#nav a.on .t{ color:var(--ac); font-weight:700; }
#nav a.hidden{ display:none; }
#nav .none{ padding:16px 10px; font-size:12.5px; color:var(--faint); }

#nav .nf{ flex:0 0 auto; padding:10px 16px; border-top:1px solid var(--ln);
          font-size:18px; color:var(--mut); line-height:1.65; }
#nav .nf b{ color:var(--ink); font-weight:800; }

/* 좌상단 탭 — 닫혀 있을 때 열기 손잡이 */
/* ★자가진단 패널 — D키. 개발자도구 없이 잘림 여부를 화면에서 확인 */
#diag{ position:fixed; right:16px; bottom:16px; z-index:90; max-width:420px;
       background:#1A1D23; color:#fff; border-radius:12px; padding:16px 18px;
       box-shadow:0 12px 40px rgba(0,0,0,.3); display:none; font-size:21px; line-height:1.6; }
#diag.on{ display:block; }
#diag h4{ margin:0 0 10px; font-size:15px; font-weight:800; }
#diag .ok{ color:#7BD6AE; font-weight:800; }
#diag .warn{ color:#FFC94D; font-weight:800; }
#diag ul{ margin:8px 0 0; padding-left:18px; max-height:220px; overflow:auto; }
#diag li{ margin:3px 0; font-variant-numeric:tabular-nums; }
#diag .hint{ margin-top:11px; padding-top:9px; border-top:1px solid rgba(255,255,255,.15);
             font-size:19.5px; color:rgba(255,255,255,.6); }
#diag b.jump{ color:#8FB4DD; cursor:pointer; text-decoration:underline; }
/* ⚠️ 좌측 상단 고정. 헤더 좌측(번호 배지·구간칩)과 겹치던 문제는
   ①탭에서 중복 페이지 카운터를 빼 폭을 줄이고 ②.hd .sec에 들여쓰기를 줘서 푼다 (2026-08-08) */
#navtab{ position:fixed; left:0; top:14px; z-index:71; display:flex; align-items:center; gap:7px;
         background:#fff; border:1px solid var(--ln2); border-left:0; border-radius:0 9px 9px 0;
         padding:9px 13px 9px 11px; cursor:pointer; box-shadow:2px 2px 12px rgba(0,0,0,.06);
         transition:transform .18s cubic-bezier(.4,0,.2,1); }
#navtab:hover{ background:var(--acbg); }
#navtab .bars{ display:flex; flex-direction:column; gap:3px; }
#navtab .bars i{ display:block; width:14px; height:2px; background:var(--ac); border-radius:1px; }
#navtab .lb2{ font-size:12px; font-weight:800; color:var(--ink); letter-spacing:.04em; }
body.navopen #navtab{ transform:translateX(322px); }
@media print{ #nav,#navtab{ display:none; } }
</style>

<body>
<div class="reveal"><div class="slides" id="slides"></div></div>

  <span class="lb2">목차</span>
</div>
<div id="diag"></div>
<nav id="nav">
  <div class="nh">
    <div class="nt"><b>3회차</b><span id="navCount">–</span></div>
    <div class="nj"><input id="navQ" type="text" placeholder="번호 또는 검색어…" autocomplete="off"></div>

ng: 10px 16px;\n\t\t\t\t}\n\n\t\t\t\t.speaker-controls-notes .value {\n\t\t\t\t\tmargin-top: 5px;\n\t\t\t\t\tline-height: 1.4;\n\t\t\t\t\tfont-size: 1.2em;\n\t\t\t\t}\n\n\t\t\t/* Layout selector */\n\t\t\t#speaker-layout {\n\t\t\t\tposition: absolute;\n\t\t\t\ttop: 10px;\n\t\t\t\tright: 10px;\n\t\t\t\tcolor: #222;\n\t\t\t\tz-index: 10;\n\t\t\t}\n\t\t\t\t#speaker-layout select {\n\t\t\t\t\tposition: absolute;\n\t\t\t\t\twidth: 100%;\n\t\t\t\t\theight: 100%;\n\t\t\t\t\ttop: 0;\n\t\t\t\t\tleft: 0;\n\t\t\t\t\tborder: 0;\n\t\t\t\t\tbox-shadow: 0;\n\t\t\t\t\tcursor: pointer;\n\t\t\t\t\topacity: 0;\n\n\t\t\t\t\tfont-size: 1em;\n\t\t\t\t\tbackground-color: transparent;\n\n\t\t\t\t\t-moz-appearance: none;\n\t\t\t\t\t-webkit-appearance: none;\n\t\t\t\t\t-webkit-tap-highlight-color: rgba(0, 0, 0, 0);\n\t\t\t\t}\n\n\t\t\t\t#speaker-layout select:focus {\n\t\t\t\t\toutline: none;\n\t\t\t\t\tbox-shadow: none;\n\t\t\t\t}\n\n\t\t\t.clear {\n\t\t\t\tclear: both;\n\t\t\t}\n\n\t\t\t/* Speaker layout: Wide */\n\t\t\tbody[data-speaker-layout=\"wide\"] #current-slide,\n\t\t\tbody[data-speaker-layout=\"wide\"] #upcoming-slide {\n\t\t\t\twidth: 50%;\n\t\t\t\theight: 45%;\n\t\t\t\tpadding: 6px;\n\t\t\t}\n\n\t\t\tbody[data-speaker-layout=\"wide\"] #current-slide {\n\t\t\t\ttop: 0;\n\t\t\t\tleft: 0;\n\t\t\t}\n\n\t\t\tbody[data-speaker-layout=\"wide\"] #upcoming-slide {\n\t\t\t\ttop: 0;\n\t\t\t\tleft: 50%;\n\t\t\t}\n\n\t\t\tbody[data-speaker-layout=\"wide\"] #speaker-controls {\n\t\t\t\ttop: 45%;\n\t\t\t\tleft: 0;\n\t\t\t\twidth: 100%;\n\t\t\t\theight: 50%;\n\t\t\t\tfont-size: 1.25em;\n\t\t\t}\n\n\t\t\t/* Speaker layout: Tall */\n\t\t\tbody[data-speaker-layout=\"tall\"] #current-slide,\n\t\t\tbody[data-speaker-layout=\"tall\"] #upcoming-slide {\n\t\t\t\twidth: 45%;\n\t\t\t\theight: 50%;\n\t\t\t\tpadding: 6px;\n\t\t\t}\n\n\t\t\tbody[data-speaker-layout=\"tall\"] #current-slide {\n\t\t\t\ttop: 0;\n\t\t\t\tleft: 0;\n\t\t\t}\n\n\t\t\tbody[data-speaker-layout=\"tall\"] #upcoming-slide {\n\t\t\t\ttop: 50%;\n\t\t\t\tleft: 0;\n\t\t\t}\n\n\t\t\tbody[data-speaker-layout=\"tall\"] #speaker-controls {\n\t\t\t\tpadding-top: 40px;\n\t\t\t\ttop: 0;\n\t\t\t\tleft: 45%;\n\t\t\t\twidth: 55%;\n\t\t\t\theight: 100%;\n\t\t\t\tfont-size: 1.25em;\n\t\t\t}\n\n\t\t\t/* Speaker layout: Notes only */\n\t\t\tbody[data-speaker-layout=\"notes-only\"] #current-slide,\n\t\t\tbody[data-speaker-layout=\"notes-only\"] #upcoming-slide {\n\t\t\t\tdisplay: none;\n\t\t\t}\n\n\t\t\tbody[data-speaker-layout=\"notes-only\"] #speaker-controls {\n\t\t\t\tpadding-top: 40px;\n\t\t\t\ttop: 0;\n\t\t\t\tleft: 0;\n\t\t\t\twidth: 100%;\n\t\t\t\theight: 100%;\n\t\t\t\tfont-size: 1.25em;\n\t\t\t}\n\n\t\t\t@media screen and (max-width: 1080px) {\n\t\t\t\tbody[data-speaker-layout=\"default\"] #speaker-controls {\n\t\t\t\t\tfont-size: 16px;\n\t\t\t\t}\n\t\t\t}\n\n\t\t\t@media screen and (max-width: 900px) {\n\t\t\t\tbody[data-speaker-layout=\"default\"] #speaker-controls {\n\t\t\t\t\tfont-size: 14px;\n\t\t\t\t}\n\t\t\t}\n\n\t\t\t@media screen and (max-width: 800px) {\n\t\t\t\tbody[data-speaker-layout=\"default\"] #speaker-controls {\n\t\t\t\t\tfont-size: 12px;\n\t\t\t\t}\n\t\t\t}\n\n\t\t</style>\n\t</head>\n\n\t<body>\n\n\t\t<div id=\"connection-status\">Loading speaker view...</div>\n\n\t\t<div id=\"current-slide\"></div>\n\t\t<div id=\"upcoming-slide\"><span class=\"overlay-element label\">Upcoming</span></div>\n\t\t<div id=\"speaker-controls\">\n\t\t\t<div class=\"speaker-controls-time\">\n\t\t\t\t<h4 class=\"label\">Time <span class=\"reset-button\">Click to Reset</span></h4>\n\t\t\t\t<div class=\"clock\">\n\t\t\t\t\t<span class=\"clock-value\">0:00 AM</span>\n\t\t\t\t</div>\n\t\t\t\t<div class=\"timer\">\n\t\t\t\t\t<span class=\"hours-value\">00</span><span class=\"minutes-value\">:00</span><span class=\"seconds-value\">:00</span>\n\t\t\t\t</div>\n\t\t\t\t<div class=\"clear\"></div>\n\n\t\t\t\t<h4 class=\"label pacing-title\" style=\"display: none\">Pacing – Time to finish current slide</h4>\n\t\t\t\t<div class=\"pacing\" style=\"display: none\">\n\t\t\t\t\t<span class=\"hours-value\">00</span><span class=\"minutes-value\">:00</span><span class=\"seconds-value\">:00</span>\n\t\t\t\t</div>\n\t\t\t</div>\n\n\t\t\t<div class=\"speaker-controls-notes hidden\">\n\t\t\t\t<h4 class=\"label\">Notes</h4>\n\t\t\t\t<div class=\"value\"></div>\n\t\t\t</div>\n\t\t</div>\n\t\t<div id=\"speaker-layout\" class=\"overlay-element interactive\">\n\t\t\t<span class=\"speaker-layout-label\"></span>\n\t\t\t<select class=\"speaker-layout-dropdown\"></select>\n\t\t</div>\n\n\t\t<script>\n\n\t\t\t(function() {\n\n\t\t\t\tvar notes,\n\t\t\t\t\tnotesValue,\n\t\t\t\t\tcurrentState,\n\t\t\t\t\tcurrentSlide,\n\t\t\t\t\tupcomingSlide,\n\t\t\t\t\tlayoutLabel,\n\t\t\t\t\tlayoutDropdown,\n\t\t\t\t\tpendingCalls = {},\n\t\t\t\t\tlastRevealApiCallId = 0,\n\t\t\t\t\tconnected = false\n\n\t\t\t\tvar connectionStatus = document.querySelector( '#connection-status' );\n\n\t\t\t\tvar SPEAKER_LAYOUTS = {\n\t\t\t\t\t'default': 'Default',\n\t\t\t\t\t'wide': 'Wide',\n\t\t\t\t\t'tall': 'Tall',\n\t\t\t\t\t'notes-only': 'Notes only'\n\t\t\t\t};\n\n\t\t\t\tsetupLayout();\n\n\t\t\t\tlet openerOrigin;\n\n\t\t\t\ttry {\n\t\t\t\t\topenerOrigin = window.opener.location.origin;\n\t\t\t\t}\n\t\t\t\tcatch ( error ) { console.warn( error ) }\n\n\t\t\t\t// In order to prevent XSS, the speaker view will only run if its\n\t\t\t\t// opener has the same origin as itself\n\t\t\t\tif( window.location.origin !== openerOrigin ) {\n\t\t\t\t\tconnectionStatus.innerHTML = 'Cross origin error.<br>The speaker window can only be opened from the same origin.';\n\t\t\t\t\treturn;\n\t\t\t\t}\n\n\t\t\t\tvar connectionTimeout = setTimeout( function() {\n\t\t\t\t\tconnectionStatus.innerHTML = 'Error connecting to main window.<br>Please try closing and reopening the speaker view.';\n\t\t\t\t}, 5000 );\n\n\t\t\t\twindow.addEventListener( 'message', function( event ) {\n\n\t\t\t\t\tclearTimeout( connectionTimeout );\n\t\t\t\t\tconnectionStatus.style.display = 'none';\n\n\t\t\t\t\tvar data = JSON.parse( event.data );\n\n\t\t\t\t\t// The overview mode is only useful to the reveal.js instance\n\t\t\t\t\t// where navigation occurs so we don't sync it\n\t\t\t\t\tif( data.state ) delete data.state.overview;\n\n\t\t\t\t\t// Messages sent by the notes plugin inside of the main window\n\t\t\t\t\tif( data && data.namespace === 'reveal-notes' ) {\n\t\t\t\t\t\tif( data.type === 'connect' ) {\n\t\t\t\t\t\t\thandleConnectMessage( data );\n\t\t\t\t\t\t}\n\t\t\t\t\t\telse if( data.type === 'state' ) {\n\t\t\t\t\t\t\thandleStateMessage( data );\n\t\t\t\t\t\t}\n\t\t\t\t\t\telse if( data.type === 'return' ) {\n\t\t\t\t\t\t\tpendingCalls[data.callId](data.result);\n\t\t\t\t\t\t\tdelete pendingCalls[data.callId];\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t\t// Messages sent by the reveal.js inside of the current slide preview\n\t\t\t\t\telse if( data && data.namespace === 'reveal' ) {\n\t\t\t\t\t\tif( /ready/.test( data.eventName ) ) {\n\t\t\t\t\t\t\t// Send a message back to notify that the handshake is complete\n\t\t\t\t\t\t\twindow.opener.postMessage( JSON.stringify({ namespace: 'reveal-notes', type: 'connected'} ), '*' );\n\t\t\t\t\t\t}\n\t\t\t\t\t\telse if( /slidechanged|fragmentshown|fragmenthidden|paused|resumed/.test( data.eventName ) && currentState !== JSON.stringify( data.state ) ) {\n\n\t\t\t\t\t\t\tdispatchStateToMainWindow( data.state );\n\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\n\t\t\t\t} );\n\n\t\t\t\t/**\n\t\t\t\t * Updates the presentation in the main window to match the state\n\t\t\t\t * of the presentation in the notes window.\n\t\t\t\t */\n\t\t\t\tconst dispatchStateToMainWindow = debounce(( state ) => {\n\t\t\t\t\twindow.opener.postMessage( JSON.stringify({ method: 'setState', args: [ state ]} ), '*' );\n\t\t\t\t}, 500);\n\n\t\t\t\t/**\n\t\t\t\t * Asynchronously calls the Reveal.js API of the main frame.\n\t\t\t\t */\n\t\t\t\tfunction callRevealApi( methodName, methodArguments, callback ) {\n\n\t\t\t\t\tvar callId = ++lastRevealApiCallId;\n\t\t\t\t\tpendingCalls[callId] = callback;\n\t\t\t\t\twindow.opener.postMessage( JSON.stringify( {\n\t\t\t\t\t\tnamespace: 'reveal-notes',\n\t\t\t\t\t\ttype: 'call',\n\t\t\t\t\t\tcallId: callId,\n\t\t\t\t\t\tmethodName: methodName,\n\t\t\t\t\t\targuments: methodArguments\n\t\t\t\t\t} ), '*' );\n\n\t\t\t\t}\n\n\t\t\t\t/**\n\t\t\t\t * Called when the main window is trying to establish a\n\t\t\t\t * connection.\n\t\t\t\t */\n\t\t\t\tfunction handleConnectMessage( data ) {\n\n\t\t\t\t\tif( connected === false ) {\n\t\t\t\t\t\tconnected = true;\n\n\t\t\t\t\t\tsetupIframes( data );\n\t\t\t\t\t\tsetupKeyboard();\n\t\t\t\t\t\tsetupNotes();\n\t\t\t\t\t\tsetupTimer();\n\t\t\t\t\t\tsetupHeartbeat();\n\t\t\t\t\t}\n\n\t\t\t\t}\n\n\t\t\t\t/**\n\t\t\t\t * Called when the main window sends an updated state.\n\t\t\t\t */\n\t\t\t\tfunction handleStateMessage( data ) {\n\n\t\t\t\t\t// Store the most recently set state to avoid circular loops\n\t\t\t\t\t// applying the same state\n\t\t\t\t\tcurrentState = JSON.stringify( data.state );\n\n\t\t\t\t\t// No need for updating the notes in case of fragment changes\n\t\t\t\t\tif ( data.notes ) {\n\t\t\t\t\t\tnotes.classList.remove( 'hidden' );\n\t\t\t\t\t\tnotesValue.style.whiteSpace = data.whitespace;\n\t\t\t\t\t\tif( data.markdown ) {\n\t\t\t\t\t\t\tnotesValue.innerHTML = marked( data.notes );\n\t\t\t\t\t\t}\n\t\t\t\t\t\telse {\n\t\t\t\t\t\t\tnotesValue.innerHTML = data.notes;\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t\telse {\n\t\t\t\t\t\tnotes.classList.add( 'hidden' );\n\t\t\t\t\t}\n\n\t\t\t\t\t// Update the note slides\n\t\t\t\t\tcurrentSlide.contentWindow.postMessage( JSON.stringify({ method: 'setState', args: [ data.state ] }), '*' );\n\t\t\t\t\tupcomingSlide.contentWindow.postMessage( JSON.stringify({ method: 'setState', args: [ data.state ] }), '*' );\n\t\t\t\t\tupcomingSlide.contentWindow.postMessage( JSON.stringify({ method: 'next' }), '*' );\n\n\t\t\t\t}\n\n\t\t\t\t// Limit to max one state update per X ms\n\t\t\t\thandleStateMessage = debounce( handleStateMessage, 200 );\n\n\t\t\t\t/**\n\t\t\t\t * Forward keyboard events to the current slide window.\n\t\t\t\t * This enables keyboard events to work even if focus\n\t\t\t\t * isn't set on the current slide iframe.\n\t\t\t\t *\n\t\t\t\t * Block F5 default handling, it reloads and disconnects\n\t\t\t\t * the speaker notes window.\n\t\t\t\t */\n\t\t\t\tfunction setupKeyboard() {\n\n\t\t\t\t\tdocument.addEventListener( 'keydown', function( event ) {\n\t\t\t\t\t\tif( event.keyCode === 116 || ( event.metaKey && event.keyCode === 82 ) ) {\n\t\t\t\t\t\t\tevent.preventDefault();\n\t\t\t\t\t\t\treturn false;\n\t\t\t\t\t\t}\n\t\t\t\t\t\tcurrentSlide.contentWindow.postMessage( JSON.stringify({ method: 'triggerKey', args: [ event.keyCode ] }), '*' );\n\t\t\t\t\t} );\n\n\t\t\t\t}\n\n\t\t\t\t/**\n\t\t\t\t * Creates the preview iframes.\n\t\t\t\t */\n\t\t\t\tfunction setupIframes( data ) {\n\n\t\t\t\t\tvar params = [\n\t\t\t\t\t\t'receiver',\n\t\t\t\t\t\t'progress=false',\n\t\t\t\t\t\t'history=false',\n\t\t\t\t\t\t'transition=none',\n\t\t\t\t\t\t'autoSlide=0',\n\t\t\t\t\t\t'backgroundTransition=none'\n\t\t\t\t\t].join( '&' );\n\n\t\t\t\t\tvar urlSeparator = /\\?/.test(data.url) ? '&' : '?';\n\t\t\t\t\tvar hash = '#/' + data.state.indexh + '/' + data.state.indexv;\n\t\t\t\t\tvar currentURL = data.url + urlSeparator + params + '&postMessageEvents=true' + hash;\n\t\t\t\t\tvar upcomingURL = data.url + urlSeparator + params + '&controls=false' + hash;\n\n\t\t\t\t\tcurrentSlide = document.createElement( 'iframe' );\n\t\t\t\t\tcurrentSlide.setAttribute( 'width', 1280 );\n\t\t\t\t\tcurrentSlide.setAttribute( 'height', 1024 );\n\t\t\t\t\tcurrentSlide.setAttribute( 'src', currentURL );\n\t\t\t\t\tdocument.querySelector( '#current-slide' ).appendChild( currentSlide );\n\n\t\t\t\t\tupcomingSlide = document.createElement( 'iframe' );\n\t\t\t\t\tupcomingSlide.setAttribute( 'width', 640 );\n\t\t\t\t\tupcomingSlide.setAttribute( 'height', 512 );\n\t\t\t\t\tupc {sec:'면접 · 왜 지금',t:'list',kick:'<b>새로 조사하실 것 없습니다</b> — 이미 두 군데서 보셨거든요',h:'시장이 <em>어디로 가는지</em> — <em>공고</em>에서 한 번, <em>거리</em>에서 한 번',items:[['①','<b>공고</b>에서 — 새 직무 · 인원 · 없던 낱말<small>지난 시간 숙제로 돌린 <b>[P7]</b> 출력 그대로 — 「그 <em>회사</em>가 어디에 사람을 붓는지」</small>'],['②','<b>거리</b>에서 — <b>답사 메모</b><small>성수에서 다섯 곳을 같은 눈으로 봤습니다 — 뭘 앞세우고 뭘 포기했는지. 그게 「<em>시장</em>이 움직인 자국」입니다</small>'],['③','<b>모르는 것은 모른다고 씁니다</b><small>✓본 것과 →추론을 갈라서 — 지난 시간 그 표기 그대로</small>']],sub:'공고 셋만으로 시장을 다 안다고 말하면 — <b>면접관이 바로 압니다</b>',land:'<b>공고는 그 회사 · 거리는 시장</b> — 둘이 같은 쪽을 가리킬 때만 「방향」이라고 말합니다',say:['①은 빠르게 — “이건 지난주 숙제로 다 하신 거예요”','②에서 <b>한 박자</b> — “근데 공고만 보면 그 «회사»만 알아요”','“<b>시장</b>은 밖에서 봐야 보이고요 — 지난 시간에 성수에서 하신 게 그거예요”','⛔<b>세 개로 시장을 다 안다고 말하지 말 것</b> — ③이 그 안전장치다'],note:'★★<b>2026-08-18 전면 재구성(강사 지적).</b> 강사: <i>“저 3가지 가지고 시장이 어디로 가는지 절대로 알 수 없다. 실무적으로.”</i><br>  옛 items 셋은 <b>전부 채용공고 신호</b>였다 — 그건 「그 <b>회사</b>의 방향」이지 「<b>시장</b>의 방향」이 아니다.<br>  그리고 2회차가 <b>답사 메모로 시장 읽는 법</b>(2화 80·84번)을 가르쳐 놓고 3회차가 <b>한 번도 안 불렀다.</b><br>  → ①공고 축 · ②거리 축(2회차 자산 회수) · ③<b>모르는 건 모른다</b>(과장 방지)로 갈랐다.<br>  ⚠️<b>[P7] 회차 표기 교정</b> — 배포는 1회차 끝(7_배포자료), <b>실제로 돌리는 건 2회차 숙제</b>(2화 157번)다. 옛 sub의 「1회차 [P7]로 뽑아본」은 틀린 말이었다.<br>★<b>2026-08-12 신설(증량 — 매핑 B-0).</b> 48번 note가 재료(2회차 [P6] ③산업칸)는 짚었지만 “방향을 어떻게 읽나”의 방법이 화면에 없었다.<br>★<b>2026-08-18 글자량</b> — sub 「— 지원 목록에 있습니다」는 바로 아래 land(“있는 걸 다시 봅니다”)와 뜻이 겹쳐 say로 옮김.<br>★<b>2026-08-18 문장 손질</b> — h가 이미 「새로 조사 안 해도 됩니다」라 착지가 같은 말로 시작했다 → 착지는 할 일 쪽만 남겼다. 발화는 대본 그대로 두 번 말해도 된다.'},
