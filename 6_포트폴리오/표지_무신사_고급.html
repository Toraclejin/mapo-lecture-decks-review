<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<title>표지 — 무신사 성수 (실사)</title>
<style>
@font-face{ font-family:'Pretendard Variable'; font-weight:45 920; font-style:normal;
  font-display:swap; src:url('../_assets/PretendardVariable.woff2') format('woff2-variations'); }
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  background:#26221E; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
.serif{ font-family:'EB Garamond',Georgia,serif; }
.cover{ position:relative; width:100%; max-width:680px; aspect-ratio:3/4; overflow:hidden;
  border-radius:3px; box-shadow:0 30px 80px rgba(0,0,0,.42); }
.cover img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:52% 40%;
  /* 그레이딩 — 밋밋한 흐린날 → 에디토리얼 */
  filter:contrast(1.04) saturate(.86) brightness(1.0); }
/* 미묘한 웜-쿨 그레이드 */
.grade{ position:absolute; inset:0; z-index:1; mix-blend-mode:soft-light;
  background:linear-gradient(180deg,#3f5a72 0%,transparent 48%,#6a4830 100%); opacity:.38; }
.scrim{ position:absolute; inset:0; z-index:2;
  background:linear-gradient(180deg,rgba(16,14,12,.5) 0%,rgba(16,14,12,0) 20%,rgba(16,14,12,.04) 46%,rgba(16,14,12,.6) 78%,rgba(16,14,12,.9) 100%); }
.frostband{ position:absolute; left:0; right:0; bottom:0; height:52%; z-index:2;
  backdrop-filter:blur(5px) saturate(1.02); -webkit-backdrop-filter:blur(5px) saturate(1.02);
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 40%); mask-image:linear-gradient(180deg,transparent 0%,#000 40%);
  background:linear-gradient(180deg,transparent 0%,rgba(14,12,10,.52) 100%); }
.in{ position:absolute; inset:0; z-index:3; padding:clamp(30px,5vw,56px);
  display:flex; flex-direction:column; justify-content:space-between; color:#F6F1E9; }
.mast{ display:flex; justify-content:space-between; align-items:baseline; }
.mast .m{ font-weight:700; font-size:clamp(15px,2.2vw,19px); letter-spacing:.02em; text-shadow:0 1px 12px rgba(0,0,0,.5); }
.mast .m small{ display:block; font-family:'EB Garamond',serif; font-style:italic; font-weight:400; font-size:12.5px; letter-spacing:.03em; color:#E4DBCD; margin-top:3px; }
.mast .i{ font-family:'EB Garamond',serif; font-size:15px; letter-spacing:.02em; color:#EFE7DA; font-weight:500; text-shadow:0 1px 8px rgba(0,0,0,.6); }
.kick2{ font-family:'EB Garamond',serif; font-style:italic; font-size:clamp(14px,2vw,17px); color:#EAD9C6; letter-spacing:.02em; margin-bottom:14px; text-shadow:0 1px 10px rgba(0,0,0,.5); }
.btm h1{ font-size:clamp(38px,8vw,66px); line-height:1.02; font-weight:680; letter-spacing:-.028em;
  text-shadow:0 3px 30px rgba(0,0,0,.5); }
.btm h1 em{ font-style:normal; color:#E9A882; font-weight:720; }
.lines{ margin-top:22px; padding-top:18px; border-top:1px solid rgba(246,241,233,.28); display:flex; flex-direction:column; gap:10px; max-width:34ch; }
.lines div{ font-size:clamp(13px,1.9vw,15.5px); font-weight:550; letter-spacing:.005em; text-shadow:0 1px 12px rgba(0,0,0,.6); }
.lines b{ font-family:'EB Garamond',serif; font-style:italic; color:#EDBE9E; font-weight:500; font-size:1.15em; margin-right:11px; }
</style></head>
<body>
<div class="cover">
  <img src="../이미지/포폴/성수_표지.jpg" alt="무신사 스토어 성수 — 옛 벽돌 창고">
  <div class="grade"></div>
  <div class="scrim"></div>
  <div class="frostband"></div>
  <div class="in">
    <div class="mast"><div class="m">성수 역설계<small>Reverse-Engineering Field Study</small></div><div class="i serif">No. 01</div></div>
    <div class="btm">
      <div class="kick2 serif">Seongsu, Seoul — 2026.07.04</div>
      <h1>지붕을 벗긴 <em>백화점</em></h1>
      <div class="lines">
        <div><b>01</b> 팬이 향을 못 맡고 나온 5분</div>
        <div><b>02</b> 게이트가 곧 상품이 되는 동네</div>
        <div><b>03</b> 다이칸야마가 말하는, 성수의 «다음»</div>
      </div>
    </div>
  </div>
</div>
</body></html>
